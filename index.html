“Koi bhi chhota-mota bahana banakar apni kaksha se bahar nikal aao aur ek ghodagadi kiraye par le lo. Hamari gali mein aisi jagah aakar theharna jahan tumhe mere ghar ka koi sadasya na dekh sake.”

Himalaya mein mere saath jaane ki yojana banane vale uchch madhyamik vidyalay ke apne sahpathi Amar Mitter ko mera yeh antim nirdesh tha. Apne palayan ke liye hum logon ne agla din tay kiya tha. Anantada mujh par kadi drishti rakhte the, isliye savdhani bartana aavashyak tha. Unhe poora sandeh tha ki mere man mein bhaag jaane ki prabal ichchha hai, aur ve meri yojana ko viphal banane ke liye kritsankalp the. Taaviz chupchap apna karya karta hua mere andar adhyatmik ufaan la raha tha. Mujhe aasha thi ki Himalaya mein mujhe apne ve guru mil jayenge jinka chehra prayah mujhe apne antarman ke divya darshanon mein dikhayi deta tha.

Pitaji ka sthayi roop se Kolkata mein sthanantran ho gaya tha aur ab hamara parivar wahin rah raha tha. Pitrisattak Bhartiya parampara ke anusar Anantada bhi apni navvadhu ke saath hamare ghar mein rahne aa gaye the. Wahan main attari par sthit ek chhote-se kamre mein nitya dhyan karke apne man ko Ishwaranusandhan ke liye taiyar kar raha tha.

Us avismarniy din ka uday amangalkari varsha ke saath hua. Sadak par Amar ki ghoda-gadi ki awaaz sunte hi maine jaldi-jaldi ek kambal mein ek joda khadaun, do kaupin, ek japmala, Lahiri Mahashay ki photo aur Bhagavad Gita ki ek prati baandh li. Yeh potli maine teesri manzil ki apni khidki se neeche phenk diya. Main bhagte hue seedhiyon se neeche utra aur dwar par machhli kharid rahe chachaji ki bagal se aage badh gaya.

“Kya jaldi hai?” Unhone sashank drishti se mujhe upar se neeche tak dekha.

Bina koi uttar diye ek udaseen muskan ke saath unki or dekhte hue main gali ki or chal pada. Apni potli uthakar shadyantrakari savdhani bartata hua main Amar se ja mila. Hum gadi mein baithkar shahar ke ek bazaar kshetra Chandni Chowk mein gaye. Angrezi poshak kharidne ke liye hum kai mahinon se apne pratidin jalpan ke liye milnevale thode-thode paise bachate aaye the. Hum jaante the ki mere chalak bhai ek guptachar ki bhoomika nibha sakte hain, isliye European poshak pehankar hum unhe chakma dena chahte the.

Station jate-jate raaste mein hum sabhi mere chachere bhai Jatin Ghosh, jinhe main Jatin da kehta tha, ke liye ruke. Ve naye-naye hi hamare panthanuyayi bane the aur Himalaya mein kisi guru ki sharan prapt karne ke aakankshi bane the. Hamare paas pehle se taiyar naya suit unhone pehan liya. Ab hamein koi nahi pehchan sakta, humne socha! Hamare man gahre ullas se khil uthe.

“Bas, ab keval canvas jooton ki kami hai.” Main un dono ko ek dukaan par le gaya jahan rubber ke tale lage joote sajaaye gaye the. “Aisi pavitra yatra mein jeev-hatya dwara prapt hui chamde ki cheezein nahi le jani chahiye.” Apni Bhagavad Gita ki chamde ki jild aur vilayati hat par lage chamde ke feete nikal kar phenkne ke liye main bahar sadak par ruk gaya.

Station par hum logon ne Bardwan ke ticket kharide. Hum Bardwan mein Himalaya ke charanon mein sthit Haridwar jaane ke liye gadi badalne vale the. Jab gadi bhi hum logon ke saman hi bhagne lagi, to maine apni kuch mahan aashaon ko shabd pradaan kiye.

“Jara kalpana to karo!” Maine utsah-purvak kaha. “Mahan guruon se deeksha lekar hum log Brahmachaitanya ki samadhi ka anubhav karenge. Hamare shareeron mein aisi chumbakiya shakti paida ho jayegi ki Himalaya ke vanya pashu paltoo janwaron ki bhaanti hamare paas aayenge. Bagh hamara dulaar pane ki prateeksha mein baithi rahnewali gharelu nireeh billiyon se adhik kuch na honge!”

Bhavishya ka chitra prastut karne vala yeh varnan, jise main lakshanik tatha vastavik, dono drishtiyon se chittamohak maan raha tha, Amar ke hoton par utsahpoorn muskan le aaya. Parantu Jatin da ne apni drishti doosri or ghumaa li aur khidki se bahar bhagte hue prakritik drishyon ko dekhne lage.

“Paise ko teen hisson mein baant lete hain.” Jatin da ne is prastav ke saath apne deergh maun ko toda. “Bardwan mein hamein apne ticket alag-alag kharidne chahiye. Isse kisi ko sandeh nahi hoga ki hum log saath-saath bhaag rahe hain.”

Main bina kisi aashanka ke sahmat ho gaya. Suryast ke samay hamari train Bardwan station par ruki. Jatin da ticket-ghar mein ghus gaye; Amar aur main platform par baithe rahe. Hum logon ne pandrah minat tak prateeksha ki, aur phir unke vishay mein nishphal poochtaach ki. Charon or khoj lene ke baad hum logon ne bhay-vyakul hokar jor-jor se Jatin da ko awaazen diin. Parantu ve to us chhote-se station ke charon or phaile andhkar mein na jaane kahan lupt ho gaye the.

Main poornatah ghabraya gaya aur is aaghat se mere haath-paanv phool gaye. Bhagavan ko bhi yeh nirashajanak ghatna manzoor thi? Bhagavan ke liye mere pratham suniyojit palayan ke romanchak avsar par vishad ka nirmam saya pad chuka tha.

“Amar! Hamein ghar laut jana chahiye.” Main chhote bachche ki tarah ro raha tha. “Jatin da ka nishthur prayaan anishtasuchak sanket hai. Viphal hona hi is yatra ki niyati hai.”

“Yahi hai tumhara Ishwar-prem? Ek vishwasghati saathi ke roop mein li gayi chhoti-si pareeksha ko bhi tum sah nahi sakte?”

Amar dwara ise Ishwariy pareeksha bataye jaane par mera man shant hua. Humne Bardwan ke suvikhyat Sitabhog aur Motichoor ka nashta kiya.

Kuch hi ghanton mein hum Bareilly hokar Haridwar jaane vali gadi mein baith gaye. Agle din Mughalsarai mein humne gadi badalte hue. Jab hum platform par prateeksha kar rahe the, tab humne ek mahatvapoor n vishay par vichar-vimarsh kiya.

“Amar, sambhav hai ki sheeghra hi hamein railway adhikariyon ki gahri poochtaach ka samna karna pade. Main apne bhai ki chaturai ko kam mahattva nahi deta. Parinaam chahe jo bhi ho, main jhooth nahi bolunga.”

“Mukund, mera tumse itna hi anurodh hai ki tum chup rahna. Main jab unse baat karoon, to tum muskurana ya hansna nahi.”

Itne mein hi ek European railway adhikari mere paas aaya. Usne ek tar-patra hila kar mujhe dikhaya jiska aashay main turant samajh gaya.

“Kya tum log gusse mein ghar se bhaag rahe ho?”

“Ji nahi!” Main prasann tha ki uske chune hue shabdon ne mujhe suspasht uttar dene ki anumati de di. Main jaanta tha ki krodh nahi, balki “daivi-vairagya” mere is aswabhavik vyavhaar ka karan tha.

Phir vah adhikari Amar ki or muda. Un dono ke beech buddhi-chatur y ka jo dwandwa hua use sunte hue nirvikar gambheerya banaye rakhne ke anurodh ka palan karna mere liye kathin se kathintar hota gaya.

Adhikari ne apni awaaz mein apne adhikar ko poori tarah dhvanit karte hue poocha: “Teesra ladka kahan hai? Chalo, sach bolo!”

“Sahab! Aapne chashma pehna hua hai. Kya phir bhi aapko dikhayi nahi deta ki hum keval do hi hain?” Amar dhrishtata-purvak muskaraya. “Main koi jadugar nahi hoon ki ek teesra ladka nikal doon.”

Adhikari ne, is dhrishtata se spasht roop se hadbada kar, aakraman ka naya paintra liya. “Tumhara naam kya hai?”

“Mujhe Thomas kehte hain. Main Angrez mata aur Bhartiya dharmantarit Isai pita ki santaan hoon.”

“Tumhare mitra ka kya naam hai?”

“Main use Thomson kehta hoon.”

Ab to andar hi andar meri hansi charam seema tak pahunch chuki thi. Main kisi se kuch kahe bina train ki or chal pada jo Bhagavan ki daya se prasthan karne ke liye seeti baja rahi thi. Amar bhi us adhikari ke saath mere peeche-peeche hi chala aaya jo ab uski baaton par itna vishvas karne laga tha ki usne shishtata-purvak hamein European logon ke liye nirdharit dibbe mein aaram se bitha diya. Spasht tha ki do ardh-Angrez balakon ko Hindustaniyon ke dibbe mein yatra karte dekhna uske liye kashtadayak tha. Uske wahan se vinay-purvak prasthan karne ke baad main seat par let gaya aur jor-jor se hasta raha. Ek anubhavi Angrez adhikari ko buddhi-chatur y mein maat dene ka anandpoorn santosh Amar ke chehre par vyapt tha.

Platform par maine tar ko chor-drishti se padh liya tha. Tar mere bhai Anant ka tha. Usmein likha tha: “European poshak pehne teen Bangali ladke ghar se bhaagkar Mughalsarai ke marg se Haridwar ki or ja rahe hain. Mere pahunchne tak unhe kripa roke rakhein. Aapki sevaon ke liye yogya puraskar diya jayega.”

“Amar! Maine tumhe kaha tha ki nishan lagaye hue time-table ko ghar mein mat chhodna.” Meri aankhon mein narazgi thi. “Mere bhaiya ko avashya hi wahan aisa koi time-table mil gaya hoga.”

Mere mitra ne jhenpkar is daant ko sweekar kiya. Hum thodi der ke liye Bareilly mein ruke jahan Dwarka Prasad* Anant dwara bheji ek tar ke saath hamari prateeksha kar raha tha. Dwarka ne hamein rok rakhne ka bharpoor prayas kiya kintu maine use achchhi tarah vishvas dila diya ki humne yeh palayan hansi-mazaak ke taur par shuru nahi kiya tha. Pehle ki bhaanti is baar bhi Dwarka ne hamare saath Himalaya bhaag chalane ka prastav sweekar nahi kiya.

* Prishth 21 dekhein.

Usi raat jab hamari gadi ek station par khadi hui thi aur main ardhanidrit avastha mein tha, tab poochtaach karte ek aur adhikari ne aakar Amar ko jaga diya. Vah bhi “Thomas” aur “Thomson” namon ke indrajal mein phans gaya. Bhor hote-hote gadi ne hamein safalta-purvak Haridwar pahuncha diya. Hamein apni or bulate gauravshali parvat kuch doori par aspasht dikhayi de rahe the. Hum log tezi se bhagte hue station se bahar nikle aur nagar ki swatantra bheed mein pravisht ho gaye. Hamara pehla kaam tha deshi poshak dharan karna, kyunki Anantada ko kisi prakar hamare European chhadmavesh ka pata lag gaya tha. Pakde jaane ke poorvabhas mere man par bojh ban raha tha.

Haridwar se turant nikal jana hi upyukt mankar humne sadiyon se anekanek santon ki charanraj se pavitra hue Rishikesh jaane ke liye ticketein kharid liin. Main pehle hi train mein baith gaya tha, jabki Amar abhi peeche platform par hi tha. Ek police wale ne pukarkar use rok liya. Vah avanchhit pratipalak hamein police station ke bangale mein le gaya aur usne hamare sab paise le liye. Usne shishtata-purvak yeh spasht kiya ki mere bade bhai ke aane tak hamein wahan rokkar rakhna uska kartavya tha.

Yeh jaankar ki in do bhagodon ka gantavya sthal Himalaya tha, us sipahi ne ek adbhut ghatna sunayi.

“Main dekh raha hoon ki tum santon ke deewane ho! Abhi kal hi meri jis sant se mulakat hui thi, us se bada sant tumhe kabhi nahi milega. Mere ek sahyogi aur main unse pehli baar paanch din pehle mile the. Ek vishesh hatyare ki teevr khoj mein hum Ganga ke paas gasht laga rahe the. Use zinda ya murda pakadne ka hamein aadesh tha. Us ke bare mein hamein sirf yeh hi gyaat tha ki teerthayatriton ko lootne ke liye vah sadhu ka chhadmavesh dharan kar bhram raha hai. Apne saamne thodi hi doori par humne ek aakriti dekhi jo us aparadhi ke varnan se milti-julti thi. Jab vah hamare aadesh par nahi ruka to use pakadne ke liye hum log daude. Uske peeche pahunchkar maine us par poori shakti se farse ka vaar kar diya. Uska dahina haath katkar uske shareer se lagbhag poornatah alag ho gaya.

“Aashcharya yeh hai ki kisi prakar ki koi awaaz nikale bina aur us bhayankar ghaav par drishti bhi daale bina vah ajnabi apni tez gati se chalta hi raha. Jab hum lapak kar uske saamne khade ho gaye, to usne shant bhaav se kaha:

“‘Jis hatyare ki tumhe talash hai, vah main nahi hoon.’

“Yeh dekhkar mujhe gahra aaghat laga ki maine divya purush-se deekhnevale ek sant ke shareer ko ghayal kar diya tha. Main unke charanon mein sashtang lot gaya aur katar swar mein kshamayachna karne laga tatha tezi se nikalte khoon ki dhaar ko rokne ke liye maine apni pagdi ka kapda unhe diya.

“‘Beta! Tumhari bhool swabhavik hi thi.’ Us mahapurush ne meri or daya aur sneh se dekhte hue kaha. ‘Jao aur pashchatap mat karo. Parampriya Jagannata meri dekhbhaal kar rahi hain.’ Unhone apni latakti bhuja ko pakadkar uske sthan par lagaya aur chamatkar! Vah jud gayi; aur aashcharyajanak roop se rakt-pravah bhi turant band ho gaya.

“‘Teen din baad mujhse us ped ke neeche aakar milo. Tum mujhe poornatah swasth paoge. Is prakar tumhe pashchatap nahi rahega.’

“Kal hi main apne sahyogi ke saath wahan gaya tha. Vah sant wahin the aur unhone hamein apni baah ka nireekshan karne diya. Wahan par na to ghaav ka koi chinh tha, na hi chot ka koi lakshan!

“‘Main Rishikesh hote hue Himalaya ke nirjan pradeshon mein ja raha hoon.’ Mahatma ne wahan se turant prasthan karte hue hamein aashirvad diya. Mujhe lagta hai ki unki pavit rata se mera jeevan bhi unnat ho gaya hai.”

Us afsar ne pavitra udgar ke saath apni katha samaapt ki; uske anubhav ne spashtata uske bheetar ki nayi gehrai yon ko chhoo liya tha. Ek prabhavshali dhang se usne us chamatkar ke sambandh mein chhapi hui samachar patra ki katar an mujhe di. Ek sansanikhez samachar-patra mein sadharantaya jis tarah tod-marodkar samachar prakashit kiye jate hain (khed hai ki iska Bharat mein bhi abhav nahi hai), usi tarah sanvad-data ne bhi apne vivaran mein ghatna ko kuch badha-chadha kar chhap diya tha: usmein likha tha ki sadhu ka sir hi dhad se lagbhag alag ho gaya tha!

Amar ko aur mujhe atyant khed hua ki hum aise mahan yogi ke darshan-labh se vanchit rah gaye, jinhone apne par atyachar karne vale ko bhi Isa Masih ke saman kshama kar diya. Bharatvarsh pichhli do shatabdiyon se aarthik drishti se bhale hi gareeb ho gaya ho, parantu abhi bhi uske paas daivi sampada ka akshay bhandar hai. Kabhi-kabhi is police adhikari sansarik log bhi adhyatmik jagat ke gaganchumbi vyaktitvon ke anayas hi darshan pa jate hain.

Apni is adbhut kahani se hamara samay bitane ke liye humne police adhikari ka dhanyavad kiya. Sambhavatah vah hamein soochit kar raha tha ki vah humse adhik bhagyavan tha: use anayas hi ek aatmagyani sant ke darshan ho gaye the, jab ki hamari utkat khoj ne hamein kisi siddh purush ke charanon mein nahi, balki ek ghatiya police station mein pahuncha diya tha!

Himalaya ke kitne nikat, kintu phir bhi bandhan mein hone ke karan kitne door! Maine Amar se kaha ki is bandhan se mukt hone ke liye mera man dugune utsah se jor maar raha hai.

“Avsar milte hi, yahan se khisak chale. Punyateerth Rishikesh tak to hum paidal bhi ja sakte hain.” Protsahan dene ke liye main muskaraya.

Parantu mera mitra usi samay nirashavadi ban gaya tha, jaise hi humse paise ka majboot sahara chheen liya gaya tha.

“Yadi hum aise khatarnak jungle se paidal chale, to us sadhu-santon ke nagar mein nahi, balki baghon ke pet mein pahunch jayenge!”

Anant aur Amar ke bhai teen din baad pahunche. Amar ne mukti ke anand se apne bhai ka sasneh swagat kiya. Parantu mujhe is punarmilan mein koi ruchi nahi thi; Anant ko mujh se kathor ulahne ke atirikt aur kuch nahi mila.

“Tumhare man ki bhavna main samajhta hoon.” Anantada santvanatmak shabdon mein bole. “Main tumse keval itna hi chahta hoon ki tum ek baar mere saath Banaras chalo, wahan ek vishesh sant se mil lo aur wahan se phir kuch dinon ke liye dukhit pitaji se milne Kolkata chale jao. Us ke baad tum yahan apne guru ki khoj punah aarambh kar sakte ho.”

Yahan par Amar hamare vartaalap mein tapak pada; usne kaha ki mere saath punah Haridwar aane ka uska koi irada nahi hai. Vah parivarik sneh-sudha ka upbhog kar raha tha. Parantu mujhe vishvas tha ki main kabhi bhi apne guru ki khoj ka parityag nahi karunga.

Hamari mandali Banaras ke liye railgadi par sawar ho gayi. Wahan mujhe apni prarthana ka ek adbhut aur pratyaksh uttar mil gaya.

Anantada ne pehle se hi ek kaushalpoorn vyoohrchana kar rakhi thi. Haridwar mein mujh se milne se pehle ve Banaras mein utar gaye the aur wahan unhone ek shastrapandit se milkar mujhe usse upadesh dilane ki vyavastha kar rakhi thi. Pandit aur unke suputra ne bhi, mujhe sannyas path se virat kar dene ka prayas karne ka Anant da ko vachan de rakha tha.

Anantada mujhe unke ghar le gaye. Panditji ke ati utsahi swabhavvale yuva putra ne aage badhkar aangan mein hi mera swagat kiya usne mujhe ek lambe darshanik tark-vitark mein uljha liya. Apni ateendriya drishti se mere bhavishya ko dekh pane ka dava karte hue unhone mere sannyasi banne ke vichar par asahmati prakat ki.

“Yadi tum apne sadharan uttardayitvon ko tyag dene ka hath karoge to nirantar durbhagya ka shikar banoge aur Ishwar ko pane mein asamarth rahoge! Sansarik anubhav ke bina tum apne poorv karmon ko samaapt nahi kar sakte.”

Uttar mein Bhagavad Gita ke sanatan shabd mere hoton par ubhar aaye:

“Yadi koi atishay durachari bhi ananya bhaav se mujhe bhajta hai; to uske pichhle dushkarmon ka prabhav sheeghra hi nasht ho jata hai. Mahatma bankar vah sheeghra shashvat shanti ko prapt karta hai. He Kunti-putra, tum yeh nishchit roop se jaan lo: jo bhakt mujhmein poorn vishvas rakhta hai uska kabhi vinash nahi hota.”*

Kintu us yuvak dwara dridhta-purvak ki gayi bhavishyavani ne mere vishvas ko thoda-sa hila diya tha. Apne hridaya ki poorn bhakti se maine man hi man Ishwar se prarthana ki:

“Abhi yahin aur isi kshan meri saari vyagrata ko door kar mujhe uttar do, tum kya chahte ho, main sannyasi ka jeevan vyateet karoon ya sansari manushya ka?”

Panditji ke ghar ki chahardewari ke nikat hi bahar maine ek udatt badan sadhu ko khade dekha. Spashtata unhone mere aur swaghosit divya drashta ke beech ka vartaalap sun liya tha, kyunki unhone aparichit hote hue bhi mujhe apne paas bulaya. Unke prashant netron se maine ek prachand shakti ko pravahit hote maine anubhav kiya.

“Vats! Us moodh ki baatein mat suno. Tumhari prarthana ke pratyuttar swaroop Ishwar mujhe tumhe yeh aashwasan dene ka nirdesh de rahe hain ki tumhare jeevan ka ekmev marg sannyas hi hai.”

Vismay aur kritagyata ke saath is nirnayayak sandesh par main prasannata se muskaraya.

“Us aadmi se door hokar idhar chale aao!” Aangan se vah “moodh” mujhe bula raha tha. Mere us santvat margdarshak ne aashirvad mudra mein haath uthaya aur ve dheere-dheere chale gaye.

* Adhyay 9, Shlok 30-31

“Vah sadhu bhi tumhare saman pagal hi hai.” Yeh manojna tippani karne vale shwetkeshdhari Panditji the. Ve aur unke suputra meri or shochneey drishti se dekh rahe the. “Maine suna hai ki usne bhi Ishwar ki sandigdh khoj ke liye apna ghar-baar chhod diya hai.”

Maine munh pher liya. Anant da ki or mudkar maine kaha ki main in logon se aur kisi tark mein nahi ulajhna chahta. Mere hatotsahit bhai tatkal prasthan ke liye maan gaye. Hum log sheeghra hi Kolkata jaanevali gadi par sawar ho gaye.

“Shreeman Guptacharji! Yeh to batayiye ki aapko kaise pata chala ki main do saathiyon ke saath bhaga hoon?” Maine apni ubalti jigyasa shant karne ke liye ghar jate hue raaste mein Anantada se poocha. Ve shararat bhare dhang se muskaraye.

“Tumhare school mein mujhe pata chala ki Amar apni kaksha se bahar chala gaya tha aur lautkar nahi aaya tha. Main agle din subah uske ghar gaya aur wahan ek nishan lagaya hua ek time-table khoj nikala. Amar ke pita usi samay ghodagadi se bahar ja rahe the aur coachwan se baatein kar rahe the.

“‘Aaj mera beta school jaane ke liye mere saath gadi mein nahi aayega. Vah gayab ho gaya hai!’” Pita ne dukhbhare swar mein kaha.

“‘Maine ek saathi coachwan se suna hai ki aapka beta aur do anya ladke European poshak pehne Howrah station mein ek gadi mein chadkar kahin chale gaye hain.’ Coachwan ne kaha, ‘Apne chamde ke joote unhone us coachwan ko de diye.’

“Is prakar mujhe teen sootra mil gaye — time-table, teen ladkon ki mandali aur Angrezi vesh.”

Anantada ke rahasyodghatanon ko main hansi aur kheejh ke milejule bhaavon ke saath sun raha tha. Coachwan ke prati hamari udarta kuch apatra daan hi thehri.

“Yeh to swabhavik hi tha ki maine Amar dwara time-table mein nishan lagaye gaye shaharon ke railway-adhikariyon ko tatkal tar bhej diye. Usne Bareilly par bhi nishan lagaya tha, isliye maine wahan tumhare dost Dwarka ko tar bhej diya tha. Kolkata mein apne pados mein poochtaach karne par mujhe pata chala ki hamare chachere bhai Jatin da ek raat ke liye gayab rahe par doosre din subah hi Angrezi vesh mein vapas aa gaye the. Maine unhe khoja aur bhojan par nimantrit kiya. Unhone mere mantra-poorn vyavhaar se nihsank hokar nimantran sweekar kiya. Raaste mein sandeh-rahit dhang se main unhe ek police station mein le gaya. Wahan unhe anek police adhikariyon ne gher liya jinhe maine unki daravni surat ke karan pehle se hi chun rakha tha. Unki bhayavah drishti ke aage Jatin da apne rahasyatmak vyavhaar ka spashtikaran dene ke liye taiyar ho gaye.

“‘Adhyatmik bhavnamay utsah mein main Himalaya ki or chal pada’, unhone kaha. ‘Siddh mahatmaon ke darshanon ke vichar ne mere antahkaran ko prerna se bhar diya tha. Parantu jaise hi Mukund ne kaha, “Himalaya ki gufaon mein jab hum samadhi mein baith jayenge, tab bagh bhi vashibhoot hokar hamare ird-gird paltoo billiyon ki bhaanti baithenge,” to mera sara josh thanda ho gaya aur lalat par paseene ki boondein jhalakne lagi. Maine socha: “Tab kya hoga? Yadi hamare yogbal se hinsr baghon ka swabhav nahi badal saka to kya ve hamare saath gharelu billiyon-ka-sa aacharan karenge?” Apne manaschakshu mein maine pehle se hi swayam ko kisi bagh ke pet ke balat antarvasi ke roop mein dekha; wahan sampoor n shareer ke saath ek hi baar mein pravesh karke nahi balki shareer ke vividh hisson ki anek kiston mein!’”

Jatin da ke adrishya ho jaane ke karan jo mera krodh tha, vah hansi mein badal gaya. Unhone mujhe jo santap diya tha uska sara moolya railgadi mein mile lotpot karnevale spashtikaran se chukta ho gaya. Mujhe sweekar karna padega ki mujhe is baat se kuch santosh avashya hua ki Jatin da bhi police ki khatirdari se nahi bache the!

“Anantada! Aap janmjat guptachar hain!” Meri vinodpoorn drishti poornatah krodh-rahit nahi thi. “Aur main Jatin da se kahunga ki mujhe khushi hai ki ve vishwasghat ke kisi uddeshya se nahi, jaisa ki prateet hota tha, balki keval aatmaraksha ki satark sahaj-pravritti se prerit hue the!”

Kolkata mein ghar pahunchne par pitaji ne atyant marmsparshi dhang se mujhse anurodh kiya ki kam se kam uchch vidyalay ki padhai poori kar lene tak main apne ghoomte paanon par ankush lagaoon. Meri anupasthiti mein unhone ek santvat mahatma Pandit Swami Kevalanandaji ke niyamit hamare ghar aane ki vyavastha ki ek prem-purvak yojana banayi thi.

“Ye rishitulya mahatma tumhare Sanskrit shikshak honge,” pitaji ne vishvast dhang se ghoshana ki.

Pitaji ko aasha thi ki ve meri adhyatmik pipasa ek vidwan darshanik se shiksha dilakar shant kar denge. Parantu parinaam rahasyapoorn dhang se ulta hua: mere navniyukt shikshak mujhe shushk bauddhik gyaan dene ke badle meri Ishwarakanksha ke angaaron ko hawa dene lage. Pitaji ko yeh gyaat nahi tha ki Swami Kevalanandaji Lahiri Mahashay ke ek unnat shishya the. Us adwitiya guru ke sahasron shishya the jo unki amogh daivi shakti ke chumbakiya prabhav se apne aap unki or aakarshit ho gaye the. Mujhe baad mein gyaat hua ki Lahiri Mahashay Kevalanandaji ko prayah rishi kahkar sambodhit karte the.*

* Jab Kevalanandaji se meri bhet hui tab unhone sannyas grahan nahi kiya tha. Samanyatah sabhi unhe “Shastri Mahashay” ke naam se sambodhit karte the. Lahiri Mahashay aur Master Mahashay (Prakaran 9) ke namon ke saath samya ke karan koi sambhram utpann na ho isliye main apne Sanskrit shikshak ka ullekh keval unke sannyasottar naam “Swami Kevalanandaji” se kar raha hoon. Unki jeevan-katha haal hi mein Bangali bhasha mein prakashit hui hai. Bangal ke Khulna zile mein 1863 mein janme Kevalanandaji ne adsath varsh ki aayu mein apne shareer ka Banaras mein tyag kiya. Unka parivarik naam Ashutosh Chatterjee tha.

Lambe munghrale kesh mere shikshak ke sundar mukh-mandal ki shobha badha rahe the. Unki kali aankhein shishu-netron ki bhaanti nishchhal aur bholi thin. Unke chharahre shareer ki sab gatividhiyon mein ek prashant gambheerta thi. Sadaiv shant aur snehamay Kevalanandaji anant Brahma ke chaitanya mein dridhta ke saath sthir ho gaye the. Hum dono ke sahvas ke anek anandmay prahar gahre Kriya Yoga dhyan mein beette the.

Kevalanandaji prachin shastron ke supratishthit pandit the; unke is agadh gyaan ke karan hi unhe Shastri Mahashay ki upaadhi mili thi jiske dwara ve prayah sambodhit kiye jate the. Parantu Sanskrit panditya mein meri pragati anullekhneey thi. Main sada isi suyog ki taak mein rahta tha ki kis tarah neeras vyakaran se jaan bache aur yog tatha Lahiri Mahashay ki charcha shuru ho. Mere shikshak mahoday ne ek din Lahiri Mahashay ke saath bitaye gaye apne jeevan ke bare mein kuch batane ka anugrah kiya.

“Mujhe das varsh tak Lahiri Mahashay ke paas rahne ka durlabh saubhagya prapt hua tha. Banaras mein unka ghar mera ratrikaaleen isht teerthasthan tha. Neeche ke talle par saamne vali chhoti-si baithak mein ve sada virajman rahte the. Lakdi ki chowki par padmasan mein baithe hue ve apne shishyon se ek mala ki bhaanti ardhvrittakar mein ghire rahte the. Unki aankhein chamakti hui tatha Ishwariy anand se nachti rahti thin. Unki sadaiv ardhonmeelit rahnewali aankhein bheetar ke doordarshi golak mein se sada shashvat-anand ke lok mein jhankti rahti thin. Ve kadachit hi adhik samay ke liye bolte the. Yada-kada unki drishti kisi aise shishya par kendrit ho jati jise sahayata ki aavashyakta hoti thi; tab shantiprad vachan unke mukh se prakash ke himprapat ki bhaanti jharne lagte.

“Gurudev ke ek drishtipat matra se mere andar ek avarnaneey shanti khil uth ti thi. Main unki sugandh se bhar jata tha jaise vah anant ke kisi padm ki sugandh ho. Unke saath anekanek dinon tak ek shabd bhi bole bina bhi rahna ek aisa anubhav tha jo mere sampoor n astitva ko parivartit kar deta. Yadi meri ekagrata mein koi adrishya badha aa khadi hoti to guru ke charanon mein dhyan karne baith jata. Wahan sabse sookshm avasthaon ka bhi mujhe sahajbodh ho jata. Aisi anubhutiyan mujhe nimntar koti ke guruon ke sannidhya mein nahi hoti thin. Gurudev Ishwar ke sajeev mandir the jinke guptdwar bhakti ke madhyam se sabhi shishyon ke liye khule rahte the.

“Lahiri Mahashay shastron ke pustakeey teekakar nahi the. Ve sahaj hi ‘daivi pustakalay’ mein doobki laga lete the. Shabdon ka phen aur vicharon ki fuharen unki sarvagya ta ke fakkare se phoot padte the. Vedon* mein yugon pehle astaman hue gahan darshanon ke vigyan ke rahasyon ko kholne ka adbhut kaushal unhe prapt tha. Prachin shastron mein ullekh it chetna ke vividh staron ko samjhane ka anurodh karne par ve muskarakar sweekar kar lete the.

“‘Main abhi un avasthaon mein pravesh karta hoon aur apni anubhutiyan tumhe batata hoon.’ Is prakar ve un guruon se bilkul vipreet the jo shastron ko kanthasth kar bina kisi vastavik anubhuti ke apni kalpana se hi unka arth batate hain.

“‘Shlokon ka arth tumhe jis roop mein samajh aaye, usi prakar unki vyakhya karo.’ Mitbhashi Gurudev prayah apne paas baithe kisi shishya ko yeh nirdesh dete. ‘Main tumhare vicharon ko parichalit karunga taaki sahi arth tumhare mukh se uchcharit ho.’ Is prakar Lahiri Mahashay ki anek anubhutiyon ko unke vividh shishyon ne vist rit bhashyon sahit lipibaddh kar liya.

“Kisi baat par aankh band kar vishvas kar lene ki salah Guruvar kabhi nahi dete the. ‘Shabd khokhle hain,’ ve kehte the. ‘Ishwar ki upasthiti ke dridh vishvas ko dhyan mein apne paramanandmay sampark se prapt karo.’

“Shishya ki samasya chahe jo bhi ho, us ke samadhan ke liye Gurudev Kriya Yoga ke abhyas ka hi paramarsh dete the.

“‘Tumhara margdarshan karne ke liye jab main is shareer mein nahi rahoonga tab bhi is yaugik kunji ka samarthy a kam nahi hoga. Yeh pravidhi bhavy prernaon ki tarah jild baandhkar, almari mein rakhkar, bhool jaane ki vastu nahi hai. Kriya Yoga ke madhyam se anavarat apne muktipath par chalte jao. Jis (Kriya) ki shakti iske abhyas mein nihit hai.’

“Main swayam Kriya ko manav ke abhi tak swatah prayas dwara anant Ishwar ki khoj ke liye vikasit sadhanon mein sabse adhik prabhavshali manta hoon.” Kevalanandaji ne is utsahpoorn praman ke saath apna kathan samapan kiya. “Is ke abhyas se sabhi manushyon mein chhipe sarvavyapi Ishwar Lahiri Mahashay aur unke anek shishyon ki deh mein pratyaksh roop mein avasthit hue prakat.”

Isa Masih ki tarah ek chamatkar Lahiri Mahashay dwara Kevalanandaji ki upasthiti mein hua. Ek din unhone vah kahani mujhe sunayi. Saamne mez par padi Sanskrit ki pustakon se hati unki aankhein sudoor kahin lagi hui thin.

“Ek drishtihin shishya Ramu ke liye main karunardrata anubhav karne laga. Kya uski aankhon ki jyoti kabhi lautkar nahi aa sakti, jab vah itni shraddha evam nishtha ke saath hamare Gurudev ki seva kar raha tha, jinmein Ishwaratva apne poorn tej ke saath deeptiman tha? Ek din subah main Ramu se baat karna chah raha tha, parantu vah shanti-purvak ghanton tak Gurudev par pankha jhalta raha. Antatah jab vah kamre se bahar nikla to main uske peeche ho liya.

“‘Ramu! Tum kab se andhe ho?’

“‘Janm se hi, Mahashay! Meri aankhon ko kabhi bhi sooryadarshan ka saubhagya prapt nahi hua.’

“‘Hamare sarvashaktiman guru tumhari sahayata kar sakte hain. Ek baar unse prarthana to karo.’

“Agle din Ramu kuch sankoch-purvak Lahiri Mahashay ki seva mein upasthit hua, kintu apne atul adhyatmik aishvarya mein sharirik sampada ko jodne ka anurodh karna use lagbhag lajjasp ad lag raha tha.

“‘Gurudev! Brahmand ko prakash denevala Ishwar aap mein vidyaman hai. Main aapse prarthana karta hoon ki us ki jyoti meri aankhon ko bhi pradaan karen taaki main soorya ke gaun tej ko dekh sakoon.’

“‘Ramu! Kisi ne mujhe kathin parishiti mein daalne ki yojana banayi hai. Mere paas kisi ko swasth karne ki koi shakti nahi hai.’

“‘Gurudev! Aapmein virajman anant Ishwar nishchay hi mujhe swasth kar sakte hain.’

“‘Yeh to sachmuch alag baat hai, Ramu! Ishwar ki koi seema nahi hai. Vah jo taron ko chamak deta hai aur shareer-koshikaon mein rahasyamay pranshakti sancharit karta hai, nishchay hi vah tumhare netron ko bhi jyoti pradaan kar sakta hai.’ Tatpashchaat Gurudev ne Ramu ke mathe par dono bhaunhon ke beech mein sparsh kiya.*

* Divya chakshu ya triteeya netra ka sthan. Mrityu ke samay manushya ki chetna sadharantaya isi pavitra sthan ki or aakrisht ho jati hai; mritakon ki aankhein upar ki or uthi hone ka yahi karan hai.

“‘Apne man ko yahan kendrit rakho aur saat dinon tak barambar Ramnaam ka jap karo. Soorya ka vaibhav tumhare liye vishesh ushakal ka drishya prastut karega.’

“Aur ek saptah mein theek aisa hi hua. Ramu ne prakriti ke sundar roop ko pratham baar dekha. Sarvagy Gurudev ne apne shishya ko Ramnaam japne ka aadesh diya kyunki Ram hi uske ishtadevata the. Ramu ke vishvas ne bhakti se joti hui zameen ka kaam kiya jismein Gurudev ka sthayi roop se swasth kar dene vala shaktishali beej ankurit ho gaya.”

Kevalanandaji ne kshanbhar maun rahne ke baad guru ke charanon mein ek aur shraddhasuman arpit kiya.

“Lahiri Mahashay ne jitne bhi chamatkar kiye, un sab mein ek baat spasht roop se pata chalti thi ki unhone aham tattva* ko kabhi bhi swayam ko karan-tattva ya karta nahi manne diya. Sarvochch rog-nivaarak shakti, arthat Ishwar ke prati poorn aatmasamarpan ke karan Gurudev us shakti ka apne mein se mukt roop se pravahit hona sulabh bana dete the.

* Ahamtattva ya ahankar (shabdashah, main karta hoon) hi manushya aur uske srashta ke beech prateet honevale viyog ya dvaitvad ka mool karan hai. Ahankar manushya ko Maya ke adheen kar deta hai jiske karan karma karnewala (ahamtattva) hi karan hone ka aabhas hota hai; aur srisht jeev apne ko hi srashta mante hain.

Naiva kinchitkaromeeti yukto manyeta tattvavit |  
Pashyan shrinvan sprishan jighran ashnan gacchan svapan shvasan || 8 ||  
Pralapan visrijan grihnann unmishan nimishann api |  
Indriyani indriyartheshu vartanta iti dharayan || 9 ||  

— Srimad Bhagavad Gita Adhyay 5

Tattva ko jaannevala, Ishwar ke saath ek hone ke karan swayamev anubhav karta hai ki “main swayam kuch bhi nahi karta” — jab ki vah dekhta hai, sunta hai, chalta hai, sota hai, shwas leta hai, bolta hai, asweekar karta hai, rakhta hai, aankhein kholta aur band karta hai — kyunki vah samajh jata hai ki ye to keval indriyan hain jo (prakriti dwara karyanvit hokar) indriya-vishayon mein apna-apna kaam kar rahi hain.

Yah pashyati tathatmanam akartaram sa pashyati || 29 ||  

— Srimad Bhagavad Gita Adhyay 13

“Jo purush sampoor n karmon ko sab prakar se prakriti ke dwara hi kiye jate hue dekhta hai aur aatma ko akarta dekhta hai, vahi yatharth dekhta hai.”

“Lahiri Mahashay ne jin anekanek shareeron ko chamatkarpoorn dhang se swasth kiya unhe antatah chitagni ki jwalaon ka bhakshya ban na hi pada. Parantu unhone logon ke antar mein jo adhyatmik jagriti utpann ki, jo Isa-saman shishya taiyar kiye, wahi unke ajaramar chamatkar hain.”

Main Sanskrit ka vidwan kabhi nahi bana, Kevalanandaji ne mujhe usse bhi bhavy-divya bhasha padha di.

Ajo’pi sannavyayatma bhutanam ishvaro’pi san |  
Prakritim svam adhishthaya sambhavamy atmamayaya || 6 ||  

— Srimad Bhagavad Gita Adhyay 4

Main ajanma aur avinashi-swaroop hote hue bhi tatha samast praniyon ka Ishwar hote hue bhi apni prakriti ko adheen karke apni yogmaya se prakat hota hoon.

Daivim hy esha gunamayi mama maya duratyaya |  
Mam eva ye prapadyante mayam etam taranti te || 14 ||  

— Srimad Bhagavad Gita Adhyay 7

Yeh alaukik arthat ati adbhut trigunmayi meri Maya badi dustar hai; parantu jo log keval mujh ko hi nirantar bhajte hain, ve is Maya ko langh jate hain arthat sansar se tar jate hain.

Gandhbaba ke Chamatkari Pradarshan

“Is sansar mein har vastu ki ek vishesh ritu aur har kaam ka ek samay hota hai.”*

Apne man ko santvana dene ke liye Solomon† ka yeh gyaan us samay mujhe prapt nahi tha; ghar se bahar jahan kahin bhi main ghoomne jata, meri aankhein apne ird-gird mere liye niyat guru ko dhoondhti rahti. Parantu meri high school ki padhai poorn hone tak meri unse bhet na ho saki.

Amar ke saath Himalaya ki or palayan aur Sri Yukteswarji ke mere jeevan mein aagman ke mahan divas ke beech do varsh vyateet ho gaye. Is beech main anek sadhu santon se mila — “Gandhbaba”, “Baghswami”, Nagendranath Bhadudi, Master Mahashay, aur vishvavikhyat Bangali vaigyanik Jagadish Chandra Bose.

Gandhbaba ke saath meri bhet ki do bhoomikayein thin; inmein se ek saamanjasyapoor n thi aur doosri vinodpoorn.

“Ishwar saral hai. Anya sab kuch jatil hai. Prakriti ke sapeksh jagat mein nirpeksh moolyon ki aasha mat karo.”

Jab main mandir mein Kali Mata** ki moorti ke saamne maun khada tha tab yeh darshanik nishkarsh komal swar mein mere kaanon mein pravisht hua.

* Bible: Madhopadeshak 3:1

† Israel ke Isai-poorv dasvi shatabdi ke ek prakrimi raja. Unhone itni vivekyukt buddhi aur nyaypoorn reeti se rajya kiya ki unka naam buddhimani ka samanarthak ban gaya.

** Kali Mata prakriti mein vyapt akshay aadhar ka prateek hai. Paramparagat roop se unhe paramsatta arthat Bhagavan Shiv ki bhoomishayi deh ke upar khadi chaturbhuji stri ke roop mein chitrit kiya jata hai, kyunki prakriti ya hum prapanchamay vishva ki samast kriyaein nirgun Brahma se utpann hoti hain. Char bhujaein srishti mein nihit dvait ke mool aadhar-bhoot gunon ka pratinidhitva karti hain — do kalyanakari, do vinashkari.

Palatkar maine dekha to mere samaksh ek lambe kad ka vyakti khada tha jiske kapdon se, ya unke abhav se, aisa lagta tha ki vah koi parivrajak sadhu tha.

“Aapne sachmuch mere vicharon ke sambhram ko jaan liya!” Main kritagyata-purvak muskaraya. “Prakriti ke kalyanakar aur bhayankar roopon ki uljhan ne, jinka prateek Kali hai, mujhse adhik buddhiman logon ko bhi asamanjas mein daal diya hai.”

“Bahut hi kam log uske rahasya ka bhed pate hain! Achchha aur bura to pratyek manushya ki buddhi ko chunauti denevali vah paheli hai jise jeevan ne uske saamne ek Sphinx* ki bhaanti rakh diya hai. Is paheli ko suljhane ka koi prayas bhi kiye bina adhikansh log apni mrityu ke roop mein iska dand bhar dete hain. Yeh dand aaj bhi utna hi lagu hota hai jitna Thebes ke dinon mein tha. Kabhi-kabhar ekadh atyant uchch vyaktitva parajay asweekar kar deta hai. Dvait ki Maya† se vah advait ka avibhajit satya kheench leta hai.”

“Aap ke shabdon mein dridh vishvas dikhta hai, Maharaj!”

“Gyaanprapti ke teevr dukhdayi marg, arthat satyanishth aatmapareekshan ka maine deerghkaal tak abhyas kiya hai. Aatmapareekshan ya apne vicharon par nirantar nirmam drishti rakhna, ek kathor aur jhakjhorne vala anubhav hai. Yeh balvan se balvan ahankar ko bhi choor-choor kar deta hai. Parantu sachcha atmavishleshan ganit ke niyamon ki bhaanti siddh purush utpann karne ka karya karta hai. Apne vicharon se ati prem evam vyaktigat manyataon mein dridhta ka marg ahankariyon ka nirmaan karta hai jo Ishwar aur srishti ki apne dhang se vyakhya karna apna adhikar samajhte hain.”

“Aisi ahankaryukt maulikata ke saamne to satya nishchit hi vinamrata-purvak peeche hat jata hai,” maine kaha. Mujhe is charcha mein anand aa raha tha.

“Manushya jab tak apne duragrahon se mukt nahi ho jata, tab tak vah kisi shashvat satya ko nahi samajh sakta. Shatabdiyon se jama ho rahe keechad mein sana manavi man asankhya sansarik mayabhramon se vyapt ghrinajanak jeevan se bharpoor hai. Yahan yuddhshetra ki bheeshan ladai bhi feeki pad jati hai jab manushya pehli baar apne antah-shatruon ka virodh karta hai. Ye koi sadharan marne vale shatru nahi hain jinhe susajjit senaon ki sahayata se kabu mein kiya ja sake. Vishakt pranghatak astron se susajjit ye sarvavyapi, aviram karya karnevale andh vasnaon ke sipahi manushya ka neend mein bhi peecha karte hue hum sab ko dharashayi kar dene ka avsar khojte rahte hain. Vicharheen hai vah manushya jo sarvasamanya niyati ke aage aatmasamarpan kar apne aadarshon ka gala ghot deta hai. Kya use napunsak, nishpran, manavjati par kalank ke atirikt aur kuch kaha ja sakta hai?”

“Poojyavar! Kya vishrant, kinkartavyavimoodh janasadharan ke liye aapke man mein koi sahanubhuti nahi hai?”

Sadhu Maharaj palbhar ke liye chup rahe, phir seedha uttar dena taalkar bole:

“Adrishya Ishwar, jo saare sadgunon ka bhandar hai, aur drishyaman manushya, jismein prayah ek bhi sadgun nazar nahi aata — in dono se ek saath prem karna prayah vyakti ko chakara deta hai. Parantu vilakshan buddhi ka samarthy a bhi kam nahi hota. Antahkaran ka shodh sheeghra hi sab logon ke man ki ekat a ko prakat kar deta hai — swarthi uddeshyon ki samanta. Kam se kam is ek arth mein manav ki vishvabandhuta ka parichay milta hai. Ahankar ko poornatah pachhad dene vala yeh samanta ka aavishkar manushya ke man mein bhayachakit vinamrata utpann karta hai. Yeh vinamrata vikasit hote-hote aatma ki niramaykarini shaktiyon ke anusandhan ki or koi dhyan na denevale apne jatibandhavon ke prati sahanubhuti mein parivartit ho jati hai.”

“Maharaj! Sab yugon ke sant aap hi ke saman jagat ke dukhon se vyakul hue hain.”

“Keval tuccha vyakti hi doosron ke jeevan ke dukhon ke prati sanvedansheelata kho baith ta hai kyunki vah apne hi sankirn dukhon mein dooba rahta hai.” Sadhu ka ugra roop kafi saumya ho gaya tha. “Jo kisi doctor dwara ki janevali cheer-phaad ki bhaanti apne vicharon ki cheerphaad kar man ka gahra pareekshan karega, vahi apne bheetar sabke liye daya vikasit hoti dekhega. Tab use ahankar ki nitya kolahalkari mangon se mukti mil jayegi. Aisi hi manobhoomi par Ishwar ka prem khilta hai. Tab vah jeev apne srashta ki or mudta hai, kisi aur baat ke liye nahi to keval apni vyatha ki tadap mein yeh poochne ke liye: ‘Kyon, Prabhu, kyon?’ Dukh ke manmardanakari kode kha-khakar manushya antatah us Vidhata ke samaksh pahunch hi jata hai jiska saundarya matra hi manushya ko apni or aakrisht karne ke liye paryapt hai.”

Ukt sadhu aur main Kolkata ke Kalighat mandir mein vartaalap kar rahe the jahan main us mandir ka vikhyat saundarya evam bhavyata dekhne gaya tha. Mandir ki alankarik shobha ki or haath se ishara karte hue us saare vaibhav ko sadhu ne nishprayojya thehraya.

“Eentein aur gara hamein koi shravaneey sur nahi suna sakte; keval antar se uthne vali awaaz se hi hridaya ke kapaat khulte hain.”

Man ko aakrisht karnewali dhoop ka anand lene ke liye hum pravesh dwar ki or gaye jahan bhakton ke jhundon ka aavagaman chal raha tha.

“Tum abhi yuva ho.” Sadhu Maharaj kuch sochte hue meri or dekh rahe the. “Bharat bhi yuva hai. Prachin rishiyon ne adhyatmik jeevan sheeli ke amit aadarsh sthapit kiye the. Unke mahan upadesh aaj ke samay aur desh ke liye paryapt hain. Unke anushasan-niyam na to aaj ke lokachar ke viruddha hain, na hi aise hain ki bhautikvad ki dhoortata ko bhi kritrim lagen aur isiliye aaj bhi Bharat par unki pakad majboot hai. Lajjit panditgan jitne kaal ka hisab laga sakte hain, usse bhi kahin adhik kaal se — sahasrabdiyon se — sanshayasheel samay ne Vedon ki yogyata ki pushti ki hai. Inhe apni virasat ke roop mein grahan karo.”

Jab main is vakpatu sadhu se savinay vida le raha tha tab unhone ek ateendriya anubhuti mujhe batayi:

“Yahan se jaane ke baad tumhe aaj ek asaadharaan anubhav hoga.”

Mandir ke ahate se bahar nikal kar main niruddeshya yoon hi chalane laga. Mudkar doosre ek raaste par badha hi tha ki ek purane parichit se bhet ho gayi. Ye mahashay un mahabhagon mein se ek the jinki sambhashan shakti samay ki or koi dhyan na dete hue anant kaal ka aalingan karti hai.

“Main tumhe jaldi hi chhod doonga,” usne vachan diya, “yadi tum jaldi-jaldi mujhe hamare bichhudne ke baad ke varshon mein kya-kya hua vah sab bata do.”

“Parasparvirodhi baatein! Ab to mujhe jana hi padega.”

Parantu usne mera haath pakad liya aur thoda-thoda karke mujhse jankari lene laga. Ye bhookhe bhediye se kam nahi hai, maine kautuk se man hi man socha; jitna adhik main batata jata tha utna hi adhik samachar jaanne ki uski bhookh badhti jati thi. Man hi man main jaldi chhutkara pane ka koi upay karne ki prarthana Maa Kali se karne laga.

Achanak vah mujhe chhodkar jaane laga. Maine thandi saans li aur use vachalta ka jwar phir kahin chadh na aaye, is bhay se duguni gati se chalane laga. Apne peeche drutgati ki padchap sunnkar maine apni gati aur badha di. Mudkar peeche dekhne ka sahas mujhse nahi hua. Parantu ek chhalang lagakar vah mere saath ho liya aur anand se usne mera kandha pakad liya.

“Main tumhe Gandhbaba ke bare mein batana to bhool hi gaya. Ve us saamne vale makaan mein rahte hain.” Kuch hi gaz ki doori par sthit ek makaan ki or usne ishara kiya. “Unse avashya milo; bade dilchasp aadmi hain. Tumhe koi asaadharaan anubhav ho sakta hai. Achchha! Chalta hoon,” aur vah sachmuch chala gaya.

Kalighat mandir mein lagbhag inhi shabdon mein sadhu dwara ki gayi bhavishyavani mere mastishk mein kaundh uthi. Kautuhalvash main us makaan ke andar gaya to mujhe ek prashast daalan mein le jaya gaya. Wahan ek mote naranji rang ke galeeche par kafi log idhar-udhar baithe hue the, jaise sadharantaya Bharat mein baithte hain. Ek aadaryukt fusfusahat mere kaanon se takrayi:

“Wahan jo cheete ki khal par baithe hain, vahi Gandhbaba hain. Ve kisi gandhheen phool mein kisi bhi phool ki prakritik sugandh bhar sakte hain ya kisi murjhaye phool ko phir se taza kar sakte hain ya kisi manushya ki twacha se manohari sugandh nikalwa sakte hain.”

Maine seedhe us sant ki or dekha; unki drishti bhi usi samay mujhpar sthir hui. Ve krishnavarn aur sthoolkay the. Unke chehre par dadhi thi aur aankhein badi-badi tatha tejasvi thin.

“Beta! Tumhe dekhkar main prasann hua. Bolo tumhe kya chahiye? Koi sugandh chahiye?”

“Kislie?” Mujhe unki baatein bachkani-si lagiin.

“Chamatkarpoorn dhang se sugandh ka anand lene ke liye.”

“Sugandh banane ke liye Bhagavan ka upyog?”

“To usmein kya hai? Bhagavan vaise bhi sugandh to banate hi hain.”

“Ji haan! Parantu ve har baar taza sugandh lene ke liye aur lene ke baad phenk dene ke liye phoolon ki komal pankhudiyon roopi sheeshiyon ka nirmaan karte hain. Kya aap phoolon ka nirmaan kar sakte hain?”

“Haan! Parantu sadharantaya main sugandh hi nikalta hoon.”

“Tab to itr ke karakhane band ho jayenge.”

“Meri or se unhe apna dhandha karte rahne ki anumati hai! Mera apna uddeshya to keval Ishwar ki shakti dikhana hai.”

“Maharaj! Kya Ishwar ki shakti ka praman dena aavashyak hai? Kya ve sakal vishva mein sarvatra apne chamatkar nahi kar rahe hain?”

“Kar rahe hain, parantu unki anant srijnatmak vividhta mein se kuch to srijnatmakta hamein bhi prakat karni chahiye.”

“Yeh siddhi prapt karne mein aapko kitna samay laga?”

“Barah varsh.”

“Daivi shakti se keval sugandh banane ke liye! He Mahatman! Mujhe to lagta hai aapne barah varsh vyarth ganwa diye un sugandhon ke liye jinhe aap kisi bhi phoolwale ki dukaan se kuch hi rupayon mein prapt kar sakte hain.”

“Phoolon ki sugandh unke saath hi chali jati hai.”

“Mrityu ke saath bhi sugandh chali jati hai. Main kisi aisi sugandh ki kamna kyon karoon jo keval shareer ko sukh deti hai?”

“Darshanik Mahashay! Tumne mere man ko prasann kar diya. Ab apna dahina haath aage badhao.” Unhone aashirvad-mudra mein apna haath uthaya.

Main Gandhbaba se kai gaz door tha; koi anya vyakti bhi mere itne nikat nahi tha ki mere shareer ka sparsh kar sake. Maine apna haath aage badhaya jise us yogi ne chhua tak nahi.

“Kaun-si sugandh chahiye?”

“Gulab.”

“Tathastu.”

Mere aashcharya ka thikana na raha jab meri hatheli ke madhya se gulab ki madhur sugandh teevrta ke saath nikalne lagi. Maine muskarate hue paas hi ki ek phooldani se ek gandhheen shwet pushp nikal liya.

“Kya is gandhheen phool mein chameli ki sugandh bhari ja sakti hai?”

“Tathastu.”

Tatshan us phool se chameli ki sugandh uthi. Maine chamatkari sant ka dhanyavad kiya aur unke ek shishya ke paas jakar baith gaya. Us shishya ne mujhe bataya ki Gandhbaba ne, jinka naam Swami Vishuddhananda tha, Tibet ke ek yogi se anek aashcharyajanak siddhiyan prapt kar li thin. Usne mujhe yeh bhi bataya ki us Tibbati yogi ki aayu ek hazaar varsh se adhik thi.

“Us mahan guru ke shishya Gandhbaba hamesha hi keval sadharan uchcharan se sugandh nirmaan nahi karte jaisa tumne abhi dekha.” Shishya ke bolne mein apne guru ke prati garv prakat tha. “Vyakti ke swabhav ke anusar ve bhinn-bhinn paddhatiyan apnate hain. Baba asamanya hain! Kolkata ke anek padhe-likhe log unke shishya hain.”

Maine man hi man nishchay kiya ki main un shishyon ki sankhya mein apne ko jodkar us sankhya ki aur adhik vriddhi nahi karunga. Guru ka aksharshah “asamanya” hona mere man ke anukool nahi tha. Vinamrata se Gandhbaba ka abhivadan kar main wahan se nikal pada. Ghoomte-ghoomte ghar jate hue main us din ki teen vividhatapoor n ghatnaon ke vishay mein soch raha tha.

Maine jaise hi ghar ke dwar se andar pravesh kiya, meri behan Uma saamne hi khadi thi.

“Kya baat hai? Aajkal tum itr ke bade shaukeen bante ja rahe ho?”

Bina kuch bole maine apna haath badhakar use soonghne ka ishara kiya.

“Kitni mohak gulab ki sugandh! Aur yeh asaadharaan roop se teevr bhi hai!”

Yeh sochte hue ki yeh “teevr roop se asaadharaan” hai, maine chupchap daivi roop se sugandhit kiya gaya phool uski naak ke neeche rakha.

“Oh! Chameli mujhe bahut pasand hai!” Usne phool chheen liya. Jis phool ke vishay mein use achchhi tarah gyaat tha ki vah gandhheen hota hai, usi phool mein se chameli ki sugandh aate dekhkar, jaise-jaise vah use soonghti jati thi vaise-vaise uske chehre par vinodi lagnewale sambhram ke bhaav prakat hote jate the. Uski is pratikriya ne mere man se raha-saha sandeh bhi mita diya ki ho sakta hai Gandhbaba ne mujhpar aatma-sammohan ka prayog kiya ho jisse keval main hi sugandh ka anubhav kar sakoon.

Baad mein mujhe apne ek mitra Alakananda se pata chala ki Gandhbaba ke paas aisi shakti bhi thi jo yadi sansar ke karodon kshudha-peedition ke paas hoti, to unki samasya hal ho jati.

“Barahan mein Gandhbaba ke ghar mein us samay saikdon logon mein main bhi upasthit tha,” Alakananda ne mujhe bataya. “Ek utsav tha. Yogivar ki khyati thi ki ve shunya mein se kuch bhi utpann kar sakte hain, isliye maine haste hue unse santare utpann karne ka anurodh kiya. Vah santaron ka mausam nahi tha. Tatshan hi kele ke patton par jo pooriyaan parosi gayi thin, ve sab phool utheen. Har poori ki papdi ke bheetar ek-ek chhila hua santara aa gaya tha. Maine kuch sahme-sahme man se apna santara khana shuru kiya, parantu vah bada hi swadisht tha.”

Kai varshon baad aatma-sakshatkar ke bal se main Gandhbaba ke chamatkaron ke rahasya ko jaan gaya. Khed is baat ka hai ki vah vidhi vishva ke kshudhart manav-jhundon ki pahunch se bahar hai.

Manav ko shabd, sparsh, ras, roop, gandh ki jo vividh indriyanubhutiyan hoti hain, ve electrons aur protons ki spandanatmak vividhta ke karan hoti hain. Unke spandanon ko panchpran niyantrit karte hain. Ye panchpran anvik urjaon se bhi sookshmtar hote hain aur pragya-yukt paanch vishesh sanvedi tanmatraon se yukt hote hain.

Gandhbaba kuch yaugik prakriyaon ke bal se is pranshakti ke saath samras hokar pran-kanikaon ki spandan-rachna mein parivartan lane mein aur is prakar ichchhit parinaam prapt karne mein samarth the. Unke gandh, phal aur anya chamatkar keval sammohan dwara utpann aantarik sanvedan nahi hote the, balki laukik spandanon ke vastav mein moort roop hote the.

Sammohan-vidya ko doctoron dwara chhoti-chhoti shalyakriyaon mein un logon par prayukt kiya gaya hai jin ke liye behoshi ki davaein khatarnak ho sakti hain. Parantu jin par baar-baar sammohan ka prayog kiya jata hai unke liye yeh hanikarak hota hai. Iska hanikarak manovaigyanik parinaam kalantar mein mastishk ki koshikaon ki rachna mein gadbad utpann kar deta hai. Sammohan doosre ki chetna ke kshetra mein anadhikar pravesh hai.* Iske asthayi aabhasoin mein aur Ishwaranubhuti-sampann purushon dwara kiye gaye chamatkaron mein koi samanta nahi hai. Ishwar mein jagrit hue sachche sant nitya srijana karnewale us virat swapn-drashta ke saath apni ichchha ko milakar is swapn-srishti mein parivartan karte hain.*

Gandhbaba jaise chamatkaron ka pradarshan karte the vaise chamatkar dikhane se log aakarshit to hote hain, parantu adhyatmik drishti se unka koi labh nahi hota. Manoranjan ke atirikt unka koi prayojan nahi hota, atah Ishwar ki yatharth khoj se ye sadhak ko pathchyut kar dete hain.

Asaadharaan shaktiyon ke aadambarpoorn pradarshan ki siddhjanon ne ninda ki hai. Faras ke sant Abu Said ne jal, hawa aur antariksh par apni chamatkari shaktiyon ki satta ka abhiman karnevale kuch fakeeron ka upahas kiya tha.

“Mendak bhi pani mein aaram se rah sakta hai!” Abu Said ne saumyata se upahas karte hue kaha tha. “Cheel kauve aasani se hawa mein ud sakte hain; Shaitan poorv mein bhi hai aur pashchim mein bhi. Sachcha manushya vah hai jo samaj mein sadachar ka palan karta hua rahta hai aur kray-vikray karte hue bhi kabhi ek kshan ke liye bhi Ishwar ko nahi bhulata!”†

* Srishti apne kan-kan mein pratinidhitva hai. Ek toop tattva se hi sab bana hai. Oos bindu mein srishti golakar ban jati hai ... Sarvavyapakata ka sachcha arth yeh hai ki shaival ke pratyek ankur mein aur makdi ke pratyek jaal mein bhi Ishwar apni sampoor nata ke saath vidyaman hai.” — Emerson “Compensation” mein.

† “Kray-vikray karte hue bhi kabhi ek kshan ke liye bhi Ishwar ko nahi bhulana!” Is aadarsh ke peeche bhaav yeh hai ki vyakti jo bhi karya kar raha ho usmein uska man laga hona chahiye. Kuch pashchatya lekhak kehte hain ki Hindu jeevan-darshan sahasheen palayan ka, akarmanyata evam samajghati nivritti ka marg hai. Vastav mein manav jeevan ke liye Vedon ki chaturvargashram vyavastha hi lok samaj ke liye santulit vyavastha hai jismein manushya ka aadha jeevan adhyayan aur grihasth dharm ke palan ke liye tatha shesh aadha jeevan chintan evam dhyanabhyas ke liye nirdharit hai.

Parmatma mein sthir hone ke liye ekaantavas aavashyak hai, parantu jinhone yeh sthirta prapt kar li hai ve taduparant jagat ki seva karne ke liye vapas laut aate hain. Jo santjan bahya star par koi karya nahi karte, ve bhi apne vicharon evam pavitra spandanon dwara jagat ka aatmagyaanheen manushyon dwara athak kiye gaye lokopkari karyon se kahin adhik badhkar hit karte hain. Mahatmajan apne-apne dhang se aur prayah kadve virodh ko jhelkar, apne samakaleen logon ko prerit karne tatha unnat karne ka nihsv arth prayas karte rahte hain. Hinduon ka koi bhi aadarsh, chahe vah dharmik ho ya samajik, keval nakaratmak nahi hai. Yahan tak ki ahinsa bhi, jise Mahabharat mein sakal dharm ya poorn dharm kaha gaya hai, keval nakaratmak agya nahi balki usmein nihit is dharana ke karan ek sakaratmak agya hai ki jo doosron ko sahayata nahi karta vah kisi na kisi roop mein unka anisht (hinsa) karta hai.

Srimad Bhagavad Gita (Adhyay 3, 4-8) yeh spasht karti hai ki karma karna manav ko prakriti mein nihit hai. Aalasya bhi aur kuch na hokar keval “anisht karma” hai.

Na karmanam anarambhan naishkarmyam purusho’shnute |  
Na cha sannyasanad eva siddhim samadhigacchati || 4 ||

Manushya na to karmon ka aarambh kiye bina nishkarmata ko prapt hota hai aur na hi karmon ke keval tyagmatra se siddhi ko prapt hota hai.

Na hi kashchit kshanam api jatu tishthaty akarmakrit |  
Karyate hy avashah karma sarvah prakritijair gunaih || 5 ||

Nihsandeh koi bhi manushya kisi bhi kaal mein kshanmatra bhi bina karma kiye nahi rahta; kyon ki sara manushya-samuday prakritijanit gunon ke adheen hua karma karne ke liye badhya kiya jata hai.

Karmendriyani samyamya ya aste manasa smaran |  
Indriyarthan vimoodhatma mithyacharah sa uchyate || 6 ||

Jo moodhbuddhi manushya samast indriyon ko hath-purvak upar se rokkar man se un indriyon ke vishayon ka chintan karta rahta hai, vah mithyachari arthat dambhi kaha jata hai.

Yas tv indriyani manasa niyamyarabhate’rjuna |  
Karmendriyaih karmayogam asaktah sa vishishyate || 7 ||

Kintu he Arjun! Jo purush man se indriyon ko vash mein karke anasakt hua samast indriyon dwara karmayog ka aacharan karta hai, vahi shreshth hai.

Niyatam kuru karma tvam karma jyayo hy akarmanah |  
Shareerayatrapi cha te na prasiddhyed akarmanah || 8 ||

Tum shastravihit karma karo; kyunki karma na karne ki apeksha karma karna shreshth hai tatha karma na karne se to tumhara shareer-nirvah bhi siddh nahi hoga.

Ek anya avsar par is mahan Farasi sant ne dharmik jeevan ke vishay mein apna mat is prakar vyakt kiya tha: “Apne dimaag mein jo kuch hai use nikal dena (swadheenishth ichchha-akankshaen); haath mein jo kuch hai us ka mukt roop se daan karna; aapattiyon ke aaghat se kabhi bhi vichalit nahi hona!”

Na to Kalighat ke nisprih mahatma aur na Tibet se prashikshit yogi hi meri guruprapti ki teevr ichchha ko santusht kar sake. Kisi ka adhyatmik star pehchanne mein mere hridaya ko shikshit karne ki aavashyakta nahi thi. Jab bhi kisi sachmuch udatt vyaktitva ka samna hota tab vah dhanya-dhanya kar uthta, yeh dhanya-dhanya aur bhi goonjnevali hoti kyunki yeh kabhi-kabhar hi aur vah bhi antartam gehrai yon se uth ti. Antatah jab apne guru se mera sakshatkar hua, tab unhone keval udaharan ki atyuchchata ke dwara hi mujhe sachche purush ka pariman sikhaya.
