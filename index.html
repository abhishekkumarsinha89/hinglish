{ title: "Bagh Swami", text: `

“Maine Bagh Swami ka pata khoj nikala hai. Chalo, kal unka darshan kiya jaaye.”

Yeh swagataarh prastaav high school ke mere ek mitra Chandi se mila. Apne sanyas-poorv jeevan mein keval apne nange haathon se baghon ke saath ladne aur unhe pakadne wale is sant ka darshan karne ke liye main bhi utsuk tha. Aise asaadharaan sahasik kaaryon ke prati baal-sulabh utsaah mujh mein bharpoor tha.

Doosre din pratahkaal bahut thand pad rahi thi, par main Chandi ke saath atyant utsaah aur sphoorti ke saath chal pada. Kolkata ke baahar Bhawanipur mein bahut der tak vyarth khoj karne ke baad hum theek ghar par pahunch gaye. Darwaze par lohe ki do golakaar kadiyan lagi hui thin. Maine unhe bahut zor-zor se khatkhataaya. Us karnakash khadkhadaahat ko sunkar bhi ek naukar andar se dheere-dheere aaraam-poorvak chalta hua hamari ore aaya. Uski vyangyaatmak muskaan is baat ka dyotak thi ki shor machane wale aagantuk bhi ek sant ke ghar ki shaanti bhang nahi kar sakte.

Uski maun bhartsana ko humne anubhav kiya, par baithak mein aane ke liye aamantrit kiye jaane par Chandi aur main uske prati kritagya the. Wahan lambi prateeksha hum logon ke man mein shanka-kushankaayein utpann karne lagi. Satya ki khoj karne wale ke liye Bharat ka alikhit niyam hai dhairy; sant-mahatma kabhi-kabhi jaan-boojhkar darshanarthi ki utsukta ki pareeksha le sakte hain. Paashchaatya doctor aur dant-chikitsak is manovaigyanik kootneeti ka bharpoor prayog karte hain.

Antatah naukar dwara bulaye jaane par Chandi aur main ek shayan-kaksh mein gaye. Wahan suvikhyaat So’ham Swami* apne palang par baithe hue the. Unke bheemkaay shareer ko dekhkar hum donon ke man par adbhut prabhaav pada. Aankhein phaade hum avaak unki ore dekhte rahe. Vaisi vishaal chhaati aur football ki tarah baazuhein humne pehle kabhi nahi dekhi thin. Atyant mazboot, bhari gardan par Swamiji ka ugra dikhne wala parantu shaant mukhamandal, moonchh, daadhi aur jhoolte keshon se sushobhit tha. Unki kaali aankhon mein kabootar evam baagh-samaan gunon ka milajula sanket chamak raha tha. Dridh maansal katipradesha ko gher kar pahne hue ek vyaaghracharm ke atirikt unke shareer par aur koi kapda nahi tha.

Jab hamari vaak-shakti laut aayi tab baghon ke saath ladne mein unki veerta ke prati aadar-yukt vismay prakat karte hue maine unka abhivadan kiya.

“Kya aap kripa karke hamein yeh nahi batayenge ki vanya pashuon mein sabse bhayankar Royal Bengal Tiger ko keval apne haathon se paraast karna kaise sambhav hai?”

“Mere bachchon! Baghon ke saath ladna mere liye kuchh bhi nahi hai. Aavashyakta padne par main aaj bhi woh kar sakta hoon.” Ve bachchon ke samaan khilkhilaakar hanse. “Tum baghon ko baagh maante ho; main unhein maatr billiyan samajhta hoon.”

“Swamiji! Main apne man ko to vishwas dila sakunga ki baagh billiyan maatr hain, parantu kya baghon ko main vaisa vishwas kara sakunga?”

“Nishchay hi shakti bhi aavashyak hai! Keval koi bachcha baagh ko gharelu billi maan lega to use baagh par vijay mil jaayegi yeh maanna vyarth hai. Mere shaktishaali haath shastra ke roop mein paryaapt hain.”

Unhone hamein apne saath aangan mein aane ko kaha jahaan ek deewar ke kinare par unhone prahaar kiya. Deewar ki ek eent toot kar zameen par gir padi. Toote hue daant ki tarah bani khaali jagah se aakaash dhrishtata-poorvak jhaankne laga. Main hakka-bakka rah gaya; sochne laga, jo aadmi ek hi prahaar se deewar mein chuni hui eent ko gira sakta hai, woh avashya hi baghon ke daant bhi tod sakta hai.

“Anek logon mein mere samaan shareerik shakti hoti hai, parantu phir bhi unmein dridh aatma-vishwas ka abhaav hota hai. Jo shareer se to balishth hote hain parantu man se nahi, ve jungle mein swachchhand vicharan karte hinsra pashu ko dekhkar hi moorchchhit ho sakte hain. Prakritik paristhitiyon mein vaas karne wala aur apne mool hinsak swabhaav ke anusaar jeene wala baagh circus ke afim khilaye gaye baagh se atyant bhinna hota hai!

“Bheem ke samaan prabal shaktishaali hote hue bhi anek vyakti Royal Bengal Tiger ke prachand aakraman ke saamne atyant bhaybheet aur asahaay ho uthte hain. Is prakaar baagh manushya ko uske hi man ki kalpana mein ek saadhaaran billi ki bhaybheet avastha ke samaan sthiti mein daal deta hai. Parantu jis manushya mein yathaavat balishth shareer ke saath-saath atyant dridh nishchay ho, woh is paristhiti ko baagh par hi ulat sakta hai aur use yeh maanne par vibash kar sakta hai ki woh ek billi ke samaan hi aatma-raksha mein asamarth hai. Kitni hi baar maine yahi kiya hai!”

Main yeh maanne ke liye poornta taiyaar tha ki mere samaksh upasthit atishaktishaali purush baagh ko billi mein roopantarit karne mein samarth the. Ve kuchh upadesh dene ki manahsthiti mein prateet hue; Chandi aur main aadar ke saath unki baatein sunne lage.

“Man hi maanspeshiyon ko niyantrit karta hai. Jaise hathaude ke aaghaat ki shakti us par lagaaye gaye bal par nirbhar hoti hai, vaise hi manushya ki shareerik shakti ki abhivyakti uski aakraamak ichchha-shakti ki teevrata evam saahas par nirbhar karti hai. Man hi aksharashah shareer ka nirman karta hai aur wahi use jeevit rakhta hai. Gat-janmon ki pravrittiyon ki prabalta ke anusaar achchhe ya bure swabhaav-gun dheere-dheere maanav-chetna mein utarte hain. Ye swabhaav-gun aadaton mein dhal jaate hain aur ye aadatein phir ek vaanchhaneey ya avaanchhaneey shareer ke roop mein pradarshit hoti hain. Baahya durbalta ki jad man mein hoti hai aur aadat se laachaar shareer man ki avhelna karta hai; is prakaar yeh kuchakra chalta jaata hai. Yadi maalik naukar ki aagya ka paalan karne lage to naukar nirankush swechchhaachaari ban jaata hai; isi prakaar man bhi shareer ki aagyaon ka paalan kar-kar ke uska daas ban jaata hai.”

Hamare anunay par yeh tejaswi Swami apne jeevan ke baare mein hamein kuchh bataane ke liye sahmat ho gaye.

“Bachpan se hi baghon se ladne ki mahatvaakaanksha mere man mein thi. Meri ichchha shaktishaali thi parantu deh durbal thi.”

Mere munh se aashcharyodgaar phoot pada. Yeh avishwaseeya lagta tha ki “prithvi ka bhaar uthane ke yogy kandhon” wale is manushya ka durbalta ke saath door-door se bhi kabhi koi parichay raha ho.

“Swasthya aur shakti ke chintan mein adamya dridhata dwara hi maine is baadha ko door karne mein safalta praapt ki. Is prabhaavshaali maanasik shakti ki prashansa karne ka kaaran aur bhi badh jaata hai kyunki maine dekha hai ki Royal Bengal Tigers ko paraajit karne wali vastutah yahi shakti thi.”

“Swamiji! Kya aapko lagta hai ki main bhi kabhi baghon ke saath lad paunga?” Yeh pehla aur antim avsar tha jab yeh vichitra mahatvaakaanksha mere man mein uthi!

“Haan.” Ve muskara rahe the. “Parantu baagh anek prakaar ke hote hain; kuchh manushya ki ichchha-vaasnaon ke jungle mein ghoomte hain. Pashuon ko apne prahaar se behosh kar dene se koi aadhyaatmik laabh nahi hota. Usse achchha yeh hai ki apne antar mein ghoomte un baghon ko paraajit kiya jaaye.”

“Swamiji! Kya aap hamein batayenge ki aap hinsra baghon ko vash mein karte-karte hinsra vaasnaon ko vash mein kaise karne lag gaye?”

Bagh Swami maun ho gaye. Ateet ke drishyon ko nihaarne ka prayaas karti unki drishti sudoor kahin lag gayi. Maine bhaamp liya ki unke man mein mere anurodh ko sweekaar karen ya na karen is par thodi uthal-puthal chal rahi thi. Ant mein man hi man sweekaar karke ve muskara uthe.

“Jab meri keerti charam-bindu par pahunch gayi tab mujhe garv ka nasha chadh gaya. Maine tay kiya ki main na keval baghon se ladunga balki logon ke saamne unse vividh kartab bhi karaunga. Meri mahatvaakaanksha hi yeh ban gayi ki main hinsra pashuon ko paaltoo jaanwaron ki tarah bartav karne par vibash kar doonga. Main saarvajanik roop se apne kartab dikhaane laga aur usmein milne wali safalta se mujhe khushi bhi hone lagi.

“Ek din shaam ko mere pitaji atyant chintatur manahsthiti mein mere kamre mein aaye.

“‘Beta! Main tumhein saavadhaan karne aaya hoon. Karm ki chalti chakki se utpann hokar aane wale amangalon se main tumhein bachana chahta hoon.’

“‘Kya aap bhaagyavaadi hain pitaji? Andhvishwas se kya meri gatividhiyon ke shaktishaali pravaah ko avaruddh hone dena chahiye?’

“‘Main bhaagyavaadi nahi hoon, beta! Parantu pavitra shaastron mein kahe gaye pratiphal ke niyam mein mera vishwas hai. Jungle parivaar mein tumhare viruddha aakrosh vyaapt hai; yeh aakrosh kabhi bhi tumhari jaan ke liye khatra bankar saamne aa sakta hai.’

“‘Pitaji! Aap mujhe aashcharya mein daalte hain! Baagh kya hote hain aap achchhi tarah jaante hain — sundar parantu nirdayi! Kaun jaane, mere prahaar unke thos-buddhi mein shayad kuchh udaarta ke vichaar bhar saken? Unhein sabhya shishtachaar sikhaane ke liye hi main jungle-vidyaalay ka pradhanaadhyaapak bana hoon!

“‘Pitaji! Kripaye aap mujhe baghon ko paalne wala baagh-paalak maanein, baagh-hatyaara nahi. Mere ye satkarm mera anisht kaise kar sakte hain? Main aapse praarthna karta hoon ki aap mujhe apne jeevan ka maarg badalne ki aagya na dein.’”

Chandi aur main dhyaan-poorvak sun rahe the aur ateet ke is dharm-sankat ko samajh rahe the. Bharat mein koi santaan apne mata-pita ki ichchhaon ka anaadar nahi karti. Bagh Swami aage kahte gaye:

“Nirvikaar maun mein pitaji ne mera spashtikaran suna. Taduparaant unhone gambheerata-poorvak ek rahasyodghaatan kiya.

“‘Beta! Tum mujhe ek sant ki amangal-soochak bhavishyavaani dohraane par vibash kar rahe ho. Kal jab main baraamde mein baithkar nitya ki bhaanti apna dhyaan kar raha tha tab ve mere paas aaye.

“‘Mitra-var! Main aapke yuddha-priya bete ke liye ek sandesh lekar aaya hoon. Usse kahiye ki woh apni barbar gatividhiyaan band kar de. Anyatha baagh ke saath uski agli ladai mein use anek dusadhya ghaav honge jisse chhah mahinon tak woh maranasann avastha mein pada rahega. Tab woh apna purana maarg chhodkar sanyaasi ban jaayega.’

“Is kahaani ka mujh par koi prabhaav nahi pada. Maine yahi maana ki pitaji kisi bhraanti-grasit katharvaadi ki bhraanti ka shikaar ho gaye hain.”

Yeh kahte hue Bagh Swami ke haav-bhaav itne adheer aur aise the maanon apni moorkhta par unhein krodh aa raha ho. Kaafi der tak ve gambheer mudra mein maun baithe rahe jaise wahan hamari upasthiti ka unhein koi bhaan na ho. Phir unhone akasmaat hi apni kahaani aage shuru ki, is baar unki aawaaz mein narmi aa gayi thi.

“Pitaji ki chetaavani ke kuchh hi din baad main raajdhaani Cooch Behar gaya. Prakritik saundarya se bhara yeh pradesh mere liye naya tha aur main sukh-prad parivartan ki aasha kar raha tha. Jaisa har jagah sada hi hota tha, yahaan bhi sadkon par mere peechhe-peechhe utsuk logon ki bheed chalti rahti thi. Unki phusphusaahat ke kuchh ansh kabhi-kabhi mujhe sunaayi padte the:

“‘Yeh wohi aadmi hai jo jangli baghon ke saath ladta hai.’

“‘Uske ve pair hain ya ped ke tane?’

“‘Uska chehra to dekho! Woh swayam baghon ke raja ka avataar maaloom hota hai!’

“Tum to jaante hi ho gaavon ke natkhat chhokare kis prakaar taaza samaachaar-patra ka kaam karte hain! Aur kis gati se mahilaon ki maukhik jan-soochna pranaali is ghar se us ghar samaachaar pahunchaati hai! Kuchh hi ghanton mein meri wahaan upasthiti se saare shahar mein khal-bali mach gayi.

“Sandhya ke samay main chupchaap aaraam kar raha tha ki ghodon ki taapon ki dhvani sunaayi di. Main jis ghar mein ruka tha usi ke saamne aakar woh dhvani ruk gayi. Lambe kad ke pagdi-dhaari police sipaahiyon ka ek dal andar ghus aaya.

“Main avaak rah gaya. Maine socha, ‘In police-waalon ke liye kuchh bhi sambhav hai. Kahin ve mere liye poorntaya agamya kisi baat par meri khinchaai karte to nahi aaye hain?’ Parantu unhone apne saamaanya vyavhaar ke vipareet atyant vinay ke saath mera abhivadan kiya.

“‘Aadaraneey mahoday! Cooch Behar ke Yuvaraj ki ore se aapka swaagat karne ke liye hamein bheja gaya hai! Unhone kal pratahkaal aapko apne raaj-praasaad mein padhaarene ka aamantran bheja hai.’

“Main thodi der is par sochta raha. Kisi agyaat kaaran se apni is shaant yaatra mein upasthit hue is vighn se teevra udveg ki bhaavna mere man mein uth rahi thi. Parantu police-waalon ki vinay-sheelta ne mere hriday ko chhoo liya; maine nimantran sweekaar kiya.

“Doosre din jis daasochit vinamrata aur khushaamad ke saath mujhe apne dwaar se chaar ghode jute hue shaahi coach tak le jaaya gaya use dekhkar main chakit rah gaya. Ek sevak teevr dhoop se mujhe bachane ke liye ek alankrit chhaata mere oopar pakde khada raha. Nagar aur uske baahar ke van-kshetra mein se sukhad coach savaari karte hue mujhe bada maza aa raha tha. Yuvaraj swayam mera swaagat karne ke liye raaj-praasaad ke singh-dwaar par upasthit the. Apne swarn-khachit aasan par unhone mujhe baithaya aur muskaraate hue swayam usse kam saaj-sajjaayukt ek aasan par baith gaye.

“‘Yeh sab vinamra seva nishchay hi mujhpar koi museebat laane wali hai!’ Badhte hue aashcharya ke saath main soch raha tha. Idhar-udhar ki thodi baatein karne ke baad Yuvaraj ka uddeshya prakat ho hi gaya.

“‘Mere nagar mein afwaah faili hui hai ki aap keval apne nange haathon se jangli baghon ke saath lad sakte hain. Kya yeh sach hai?’

“‘Bilkul sach hai.’

“‘Hamein is par vishwas nahi hota! Aap shahri logon ke polish kiye hue chaaval par pale Kolkata ke Bangali hain. Kripaye sach-sach bataiye, kya aap keval nirbal, afim khilaye gaye baghon se hi nahi ladte rahe hain?’ Unka swar ooncha aur vyangya-bhara tha. Unke bolne ke dhang mein unke prant ki shaili ki jhalak thi.

“Unke us apmaanjanak prashn ka uttar dena maine aavashyak nahi samjha.

“‘Hum haal hi mein pakde gaye apne baagh Raja Begum* ke saath ladne ki aapko chunauti dete hain. Yadi aap uska safalta-poorvak saamna kar saken aur use zanjeer se baandhkar chetan avastha mein uske pinjre se baahar nikal saken, to woh Royal Bengal Tiger aapka ho jaayega. Iske atirikt sahasraavadhi rupaye evam anya kai uphaar bhi aapko milenge. Aur yadi aapne usse ladna asweekaar kar diya to hum apne poore raajya mein aapko paakhandi ghoshit kar denge!’

“Unke uddhat shabd goliyon ki bauchhaar ke samaan mujhe lag gaye. Maine gusse se unki sharten sweekaar kar leen. Uttejana mein aasan se aadhe uth khade hue Yuvaraj nishthur muskaan ke saath waapas baith gaye. Unki woh muskaan dekhkar mujhe un Roman samraaton ki yaad aayi jinhein Isaiyon ko hinsra pashuon ke saath ladaane mein aanand aata tha. Yuvaraj ne aage kaha:

“‘Aapki ladai aaj se ek saptaah baad hogi. Hamein khed hai ki hum ladai se pehle baagh ko dekhne ki anumati aapko nahi de sakte.’

“Yuvaraj ko kahin yeh bhay to nahi tha ki main baagh par sammohan-vidya ka prayog karunga ya use afim khilaane ka prayaas karunga, main nahi jaanta.

“Main raaj-praasaad se chal pada. Maze ki baat yeh thi ki ab ki baar na to raaj-chhatr tha aur na hi woh saaj-sajjaayukt coach!

Agle saptaah bhar mein main aagaami agni-pareeksha ke liye apne man aur shareer, donon ko vidhiwat taiyaar karta raha. Apne naukar dwara mujhe vilakshan kahaaniyaan sunne ko mil rahi thin. Pitaji ke paas sant ne jo bheeshan bhavishyavaani ki thi woh kisi prakaar logon mein fail gayi aur failte-failte badhti gayi. Anek bhole-bhaale graameenon ka vishwas tha ki ek dusht aatma ne devtaon ke shaap ke kaaran baagh ka janm liya tha jo raat ko vibhinn aasuri roop dhaaran karti hai, parantu din mein phir se baagh bankar rahti hai. Logon ka anuman tha ki yeh wohi aasuri baagh hai jise mera garv hanan karne ke liye bheja gaya hai.

“Ek anya kalpana yeh thi ki baghon ki apne devta se ki gayi praarthnaon ka uttar Raja Begum ke roop mein aa gaya hai. Samagra vyaaghra-jaati ke liye itna maan-haanikaarak uhare is dhrisht dopaye ko — mujhe — dandit karne ke liye use niyat kiya gaya hai. Ek lom-dant-viheen manushya nakh-dant-yukt, shaktishaali paad-yukt baagh ko chunauti dene ka dussahas kare! Log yeh bhi kah rahe the ki sabhi avmaanit baghon ke dvesh ne milkar itna zor pakad liya hai ki baghon ka maan-mardan karne wale is abhimaani purush ka patan karaane ke liye woh zor ab sookshm niyamon ko kaaryaanvit kar raha hai.

“Mere naukar ne mujhe aage bataya ki Yuvaraj swayam maanav aur pashu ke beech hone wale is dwandwa ke vyavasthaapan ka kaaryabhaar sambhaal rahe the. Unhone swayam apni dekh-rekh mein hazaaron logon ke baithne yogy ek aise vishaal tambu ka nirman karaaya jo aandhi-toofan mein bhi surakshit khada rah sake. Us tambu ke madhya mein lohe ke ek vishaal pinjre mein Raja Begum ko rakha gaya tha. Is pinjre ke baahar suraksha ka ek aur ghera tha. Raja Begum nirantar khoon jama dene wali bhayankar garjanaein karta ja raha tha. Uski kshudhaagni aur krodhaagni donon ko bhadkaane ke liye use bahut kam khaana diya ja raha tha. Shayad Yuvaraj ko aasha thi ki main uska puraskaar-swaroop bhojan banunga!

“Danka baja-bajakar nagar aur aas-paas ke ilaake mein is adwiteeya dwandwa ki jo ghoshana ki ja rahi thi, use sunkar logon ne bhaari sankhya mein utsukta-poorvak ticketein kharideen. Dwandwa ke din seaton ki kami ke kaaran sainkdon logon ko lauta diya gaya. Kai log tambu ki daraaron mein se andar ghus aaye, ya gallery ke neeche jahaan bhi jagah mili wahin khade ho gaye.”

Jaise-jaise Bagh Swami ki katha charam-seema ki ore badh rahi thi, vaise-vaise meri uttejana bhi badhti gayi; Chandi bhi mantra-mugdh hokar avaak baitha tha.

“Raja Begum ki kaan phaad dene wali garjanaon ke aur bhaybheet darshakon ke kolaahal ke beech maine shaant man se tambu mein pravesh kiya. Langot ke atirikt mere shareer par aur koi kapda nahi tha. Maine surakshaatmak ghere ke darwaze ka kunda sarkaakar use khola aur andar jaakar apne peechhe shaant man se darwaze ko band kar liya. Baagh ko rakt ki gandh lag gayi. Uchhal-kar dhadam se lohe ki chhadon se takraane ki dhvani ke saath usne mera bheeshan swaagat kiya. Karunaardra bhay se darshakon mein sannaata chha gaya; us ati ugra baagh ke saamne main nireeh memna lag raha tha.

“Palak jhapakte hi main uske pinjre mein ghus gaya; parantu jaise hi maine darwaza band kiya, Raja Begum uchhal-kar seedha mere oopar aa gaya. Mera daahina haath buri tarah kshat-vikshat ho gaya. Baagh ke liye param swaadisht maanav-rakt ki prachand dhaaraein girne lagiin. Sant ki bhavishyavaani satya hone ke aasaar nazar aane lage.

“Is prakaar ki gambheer chot mujhe jeevan mein pehli baar aayi thi, par main turant us se sambhal gaya. Rakt-ranjit ungliyon ko langot mein ghusaakar maine unhein chhipa liya aur baayein haath se ek haddi-tod prahaar baagh par kiya. Baagh ladkhadaakar peechhe hat gaya, pinjre ke ant tak peechhe gaya, phir palat-kar atyant gusse ke saath punah mujh par jhapta. Mere suvikhyaat mushti-shaasan ke prahaar uske sir par barasne lage.

“Parantu Raja Begum ko rakt ka jo swaad lag gaya tha, usne deerghkaal tak sharaab se vanchit rahne wale sharaabi ki jaise sharaab ka pehla ghoont unmatt kar deta hai, usi prakaar unmatt kar diya tha. Beech-beech mein kaan baitha dene wali dahaadein maarte hue uske aakramanon ki ugrata badhti hi ja rahi thi. Uske daanton aur nakhon ke aage mera keval ek haath se bachaav karna aparyaapt pad raha tha aur meri aatma-raksha-pranaali abhedya nahi rah paa rahi thi. Parantu main bhi tilmilaane wale prahaar us par karta gaya. Donon hi rakt-ranjit hokar jeevan-maran ka yuddha lad rahe the. Pinjre mein kolaahal tha, chaaron dishaon mein rakt ke chheente ud rahe the, baagh ke gale se peeda aur khooni praan-pipaasa ke cheetkaar phoot rahe the.

“‘Goli chalao! Baagh ko maar daalo!’ darshak cheekh rahe the. Maanav aur pashu itni tez gati se hil rahe the ki ek sipaahi ki goli bhi nishaana chook gayi. Maine apni saari sankalp-shakti ekatra ki aur bheeshan garjan ke saath uske mastak par ek antim khopdi-tod prahaar kiya. Baagh gir gaya aur thanda hokar pada raha.”

“Paaltoo billi ki bhaanti!” main beech mein hi bol pada.

Swamiji khilkhilaakar hans pade, phir unhone tanmay kar dene wali apni kahaani ko aage bataana shuru kiya.

“Aakhir Raja Begum paraajit ho hi gaya. Uska raha-saha raaj-garv bhi choor-choor ho gaya: apne videern, rakt-ranjit haathon se maine uska jabda khola aur ek natya-poorn kshan ke liye us khule mrityu-dwaar mein apna sir rakha. Zanjeer ke liye idhar-udhar dekha aur zameen par pade zanjeeron ke dher mein se ek zanjeer kheenchkar usse baagh ki gardan pinjre ki chhadon ke saath baandh di. Vijayollass mein main darwaze ki ore chalne laga.

“Parantu woh moortimaan shaitaan Raja Begum! Uski kalpit aasuri utpatti ke anuroop hi woh jeevat tha! Ek hi vismaykaari jhatke ke saath zanjeer todkar woh meri peeth par jhapat pada. Mera kandha uske jabde mein phansa hua tha aur aisi sthiti mein main zor se neeche gira. Parantu palak jhapakte hi maine use apne neeche dhar dabocha. Nishthur prahaaron ke aaghaaton se woh ardh-moorchchhit ho gaya. Is baar maine use adhik saavadhaani-poorvak baandh diya. Dheere-dheere main pinjre se baahar nikla.

“Phir se chaaron taraf cheekh-pukaar sunaayi di, is baar woh harshollass ki thi. Bheed ki cheekh-pukaar ki harsh-dhvani jaise ek hi viraat gale se nikal rahi thi. Main bheeshan roop se ghayaal to ho gaya tha parantu phir bhi maine dwandwa ki teenon sharten poori kar di thin — baagh ko achet karna, use zanjeer se baandhna aur bina kisi prakaar ki sahaayata liye pinjre se baahar aana. Iske alaawa maine us hinsra pashu ko is tarah ghayaal aur bhaybheet kar diya tha ki mere sir ka apratim puraskaar apne mukh mein paakar bhi uski ore usne koi dhyaan nahi diya!

“Mere ghaavon ka praathamik upchaar karne ke baad mera samman kiya gaya aur mujhe pushp-haar pahnaaye gaye. Mere charanon mein swarn muharon ki varsha ki gayi. Asaadharaan roop se vishaal aur vaise hi kroor baagh par meri vijay ki antaheen charchaain chaaron ore se sunaayi de rahi thin. Vachan ke anusaar Raja Begum mujhe de diya gaya, parantu mujhe koi harsh nahi hua. Mere hriday mein aadhyaatmik parivartan aa gaya tha. Aisa prateet ho raha tha ki pinjre se baahar nikalne ke saath hi maine sansaar mein apni mahatvaakaankshaon ka dwaar bhi band kar diya tha.

“Uske baad ka kuchh samay atyant vedana aur manastaap mein beeta. Rakt mein vish failne ke kaaran chhah mahinon tak main maranasann avastha mein pada raha. Cooch Behar chhodne yogy theek hote hi main apne gaanv laut aaya.

“‘Ab main jaan gaya hoon ki jin saadhu ne saavadhaani ka vivek-poorn ishaara diya tha wahi mere guru hain,’ ek din vinamrata-poorvak maine pitaji se kaha. ‘Kaash! Main kisi prakaar unhein dhoondh paata!’ Meri laalsa sachchi thi, kyunki ek din wahi sant bina kisi soochna ke hamare ghar padhaare.

“‘Baghon ka daman bahut ho gaya.’ Shaant adhikaar-poorn vaani mein ve bol rahe the. ‘Mere saath aao; main tumhein maanav-man ke junglon mein vicharne wale agyaan ke pashuon ka daman karna sikhaunga. Tumhein darshakon ki aadat ho gayi hai; ab yogaabhyaas mein tumhari romanchak paangati se jhoom uthne wale devta tumhare darshak honge!’

“Mere guru ne mujhe aadhyaatmik maarg ki deeksha di. Meri aatma ke deerghkaal tak aprayukt rahne se morcha lage, kholne mein kathin dwaar unhone khol diye. Sheeghra hi ek doosre ka haath thaame, meri saadhana ke liye hum donon Himalaya ki ore chal pade.”

Apne toofaani jeevan ki ek jhalak hamein dikhaane ke liye kritagya hokar Chandi aur maine Swamiji ke charanon mein pranaam kiya. Mujhe aur mere mitra ko laga ki baithak mein upeksha mein ki gayi lambi prateeksha ka hamein bharpoor pratiphal mila!

---

* So’ham Swami unka sanyas naam tha. Log unhein Bagh Swami hi kahte the.  
* Raja Begum: us baagh mein baagh aur baaghin, donon ki hinsrata maujood hone ke kaaran use yeh naam diya gaya tha.
`},
{ title: "Plavan-sheel Sant", text: `
“Kal raat ek sabha mein maine ek yogi ko zameen se kai foot oopar hawa mein thahre hue dekha.” Mera mitra Upendra Mohan Chaudhary bade hi prabhaavshaali dhang se bol raha tha.

Maine utsaah-poorn muskaan ke saath kaha: “Shayad main unka naam bata sakta hoon. Kahin ve Upper Circular Road ke Bhaduri Mahashay to nahi the?”

Upendra ne sweekriti mein sir hilaya. Yeh baat mujhe pehle hi gyaat hai yeh dekhkar uska chehra thoda utar gaya. Santon ke baare mein meri jigyaasa se mere sabhi mitra bhali-bhaanti parichit the; koi nayi jaankaari milte hi mujhe unke peechhe laga dene mein unhein bada aanand aata tha.

“Ye yogi Maharaj mere ghar ke itne nikat rahte hain ki main praayah unse milne jaata hoon.” Mere is kathan se Upendra ke chehre par utsukta ke bhaav umadte dekh maine use aur bhi baatein bataana shuru kiya.

“Unke kai kamaal maine dekhe hain. Patanjali* praneet praacheen ashtaang yog ke vibhinn pranayama† vidhiyon mein ve nishnaat hain. Ek baar Bhaduri Mahashay ne mere saamne bhastrika pranayama itne zor se kiya ki lagta tha maano us kamre mein sachmuch ka toofan aa gaya ho! Phir unhone garjan karte shwasochchhwas ko band kar diya aur ve atichetnata** (samadhi) ki ek uchch avastha mein nishchal baithe rahe. Toofan ke baad shaanti ka vaataavaran itna prabhaavpoorn tha ki use kabhi bhulaya nahi ja sakta.”

“Maine suna hai ki ve kabhi ghar se baahar nahi nikalte.” Upendra ke swar mein kuchh avishwaseeyata jhalak rahi thi.

“Vastav mein yeh sach hai! Vigat bees varshon se ve ghar ke bheetar hi rahte aaye hain. Keval hamare parv-tyohaaron ke avsar par ve swayam hi lagaaye is niyam ko thoda dheela karte hain jab ve apne hi ahaate mein sthit saamne ki pagdandi tak jaate hain! Wahaan par bhikhaari jama ho jaate hain kyunki sant Bhaduri apne dayaardra hriday ke liye prasiddh hain.”

“Gurutvaakarshan ke niyam ko thukraakar ve hawa mein kaise rah paate hain?”

“Kuchh pranayamon ke abhyaas se yogiyon ke shareer ki jadata nasht ho jaati hai. Tab unka shareer hawa mein uth jaata hai ya phir mendhak ki tarah yahaan se wahaan phudakne lagta hai. Jo sant yogaabhyaas nahi karte, ve bhi Ishwar ke prati teevr bhakti ki avastha mein hawa mein oopar uthte paaye gaye hain.”

“Is sant ke vishay mein main adhik jaanna chahta hoon. Kya tum unki saayankaaleen sabhaon mein jaate ho?” Upendra ki aankhein kautuhal se chamak rahi thin.

“Haan, main praayah jaata hoon. Unke upadeshon mein vidyamaan vinod-poorn chutkiyon aur haas-parihaas mein mujhe bada maza aata hai. Kabhi-kabhi mere lambe attahaas se sabha ki gambheerata bhang ho jaati hai. Bhaduri Mahashay to uska bura nahi maante kintu unke shishya kha jaane wali nazaron se meri ore dekhte hain!”

Us din dopahar ko school se ghar laute samay main Bhaduri Mahashay ke ekaant nivaas ke paas se guzar raha tha to unka darshan karne ki ichchha ho gayi. Jansadhaaran ke liye unka darshan durlabh tha. Nichli manzil par akela rahne wala unka ek shishya is baat ka dhyaan rakhta tha ki unke ekaant mein khalal na pade. Yeh shishya kuchh zyada hi anushaasan-priya vyakti tha. Usne mujh se poochha ki kya maine bhent ke liye pehle se samay liya hua hai? Uske Gurudev usi samay wahaan aa pahunche aur unhone mujhe avilamb “bahirgat” kiye jaane se bachaa liya.

“Mukunda jab bhi aana chaahe, use aane diya karo.” Santavar ki aankhein chamak utheen. “Ekaant ka mera niyam meri apni suvidha ke liye nahi balki logon ki suvidha ke liye hai. Sansaari logon ko unke mohjaal ko tahas-nahas kar dene wali spashtavaadita achchhi nahi lagti. Sant na keval durlabh hain, balki ve logon ko vyaakul bhi kar dete hain. Shastra-puranon mein bhi ve praayah jansadhaaran ko vihwal karte paaye jaate hain.”

Main Bhaduri Mahashay ke peechhe-peechhe oopri manzil par sthit unke atyant saade kaksh mein ja pahuncha, jahaan se ve shayad hi kabhi baahar nikalte the. Sansaar ki kshudra uttejanaon ke teevr gati se nitya badalte chitron ki ore santjan praayah koi dhyaan nahi dete; keval yug-yugantar mein sthir hue kaaljayi satyon par unka dhyaan kendrit rahta hai. Santon ke samakaaleen log keval unke sankeern vartamaan ke log hi nahi hote.

“Maharshi! Jahaan tak main jaanta hoon, aap pehle aise yogi hain jo hamesha ghar ke andar hi rahte hain.”

“Bhagwan kabhi-kabhi apne santon ko apratyashit paristhitiyon mein daal dete hain, ki kahin hum yeh na sochein ki hum santon ko ek vishisht niyam ki chaukhath mein bitha sakte hain.”

Aarogya aur shakti se otproot apna shareer unhone padmasan mein sthir kiya. Unki aayu sattar aur assi varsh ke beech thi, parantu aayu ya nishkriya jeevan-paddhati ka koi apriya lakshan unke shareer par nahi tha. Unka sugathit evam seedha shareer pratyek drishti se aadarsh-swaroop tha. Unka mukhamandal puranon mein varnit rishiyon ke samaan tha — bhavya mastak, bharpoor daadhi, shaant aankhein sadaiv Ishwar ki sarvavyaapakta par sthir. Ve sadaiv dridhata ke saath seedhe baithe the.

Hum donon dhyaanasth ho gaye. Ek ghante ke baad unki saumya vaani ne mujhe jaga diya.

“Tum praayah dhyaan lagaate ho, parantu kya tumhein kuchh anubhav hua hai?” Ve mujhe dhyaan se adhik Ishwar se prem karne ka smaran dilaa rahe the. “Saadhan ko hi saadhya samajh lene ki bhool nahi karna.”

Unhone mujhe kuchh aam diye. Apne gambheer swabhaav mein bhi mujhe hamesha hi aanandit karne wali apni vinod-buddhi ko prakat karte hue unhone kaha: “Saadhaaranta logon ko dhyaanyog se jalyog (jalpaan) adhik achchha lagta hai.”

Yog ke vishay mein unki is shabda-kreeda ko sunkar main thahaake lagaakar hansne laga.

“Kya hansi hai tumhari!” Vaatsalya-poorn chamak unki drishti mein prakat hui. Unka apna chehra sadaiv gambheer ho rahta tha, parantu usmein bhi paramaanand-bhari muskaraahat ki jhalak hoti thi. Unke vishaal kamal-nayanon mein sadaiv ek divya hansi chhipi hoti thi.

“Ve patra sudoor sthit America se aaye hain.” Unhone mez par pade anek mote-mote lifaafon ki ore sanket kiya. “Wahaan ki kuchh societies ke saath, jinke sadasya yogshastra mein ruchi rakhte hain, main patra-vyavhaar karta hoon. Ve Columbus se behtar dishaanudeshan ke saath Bharat ki naye sire se khoj kar rahe hain. Unki sahaayata karne mein mujhe khushi hoti hai. Din ke ujaale ki tarah yogshastra ka gyaan bhi un sab ke liye hai jo ise praapt karne ke ichchhuk hain.

“Jise maanav ki mukti ke liye rishiyon ne anivaarya samjha hai use paashchaatya logon ke liye halka karne ki aavashyakta nahi hai. Baahya anubhav bhinna hote hue bhi sabki aatma ek samaan hi hai, aur jab tak yog ka kuchh na kuchh abhyaas nahi kiya jaata, tab tak na hi paashchaatya aur na hi paurvaatya log unnati kar sakte hain.”

Unhone apni shaant drishti mujh par sthir ki. Meri samajh mein tab yeh nahi aaya ki unke vaktavya mein bhavishyavaani-yukt maargdarshan chhipa hua tha. Woh to keval ab, jab main ye shabd likh raha hoon, unke dwara praayah diye gaye sanketon ka poorn arth meri samajh mein aa raha hai ki main kisi din Bharat ki shikshaon ko America le jaaunga.

“Maharshi! Main chahta hoon ki aap jagat ke kalyaan ke liye yogshastra par ek pustak likhein.”

“Main shishyon ko taiyaar kar raha hoon. Ve swayam aur unke shishyon ki shrankhala jeevant pustakon ka kaam karenge jo samay ke swabhaavik kshay aur teekaakaaron ki aswabhaavik teekaon se achhoote rahenge.”

Sandhyaakaal ko unke shishyon ke aane tak main akela hi unke saath raha. Shishyon ke aane ke baad Bhaduri Mahashay ne apna adwiteeya pravachan shuru kiya. Shaant baahya ki tarah apne shrotaon ke man ke kooda-karkat ko baha le jaakar ve unhein Ishwar ki ore le chale. Vishuddh Bangali mein ve hriday-sparshi drishtant dete ja rahe the.

Us din Bhaduri Mahashay sant-sangati ko paane ke liye apne raajsi jeevan ka tyaag karne wali madhyayugeen Rajput rani Meerabai ke jeevan se sambandhit kuchh daarshanik tattvon ko samjha rahe the. Ek baar ek mahaan sanyaasi Sanatan Goswami ne Meerabai se milne se isliye inkaar kar diya ki ve stree thin. Uttar mein Meerabai ne jo kuchh kaha use sunkar Goswami vinamra bankar unke charanon mein nat ho gaye.

“Mahatmaji se kaho,” Meerabai ne kaha, “ki main nahi jaanti thi ki srishti mein Ishwar ke atirikt aur bhi koi purush hai. Kya hum sab unke saamne striyaan nahi hain?” (Shaastron ka ek siddhaant yeh hai ki keval Ishwar hi ekmaatr srijan-ksham purush tattva hai, uski srishti to keval nishkriya maya hai.)

Meerabai ne bhaktiras se otproot anek padon ki rachna ki hai jo aaj bhi Bharat mein prem aur shraddha ke saath gaaye jaate hain. Unmein se ek hai:

Saadhan karna chaahi re manva, bhajan karna chaahi.  
Prem lagaana chaahi re manva, preet lagaana chaahi ॥  
Neer-nahan se Hari mile, to jal jantu hoi.  
Phal-mool khaakar Hari mile, to baadoor bandaraai ॥  
Tulsi poojanese Hari mile, to main pooju tulsi jhaad.  
Patthar poojanese Hari mile, to main pooju pahaad ॥  
Trin bhakshan se Hari mile, to bahut mrigi aja.  
Stree chhodan se Hari mile, to bahut mile khoja ॥  
Doodh peevan se Hari mile, to bahut vats baala.  
Meera kahe bina prem se na mile Nandalala ॥

Bhaduri Mahashay jahaan yaugik aasan mein baithe the, wahin unke paas padi unki khadaaun par kai shishya pranaami rakh dete the. Bharat mein prachalit is shraddha-poorn chadhaave ka arth hai ki shishya apni bhautik sampada guru ke charanon mein arpit kar raha hai. Kritagya mitron ke roop mein Prabhu hi apne bhakton ki dekhbhaal karte rahte hain.

“Gurudev aap mahaan hain!” Us pitaamah-tulya rishi se vida lete samay unki ore bhakti-poorn drishti se dekhte hue ek shishya ne kaha. “Aapne Ishwar ko paane ke liye aur hamein gyaan dene ke liye apni sampatti, aaraam aadi sab kuchh tyaag diya!” Yeh sarvavidit tha ki Bhaduri Mahashay ne bachpan mein hi vishaal paitrik sampatti ko tyaag diya tha, jab unhone ananya-bhaav se yogmaarg mein padaarpan kiya.

“Tum theek ulti baat bol rahe ho!” Bhaduri Mahashay ke mukhaaravind par bhartsana ke atyant saumya bhaav prakat hue. “Maine to antaheen aanand ka viraat saamrajya praapt karne ke liye kuchh thode-se rupaye aur kuchh tuchchh sukh-vilaason ko chhod diya. Phir maine koi tyaag kahaan kiya hai? Aur us nidhi ko baantne mein jo aanand mil sakta hai, uska mujhe gyaan hai. Ise kya tyaag kaha ja sakta hai? Alpadrishti-waale saansaarikjan hi vastav mein sachche tyaagi hain. Ve adwiteeya divya sampatti ko sansaar ke mutthi-bhar tuchchh khilaunon ke liye tyaag dete hain!”

Tyaag ki is lok-viruddh vyaakhya ko sunkar meri hansi chhoot gayi, jismein kisi bhi bhikshuk sant ko to Kuber ka mukut pahnaaya jaata hai aur dhan-garbhit karorpatiyon ko anabhigna shaheed bana diya jaata hai.

“Vidhi ka vidhaan hamare bhavishya ki yojana kisi bhi beema company se adhik achchhi tarah banata hai.” Unke ye nishkarshaatmak shabd unki apni shraddha ka anubhav-siddh dharm tha. “Aaj sansaar baahya suraksha mein hi vishwas karne wale bechain logon se bhara hua hai. Unke katu vichaar unke lalaaton par ankit ghaav-chihnon ke samaan hain. Jisne hamare pratham shwaas ke saath hi hamare liye hawa aur doodh ki vyavastha kar di woh Bhagwan apne bhakton ki din-pratidin ki vyavastha karna bhi jaanta hai.”

School se chhutti hote hi in sant ke dwaar ki teerthyaatra karne ka kram maine jaari rakha. Aantarik utsaah ke saath ve anubhav-laabh mein meri sahaayata karte rahe. Ek din ve mere ghar se door Rammohan Roy Road par rahne ke liye chal gaye. Unke shraddhaalu shishyon ne unke liye wahaan Nagendra Math* naam se ek naya aashram bana diya tha.

Yahaan meri kahaani achaanak kai varsh aage nikal jaati hai, phir bhi Bhaduri Mahashay ke mujh se kahe gaye antim shabdon ka ullekh main yahaan karna chahta hoon. Pashchim ki ore prasthaan karne se kuchh pehle main unke darshan karne gaya aur aashirvaad paane ke liye maine unke charanon par sir rakha.

“Beta! America jaao. Yug-yugantar ki Bharat ki mahima ko apni dhaal ke roop mein le jaao. Vijay tumhare lalaat par likhi hui hai; us desh ke bhale log tumhara hriday-poornak swaagat karenge.”

Sant Joseph is sansaar mein anyamanask rahte the jo vastutah Ishwar mein ananyamanaskata ke kaaran tha. Jis math mein ve rahte the wahaan ke anya sanyaasi unhein bhojan parosne ka kaam kabhi nahi karne dete the, ki kahin bhojan ke bartanon ke saath hi ve chhat tak oopar na uth jaayen. Kisi bhi samay deerghkaal tak zameen par rahne mein ashaksham hone ke kaaran ye sant is sansaar ke kisi bhi kartavya ki poorti ke liye sachmuch ayogy the. Kisi pavitra moorti ka darshan-maatr bhi sant Joseph ko seedhi udaan bharne ki avastha mein le jaane ke liye paryaapt tha, tab ek patthar ke aur doosre high-mass ke, aise do santon ko oopar hawa mein saath-saath ghoomte dekha ja sakta tha.

Avila ki sant Teresa, jinki aatma atyant unnat thi, ki shareer ka ooncha uthna aapattijanakt lagta tha. Sangathan-kaarya ke bhaari uttardayitvon ke kaaran in shareerik “utthanaatmak” anubhavon ko rokne ka unhone kaafi asafal prayaas kiya. “Jab Prabhu kuchh aur hi chaahte hain, tab ye chhoti-chhoti saavadhaaniyaan keval nishphal hoti hain,” unhone likha. Spain ke Alba naamk sthan ke girjaaghar mein rakhe sant Teresa ke paarthi shareer mein chaar shataabdiyaan beet jaane ke baad bhi abhi tak koi haas-prakriya pradarshit nahi hui hai. Unki deh se phoolon ki mahak aati hai. Yeh sthan anganit chamatkaaron ka saakshi raha hai.

`},
{ title: "Bharat ke Mahaan Vaigyanik Sir Jagadishchandra Bose", text: `
“Jagadishchandra Bose ne wireless ka aavishkaar Marconi se pehle hi kar liya tha.”

Yeh uttejak tippani sunkar main raaste ke kinare khade hokar vigyaan vishayak charcha kar rahe praadhyaapakon ke ek dal ke paas jaakar khada ho gaya. Yadi unmein sammilit hone ke peechhe meri bhaavna jaati ke abhimaan ki thi, to mujhe uska khed hai. Bharat na keval goodh chintan mein, varan bhautik vigyaan mein bhi pramukh bhoomika nibha sakta hai is baat ke pramaan mein apni gahri abhiruchi ko main asweekaar nahi kar sakta.

“Aap kahna kya chaahte hain, sir?”

Praadhyaapak Mahoday ne prasannata-poorvak spashtikaran diya. “Wireless coherer aur vidyut tarangon ki vakrata darshaane wale ek yantra ka aavishkaar sabse pehle Bose ne kiya tha. Parantu is Bhartiya vaigyanik ne apne aavishkaaron se koi aarthik laabh uthane ki cheshta nahi ki. Sheeghra hi unhone apna dhyaan ajaiv se jaiv jagat ki ore mod diya. Vanaspati-shaastragya ke roop mein unke dwara kiye gaye krantikaari aavishkaar unke bhautik vaigyanik ke roop mein kiye gaye maulik aavishkaaron se bhi kahin adhik badh-chadhakar hain.”

Mere gyaan mein vriddhi karne wale praadhyaapak Mahashay ka maine vinamrata-poorvak dhanyavaad kiya. Unhone aage kaha: “Yeh mahaan vaigyanik Presidency College mein mere sahaadhyaapak hain.”

Doosre hi din main us rishi-tulya mahaan gyaanvetta se milne unke ghar gaya jo mere ghar ke paas hi tha. Lambe samay se main door se hi unke prati shraddha-bhaav rakhta aa raha tha. Gambheer, prashaant aur ekaant-premi vanaspati-shaastragya ne shishtata-poorvak mera swaagat kiya. Unki aayu pachaas se saath varsh ke beech thi. Ve ghane kesh, visteern lalaat tatha swapnil netron ke roopwaan vyakti the. Unka shareer sugathit tha. Bolne mein unka vishuddh uchchaaran unke shuru se hi vaigyanik swabhaav ko darshaata tha.

“Pashchim ki vaigyanik societies ki sabhaon mein bhaag lekar main haal hi mein waapas aaya hoon. Mere dwara aavishkrit jeevan ki avibhaajya ektata darshaane wale upkaranon mein unke sadasyon ne gahri ruchi dikhaayi.* Bose crescograph ki parivardhan-shakti (magnifying power) ek karod guna hai. Microscope to keval kuchh sahasra guna hi parivardhan karta hai, phir bhi usne jeev-vigyaan ko teevr gati pradaan kar di, jeev-vigyaan mein praan phoonk diye. Crescograph anganit maarg kholta hai.”

“Sir! Aapne vigyaan ki amoort baahon se poorv aur pashchim ke aalingan-baddh hone ki prakriya ko tez karne ke liye bahut kuchh kiya hai.”

“Meri shiksha Cambridge mein hui. Prayogon ke aadhaar par hi kisi bhi siddhaant ki sookshm se sookshm jaanch karne ki paashchaatya paddhati kitni saraahaneey hai! Yeh prayog-moolak kaarya-paddhati mujhe apni paurvaatya virasat mein mili aatma-pareekshan ki kshamata ke saath judkar aur bhi adhik prabhaavi ho gayi. In donon ki yuti ne mujhe deerghkaal se abol rahe prakriti-jagat ke maun ko todne mein samarth banaya. Saare bhed khol dene wale mere crescograph† ke rekhachitra pramaan hain sandeh karne wale kisi bhi vyakti ke liye ki ped-paudhon mein bhi sanvedansheel snaayu-tantra hota hai aur unka jeevan vibhinn bhaavnaon se yukt bhi hota hai. Prem, ghrina, aanand, bhay, sukh, dukh, moorchchha aur anya uttejanaon ke prati asankhya prakaar ki pratikriyaon ki bhaavaanubhooti jis prakaar sab praaniyon ko hoti hai, usi prakaar sab ped-paudhon ko bhi hoti hai.”

“Sir, aapke is kshetra mein aagaman se pehle to saari srishti mein vyaapt jeevan ki adwiteeya dhadkan ek kavi ki kalpana maatr lagti hogi! Ek sant ko main kabhi jaanta tha jo kabhi koi phool nahi todte the. Ve kahte the: ‘Gulaab ke paudhe se main uska saundaryaabhimaan kaise chheen loon? Apni uddandata se use vivastr karke uske aatma-samman ko dhakka kaise pahunchaaun?’ Unke un sahaanubhooti-poorn shabdon ko aapke aavishkaaron ne aksharashah yatharth siddh kar diya hai.”

“Kavi satya se antarang hota hai, jab ki vaigyanik ajeebogareeb dhang se us tak pahunchne ka prayaas karta hai. Kisi din meri prayogshaala mein aakar crescograph ke asandigdh pramaanon ko dekh lo.”

Kritagyata-poorvak maine aamantran sweekaar kar un se vida li. Baad mein maine suna ki unhone Presidency College chhod diya hai aur ab ve Kolkata mein ek anusandhaan kendra sthaapit karne ki yojana bana rahe hain.

Jab Bose Institute ka udghaatan hua tab main us udghaatan samaaroh mein upasthit tha. Sainkdon utsaahi log sansthaan ke parisar mein idhar se udhar ghoom rahe the. Vigyaan ke is naye peeth ki kalaatmakta aur aadhyaatmik prateekaamakta ko dekhkar main mugdh hua. Uska praveshdwaar sudoor sthit kisi praacheen mandir ka avashesh hai. Kamalon* se bhare ek jalkund ke peechhe sthit mashaal-dhaari stree moorti naari ke liye amar prakash-daatri ke roop mein Bharat ke aadar ko soochit karti hai. Ek udyaan mein agochar Brahma ko samarpit ek chhota-sa mandir hai. Mandir mein moortiviheen rikt sthan Ishwar ki niraakaarta ko soochit karta hai.

Is udghaatan ke mahaan avsar par Sir Jagadishchandra Bose ka bhaashan aisa lag raha tha maanon woh seedhe kisi antah-prerit praacheen rishi ke mukh se nihsrit ho raha ho.

“Is sanstha ko main aaj keval ek prayogshaala ke roop mein nahi, varan ek mandir ke roop mein samarpit karta hoon.” Unki aadaraneey mahaanata khachaakhach bhare sabhaagrih par ek adrisya chaadar ke samaan chha gayi. “Apni khoj mein main kab padaarth-vigyaan aur prakriti-vigyaan ke seema-kshetra mein pahunch gaya, mujhe pata hi nahi chala. Mera aashcharya badhta hi gaya jab maine dekha ki sajeev jagat aur nirjeev jagat ke beech ki seema-rekhaein mit ti ja rahi hain aur sparsh-bindu ubharte ja rahe hain. Maine dekha ki nirjeev jagat nishkriya nahi tha; woh to asankhya shaktiyon ke prabhaav mein pulakit ho raha tha.

“Sab mein ek-samaan pratikriya dhaatu, vanaspati aur praani ko ek hi saamaanya niyam mein baandhti prateet hui. Ve sab thakaan aur khinnata ke tattvatah ek-samaan lakshan pradarshit karte the jinmein punah taro-taaza aur harshotphull hone ki sambhaavanaein bani rahti thin. Mrityu ke saath judi hui sthaayi pratikriya-heenata ke pradarshan mein bhi sab ek samaan the. Is viraat saamaanyatva se vismay-vibhor hokar maine bahut badi aasha ke saath apne prayogon ke parinaamon ko Royal Society ke samaksh rakha. Parantu wahaan upasthit prakriti-vaigyanikon ne mujhe unke liye surakshit kshetron par atikraman karne ke badle us padaarth-vigyaan ke kshetra tak hi apne anusandhaan ko seemit rakhne ki salaah di jis mein meri safalta ka bharosa tha. Maine anjaane mein ek aparichit jaati-vyavastha ke kshetra mein ghuskar uske shishtachaar ka ullanghan kar diya tha.

“Wahaan anjaane mein ek dharmashaastriya poorvagrah bhi kaaryarat tha jo agyaan ko bhi dharm ke samaan prashnaateet maanta hai. Yeh praayah bhula diya jaata hai ki jis paramasatta ne hamein chaaron ore se srishti ke is nitya badhte hi jaate rahasya se gher rakha hai usi ne prashn karne aur samajhne ki ichchha bhi hum mein pratishthaapit kar di hai. Anek varshon tak logon ki galatfahmiyon ka shikaar bante rahne se ek baat meri samajh mein aa gayi — vigyaan ke upaasaka ka jeevan anivaarya roop se anant sangharsh se bhara hota hai. Laabh aur haani, safalta aur vifalta ko ek samaan maante hue use apna jeevan prem-shraddha-yukt ardh ke roop mein arpan karna padta hai.

“Kaalaantar mein vishwa ki pramukh vaigyanik societies ne mere siddhaanton aur nishkarshon ko sweekaar karke vigyaan mein Bharat ke yogdaan ko maanya kiya. Jo kuchh bhi chhota ya seemit ho, woh kya Bharat ke man ko kabhi tript kar sakta hai? Ek akhand jeevant parampara aur punar-yauvan praapt karne ki ek jeevan-prad shakti ke dwara is bhoomi ne anganit parivartanon mein baar-baar apna kaayaakalp kiya hai. Bharat mein sada hi aise log utpann hote aaye hain jinhone samay ke taatkaalik aur mohak puraskaar ko thukraakar jeevan ke sarvochch abheeshton ko paane ka prayaas kiya hai — akarmanya parityaag dwara nahi, varan karmat, kathor sangharsh dwara. Sangharsh ko asweekaar karne wale durbal ke paas kuchh praapt na kar paane ke kaaran tyaagne ke liye bhi kuchh nahi hota. Jisne sangharsh kar vijay praapt ki ho, wahi keval sansaar ko apni vijay ke anubhav ka phal pradaan kar use samriddh kar sakta hai.

“Is Bose prayogshaala mein jad padaarthon ki pratikriya par ab tak kiye ja chuke kaarya se aur vanaspati-jeevan ke apratyashit tathya saamne aa jaane se padaarth-vigyaan, prakriti-vigyaan, chikitsa, krishi aur yahaan tak ki manovigyaan ke kshetra mein bhi, anusandhaan ke atyant visteern kshetra khul gaye hain. Jin uljhannon ke baare mein ab tak yeh maana jaata tha ki unhein suljhaya nahi ja sakta, ve bhi ab prayogaatmak anveshan ke kaarya-kshetra mein aa gayi hain.

“Parantu kathor sateekta ke bina uchch safalta nahi mil sakti. Isiliye pravesh-kaksh mein apne-apne case mein rakhe gaye mere dwara aavishkrit atisanvedansheel upkaranon aur vaigyanik yantron ki lambi-lambi kataarein...lagi hain. Ve drishyamaan aabhaas ke peechhe chhipe satya ko khojne ke liye aavashyak deerghkaalik anavarat prayatn ki va maanav ke seemit saamarthya ki parisimaaon ko langhne ke liye aavashyak aviraam kathor parishram, lagan aur udyogsheelta ki gaatha sunaate hain. Sabhi aavishkaarak vaigyanik jaante hain ki vaastavik prayogshaala to man hai, jahaan ve maya ke parde ke peechhe chhipe satya ke niyamon ko khoj nikaalte hain.

“Yahaan jo lecture diye jaayenge, ve kisi doosre se praapt gyaan ki punaraavrtti maatr nahi honge. Unmein in kakshon mein pratham baar siddh kiye gaye naye aavishkaaron ka gyaan diya jaayega. Is sanstha ke kaarya-vivaran ke niyamit prakaashanon dwara Bharat ke yogdaan samast vishwa mein pahunch jaayenge. Ve saarvajanik sampatti ban jaayenge. Kabhi bhi kisi bhi baat ka ‘patent’ nahi liya jaayega. Hamari raashtriya sanskriti ka saar hi yeh hai ki hamein gyaan ka prayog keval apne laabh ke liye karne ki sanskritiheenata se sadaiv door rahna chahiye.

“Meri yeh bhi ichchha hai ki is sanstha ki suvidhaein, jahaan tak sambhav ho sake, sabhi deshon ke anusandhaankartaon ke liye uplabdh hon. Ismein main apne desh ki paramparaon ko aage chalaane ka prayaas kar raha hoon. Pachchees shataabdiyon poorv bhi Bharat Nalanda aur Takshashila ke apne praacheen vishwavidyaalayon mein vishwa ke sabhi hissson se aate chhatron ko gyaanpraapti ki suvidha uplabdh karaata tha.

“Vigyaan na to poorv ka hai na pashchim ka, balki apni saarv-lauikikata ke kaaran woh sab deshon ka hai, parantu phir bhi Bharat ismein mahaan yogdaan dene ke liye vishesh roop se yogy hai.* Bhartiyon ki jwalant kalpana-shakti to oopar-oopar paraspar-virodhi lagne wale tathyon ki gutthi se bhi naya sootra nikaal sakti hai, parantu ekaagrata ki aadat ne ise rok rakha hai. Yeh sanyam man ko anant dheeraj ke saath satya ki khoj mein lagaaye rakhne ki shakti pradaan karta hai.”

Us mahaan vaigyanik ke un antim shabdon ko sunkar meri aankhein chhalchhala utheen. Yeh “dheeraj” hi kya sachmuch Bharat ka paryaayvaachi shabd nahi ban gaya hai, jisne kaal aur itihaaskaar, donon ko hi samaan roop se achambhit kar rakha hai?

Udghaatan-divas ke thode dinon baad main us anusandhaan kendra mein phir se gaya. Us mahaan vanaspati-shaastragya ko apne vachan ka smaran tha. Ve mujhe apni shaant prayogshaala mein le gaye.

“Ab main is fern ke paudhe ko crescograph lagaata hoon, iski gatividhiyon ka anek guna parivardhit chitra ubhega. Isi maatra mein yadi ghoghe ki rengne ki kriya ko parivardhit kiya jaaye to ghogha express train ki gati se chalta dikhaayi dega!”

East-West patrika ke April 1934 ke ank mein Vaisheshik shaastra ka saar Tara Mata ke ek lekh mein is prakaar diya gaya tha: “Aadhunik anu-siddhaant ki saamaanyata vigyaan ki nayi khoj maana jaata hai, parantu anek shataabdiyon poorv Kanada ne iski atyant sundar reeti se vyaakhya ki thi. Sanskrit ke anu ka Greek ke atom mein yatharth anuvaad kiya ja sakta hai kyunki atom ka Greek mein shabdashah arth hota hai akhand ya avibhaajya. Eesa poorv kaal ke Vaisheshik saahitya ke anya vaigyanik bhaashyon mein shaamil hain: (1) suiyon ka chumbak ki ore sarakna, (2) ped-paudhon mein jal ka abhisaran, (3) aakaash tattva kriya-shoonya aur gathan-rahit hone se sookshm shaktiyon ke sanchaar ka aadhaar hai, (4) saur-agni sabhi prakaar ki ushnata ka mool hai, (5) ushnata hi aanvik parivartan ka kaaran hai, (6) prithvi ke anuon mein woh gun nihit hai jo unhein aakarshan-shakti ya adhomukhi khinchaav pradaan karta hai; isi gun ke kaaran gurutvaakarshan niyam ka astitva hai, (7) sabhi prakaar ki oorja gati-moolak hai aur iska kaaran oorja ke vyay mein ya gati ke punar-vitran mein nihit hai, (8) anu-vighatan se srishti ka lop (pralay), (9) atyant sookshm kanikaaon ke sab dishaon mein akalpaneey gati se jhapatne se ushnata aur prakash ki kiranein banti hain aur prasaarit hoti hain [aadhunik cosmic rays ka siddhaant], (10) kaal aur desh ki maapein.

“Vaisheshik darshan ke anusaar vishwa ki utpatti anuon se hi hui hai. Maulik vishishtataon mein ya prakriti mein anu shaashwat hai. In anuon ko nitya spandan-gati-yukt maana jaata tha, Yeh aadhunik aavishkaar ki pratyek anu ek laghu sauramandal hai, praacheen Vaisheshik daarshanikon ke liye koi nayi baat nahi hoti. Unhone to samay ko bhi ganit ki antim sankalpana tak vibhaajit kar diya hai jismein samay ki sabse chhoti unit (kala) woh avadhi hai jo ek anu ko apne avakaash mein ghoomne mein lagti hai.”

Meri drishti utsukta-vash parde par lagi hui thi jahaan fern ki parivardhit chhaya deekh rahi thi. Sookshmaatisookshm jaiv-kriyaein bhi ab spasht dikhaayi de rahi thin, meri mantra-mugdh aankhon ke saamne woh fern ka paudha atyant dheere-dheere badh raha tha. Bose Mahashay ne paudhe ki nonk ko dhaatu ki ek chhoti-si chhad se chhua. Parde par chal raha mook-nritya hathaat rook gaya, jaise hi chhad hataayi vaise hi uski lay-baddh thirak punah shuru ho gayi.

“Tumne dekha kaise tanik-sa bhi baahya hastakshep sanvedansheel uttakon ke liye baadhak hai,” Bose Mahashay ne kaha. “Ab dekho; main ise chloroform doonga aur phir uska prabhaav nasht karne wali aushadhi bhi.”

Chloroform ke prabhaav ne vikaas ko poorntah rok diya; uska prabhaav nasht karne wali aushadhi ne use punah shuru kar diya. Parde par dikhne wale vikaas ke sanketon ne mujhe kisi cinema ke kathaanak se bhi adhik tanmayata ke saath jakad rakha tha. Bose Mahashay (yahaan khalnaayak ki bhoomika mein) ne us fern ke ek hisse mein ek teekshn aujar ghusa diya; aakasmik phadphadaahat ne dard ka sanket diya. Jab unhone paudhe ke tane ko blade se anshatah kaat diya tab chhaya mein teevr chhatpataahat dikhaayi di, phir mrityu ki antim stabdhata mein woh shaant ho gayi.

“Ek vishaal vriksh ko pehle chloroform dekar phir uska sthanaantarann karne mein maine safalta praapt kar li. Saadhaaranta vanon ke ye raja sthanaantarit karne ke kuchh hi din baad mar jaate hain.” Us jeevan-rakshak yukti-kaushal ka varnan karte hue Bose Mahashay atyant prasannata ke saath muskara rahe the. “Mere sookshmgrahi yantron ke rekhachitron ne siddh kar diya hai ki ped-paudhon mein ras-sanchaar-pranaali hoti hai; praaniyon mein jaise rakt-sanchaar hota hai, vaise hi ped-paudhon mein ras-sanchaar hota hai. Ped-paudhon mein ras ki oordhvagati ko keval keshika aakarshan (capillary attraction) sadrish kisi yaantrik kriya ke aadhaar par spasht nahi kiya ja sakta, jaisa ki saamaanyata prayaas kiya jaata hai. Crescograph ne ise sajeev koshikaaon ki kriya ke roop mein darshaaya hai. Ped ke andar se lambi golakaar nali chalti hai jismein kramik vritton mein sikudne wali lahrein uthti rahti hain jo hriday ka kaam karti hai! Hum jitni hi adhik gaharaai mein jaakar dekhenge utni hi adhik spashtata se is satya ka pramaan milta jaata hai ki is bahuvidh prakriti ka pratyek roop ek hi sootra mein bandha hai.”

Bose Mahashay ne ek anya Bose yantra ki ore ishaara kiya.

“Main tumhein tin ke ek tukde par kuchh prayog dikhaata hoon. Dhaatuon ki praan-shakti uttejana ke prabhaav mein anukool ya pratikool pratikriya dikhaati hai. Syaahi ke nishaan vibhinn pratikriyaon ko chihnaankit karenge.”

Main talleen hokar aanvik sanrachana ki lakshan-swaroop tarangon ko ankit karne wale rekhachitra (graph) ko dekhne laga. Jab Professor Sahab ne tin ko chloroform lagaaya tab kampan-lekhan tham gaya. Jab dheere-dheere us tin ki saamaanya avastha laut aayi, tab woh punah shuru ho gaya. Ab Bose Mahashay ne ek vishaela rasaayan lagaaya. Tin ke chhatpataate chor ke saath-saath sui ne adbhut roop se rekhachitra par mrityu ki soochna ankit kar di. Vaigyanik Mahoday ne kaha:

“Bose yantron ne pradarshit kar diya hai ki kanchi aur machinery mein prayukt ispat sadrish dhaatu bhi thakte hain aur beech-beech mein vishraam milne se unmein punah taazgi aur kaarya-kshamata aa jaati hai. Vidyut-pravaah ya ati bhaari dabaav se dhaatuon mein jeevan ki dhadkan ko gambheer kshati pahunchati hai ya woh dhadkan sada ke liye ruk bhi sakti hai.”

Us kaksh mein chaaron ore rakhe athak pratibha ke mukhar prateek, asankhya aavishkaaron par maine drishti daudaayi.

“Sir, yeh dukh ki baat hai ki aapke adbhut yantron ka poorn laabh uthaakar bade paimane par krishi-vikaas ko gati nahi di ja rahi hai. Inmein se kuchh yantron ko tvarit prayogon mein prayukt kar ke khaad ke vibhinn prakaaron ka paudhon par kya prabhaav padta hai, yeh dekhna kya sahaj sambhav nahi ho sakta?”

“Tum theek kah rahe ho. Bhavi peedhiyaan Bose yantron ko anganit prakaaron se prayog mein laayengi. Vaigyanik ko uske parishram ka tatkaal puraskaar kadaachit hi milta hai; srijanaatmak seva ka aanand hi uske liye paryaapt hai.”

Us adamya rishi ke prati apni haardik kritagyata vyakt kar maine unse vida li. Maine socha, “Unki adbhut pratibha ki vismaykaari urvarata kya kabhi nihshesh ho sakti hai?”

Badhte varshon ke saath unki pratibha mein koi kami nahi aayi. “Resonant Cardiograph” naamk ek jatil yantra ka aavishkaar karne ke baad Bose Mahashay asankhya Bhartiya ped-paudhon ke visteern anusandhaan mein lag gaye. Kisi ko kalpana bhi nahi thi aisi-aisi upayukt aushadhiyon ki ek viraat bheshaj-taalika taiyaar ho gayi. Cardiograph aisi achoo sateekta ke saath taiyaar kiya gaya hai ki usse ek second ka shataansh tak rekhachitra mein ankit ho jaata hai. Ped-paudhe, praani evam maanav-shareer ki sanrachana ke sookshmaatisookshm spandan bhi yeh cardiograph ankit kar leta hai. Us mahaan vanaspati-shaastragya ne bhavishyavaani ki ki vaidyaakiya anusandhaan ke liye praaniyon ke ang-chhedan ki aavashyakta nahi rahegi; cardiograph ke prayog se ped-paudhon ke ang-chhedan se hi kaam chal jaayega.

“Kisi aushadhi ke paudhe aur praani par ek saath kiye gaye prayog ke parinaamon ke ankan se saaf pata chalta hai ki un donon par us aushadhi ke prabhaav mein aashcharyajanak samaanta hai,” unhone spasht kiya. “Manushya mein jo kuchh bhi hai us sab ka poorvaabhaas ped-paudhon mein vidyamaan hai. Vanaspati jagat par prayog praaniyon aur maanavon ki yaatana ko kam karne mein yogdaan denge.”

Kai varshon ke baad Bose Mahashay ke path-pradarshak vanaspati aavishkaaron ki anya vaigyanikon dwara pushti ki gayi. Columbia University mein 1938 mein kiye gaye shodh-kaarya ki vaarta “The New York Times” mein nimnalikhit roop mein prakaashit hui thi:

Gat katipay varshon mein yeh nirdhaarit ho chuka hai ki jab mastishk aur shareer ke anya hissson ke beech tantrikaein (nerves) sandesh vahan karti hain, tab chhoti-chhoti vidyut tarangein nirman hoti hain. In vidyut tarangon ko sookshmgrahi vidyudgaaramaapi yantron (galvanometers) se maapa gaya aur aadhunik parivardhanakaari yantron se inka laksh-laksh guna parivardhan kiya gaya. Maanav ya jeevit praaniyon ke tantrika-tantuon (nerve fibres) mein pravaahit hone wali in tarangon ka adhyayan karne ka koi santoshjanak tareeka inki atyant teevr gati ke kaaran ab tak dhoondha nahi ja saka tha.

Dr. K. S. Cole aur Dr. H. J. Curtis ne yeh jaankaari di ki unhone is baat ko khoj nikaala hai ki saadhaaranta gharon mein machhli-paatr mein daala jaane wala jo meethe paani mein jeene wala paudha hota hai, jise Nitella kahte hain aur jismein ek hi lambi koshika hoti hai, uski koshika mein aur tantri-tantu ki koshikaaon mein poorn samaanta hai, koi bhi bhinnta nahi hai. Iske atirikt unhone yeh bhi paaya ki Nitella paudhe ke tantuon ko uttejit kiye jaane par ve vidyut tarangein nirman karte hain jo, keval gati ko chhodkar, anya sab drishtiyon se praani aur maanav ke tantri-tantuon mein nirman hone wali vidyut tarangon ke samaan hi hoti hain. Is paudhe ke tantuon ki vidyut tarangein praaniyon ke tantuon ki vidyut tarangon se kahin dheeme chalti dekhī gayeen. Isliye tantrikaaon mein pravaahit hone wali vidyut tarangon ke pravaah ke mand-gati chalchitra (slow motion pictures) lene ke liye Columbia University ke anusandhaankartaon ne is aavishkaar ko turant upyog mein laaya.

Is prakaar Nitella paudha man aur sthool jagat ke seema-kshetra ke gupt rahasyon ki goodhlipi ka arth jaanne mein ek prakaar se Rosetta stone* ki bhoomika ada kar sakta hai.

* Napoleon ki sena ke afsar Rosetta ko Misr mein ek prastar-khand mila tha jis par teen lipiyon mein lekh utkeern the. Uski sahaayata se praacheen Misr ki lipiyaan padh li gayeen.

Kavivar Rabindranath Tagore Bharat ke is aadarshvaadi vaigyanik ke antarang mitra the. Unhein sambodhit kar kavivar ne nimnalikhit panktiyaan likhi thin:

He tapasvi daako tumi saam-mantre* jalad-garjane,  
“Uttishthat! Nibodhata!” daako shaastra-abhimaani-jane —  
Paandityer pandatarke hate. Suvrihat vishwa-tale  
Daako moodh daambh kere. Daak daao tab shishya dale —  
Ekatre daandaak taara tab hom-hutaagni ghiria.  
Baar-baar e Bharat aapnaate aasuk phiria  
Nishthaay, shraddhaay, dhyaane-basuk se apramatta-chitte  
Lobh-heen, dwandwa-heen, shuddh, shaant gurur vedite.

* Tagore ki is kavita mein ullekhitsaam chaar Vedon mein se ek Ved hai. Anya teen hain Rigveda, Yajurveda aur Atharvaveda. Ye pavitra granth Brahma ya srashta ke swaroop ka varnan karte hain jo manushya mein aatma ke roop mein sthit hota hai. Brahma shabd ‘brih’ dhaatu se bana hai, jiska arth hai “vistarit hona.” Is mein swatah hi vistarīt hone wali Ishwariya shakti ko Vaidik sankalpana spasht hoti hai. Brahmaand ka vistaar makdi-jaal ki tarah usi Brahma se hota hai. Aatma ki Brahma ke saath saayujyata ko hi Vedon ka saar kaha ja sakta hai.

Vedon ke saar, Vedanta ne kai mahaan paashchaatya vichaarakon ko prerana di hai. French itihaaskaar Victor Cousin ne kaha tha: “Jab hum poorv ki — aur sarvopari Bharat ki — daarshanik garima ka manoyog-poorvak adhyayan karte hain, tab hamein unmein aise-aise gahan satyon ka darshan hota hai ... ki hum poorv ke darshan ke aage apne aap natmastak ho jaate hain aur hamein yeh maanna hi padta hai ki maanavjaati ki yeh aadya leela-sthali hi sarvochch darshan ki janmabhoomi hai.” Schlegel ne kaha tha: “Europeyon ka bhavyatam darshan, jo Yunaani daarshanikon dwara prastut kiya gaya vishleshanaatmak aadarshvaad hai, woh bhi paurvaatya aadarshvaad ki praan-prachurta aur sphoorti ki tulna mein aisa prateet hota hai maanon madhyaahn ke soorya ke prachand aalok ke samaksh ek ksheen sphuling maatr hai.”

Bharat ke viraat saahitya bhandaar mein Ved (vid dhaatu se, jiska arth hai jaanna) hi aise granth hain jinke rachayita ka kahin koi ullekh nahi. Rigveda (10:10, 9) mein un mantron ki utpatti apaurusheya bataayi gayi hai. Rigveda (3:39, 2) mein kaha gaya hai ki ve ati-praacheen kaal se prachalit chale aa rahe hain aur nayi bhaasha mein punar-gathit kiye gaye hain. Yug-yugantar mein rishiyon ko seedhe Ishwar se mile Vedon ko nityatva-yukt ya kaal-baadhaateet kaha jaata hai.

Ved, dhvani ke maadhyam se rishiyon ko mile, rishiyon ne unhein pratyaksh suna, isliye unhein Shruti kaha jaata hai. Moolatah ye ‘stav’ aur ‘paath’ karne ka sangrah hai. Isiliye sahastraavadhi varshon tak Vedon ki ek laakh richaon ko kabhi likha nahi gaya; ve Brahman purohiton dwara vaani se hi hastantarit kiye jaate the. Patthar aur kaagaz, donon hi kaal ke dwara mitaaye ja sakte hain. Ved jo lupt na hokar yug-yugantar se mool swaroop mein chale aa rahe hain, uska kaaran yahi hai ki rishigan jaante the ki Ved-gyaan ke hastantaran ke liye jad padaarthon ki apeksha man hi shreshth saadhan hai. “Hrit-patal” se adhik shreshth kya ho sakta hai?

Jis kram mein Vaidik shabd aate hain (anupoorvi), usi kram mein unhein banaaye rakhne ki vishisht paddhati ka, shabd-sandhi ke niyamon ka tatha akshar-sambandhon ke niyamon ka anusarann kar aur kanthasth kiye hue Ved-mantron ki vishuddhata ko vishisht ganitiya reetiyon se pramaanit kar Brahman adwiteeya dhang se Vedon ke mool roop ki raksha karte aaye hain. Pratyek Ved-shabd ke pratyek akshar ka vishisht mahattva aur saamarthya hai.

“He tapasvi! Saam-mantron ki jalad gambheer garjana se pukaaro —  
“Utho! Jaago!” Shaastra-abhimaani janon aur kutarkon se aahat buddhi panditon ko pukaaro aur unhein bekaar tarkon ka tyaag karne ko kaho. Un moodh dambhiyon ko is suvistarit sansaar mein aane ki prerana do. Apne shishyon ka bhi aahwaan karo ki ve kartavya-roopi yagya-vedi ke chaaron ore ekatrit hon, jisse hamara Bharat, hamara praacheen desh apne sachche swaroop ko punah praapt kare aur kartavya-nishtha, shraddha aur dhyaan mein apramatta-chitt hokar lobh-heen, dwandwa-heen, shuddh aur shaant bankar vishwaguru ke aasan par ek baar phir adhishthit ho.”

“Chhote Mahashay, baitho. Main apni Jagannmata se vaartalaap kar raha hoon.”

Maine atyant shraddha ke saath kamre mein chupchap pravesh kiya tha. Master Mahashay ke devata sadrish roop ne mujhe chakachoundh kar diya. Shwet resham samaan daadhi aur vishal tejasvi netron se yukt ve pavitrita ka sakshat avatar lag rahe the. Upar ki ore utha hua unka chehra aur jude hue haath dekhkar main samajh gaya ki unke paas mere us pratham aagman ne unki archana mein baadha daali hai.

Us samay tak mujhe jitne dhakke lage the un sab se badhkar teevra dhakka unke swagatpurn saral shabdon se laga. Maa ki mrityu ke kaaran hue virah-dukh ko hi main dukh ki parakashtha manta aa raha tha. Ab apni Jagannmata se virah ki bhavna meri aatma ko avarnaniya yaatna dene lagi. Vilaap karte hue main zameen par gir pada.

“Chhote Mahashay, shant ho jao!” Santavar ko sahanubhutipurn dukh ho raha tha.

Kisi agadh samudra mein asahay chhod diye gaye manushya ki tarah apne bachav ka ekmatra upay jankar maine unke charanon ko kasakar pakad liya.

“Mahatman, aap madhyasthata karen. Jagannmata se poochhiye ki kya mujh par unki kripadrishti hogi?”

Is prakar ki madhyasthata ka vachan sahaj hi nahi de diya jata; atah Mahatma chup rahne par badhya ho gaye.

Mujhe samast shankaaon se pare vishwas ho gaya tha ki Master Mahashay wahan Jagannmata se ghanishtata ke saath vaartalaap kar rahe the. Yeh sochkar main atyant apmanit anubhav kar raha tha ki meri aankhen Jagannmata ko dekh nahi sakti thin jinhen abhi is samay bhi us sant ki nirmal drishti nihaar rahi thi. Nirlajjata-purvak unke paavon pakde hue aur unke saumya virodh ko anasuna karte hue main baar-baar unki madhyasthata ki kripa ki yachna unse karta raha.

“Main param priya Maa tak tumhari prarthana pahuncha doonga.” Master Mahashay ne aakhir haar mankar sahanubhutipurn dheere-se muskurate hue kaha.

Kya shakti thi un shabdon mein ki mera man virah-vyakulta se turant mukt ho gaya!

“Mahashay, apna vachan yaad rakhiye! Maa ka sandesh pane ke liye main punah sheeghra hi aapki seva mein upasthit ho jaunga.” Ek kshan poorv hi dukh aur sisakiyon se mera jo kanth-swar avaruddh hua jata tha, ab aasha ki anand dhvani se mukharit ho raha tha.

Lambe jeene se neeche utarte-utarte ateet ki smritiyon se mera man bhar aaya. 50, Amherst Street ke isi ghar mein, jo ab Master Mahashay ka aavas tha, kisi samay mera parivar raha karta tha. Yahin meri maa ki mrityu hui thi. Swargvasi mata ke liye yahin par mera manviya hriday peedit hua tha; aur yahin par aaj Jagannmata ke virah mein meri aatma viddh ho uthi thi. Mere shok-vihval man ki vednaon aur antatah meri niramayata ki maun sakshi bani yahi ve puneet deewaren thin!

Ghar jate hue mere paon utsukta-vash jaldi-jaldi uth rahe the. Apni chhoti-si attari mein main das baje tak ekant mein dhyan karta raha. Ushn ratri ka andhkar achanak ek adbhut drishya ke saath prakashman ho utha.

Divya aabhayukt Jagajjanani mere saamne khadi thin. Madhur smit karta unka mukharavind param-saundarya ka moort roop tha.

“Sada hi maine tumhen prem kiya hai! Sadaiv main tumse prem karti rahoongi!”

Unka divya swar abhi vatavaran mein goonj hi raha tha ki ve adrishya ho gayin.

Doosre din pratahkal soorya ne kshitij par abhi jhaankna aarambh hi kiya tha ki main Master Mahashay ke ghar pahunch gaya. Hriday-vidaraks smritiyon se jude us ghar ki seedhiyan chadh kar main chauthi manzil par unke kamre ke saamne pahunch gaya. Band darwaze ki mooth par ek kapda lipta hua tha jo shayad is baat ka sanket tha ki ve ekant chahte hain. Main darwaze ke saamne duvidha mein khada tha ki itne mein Master Mahashay ne swayam hi darwaza khol diya. Maine unke poojya charankamal on mein pranam kiya.

Divya ullas ko chhipate hue maine vinod bhav mein apna mukh gambheer bana liya.

“Mahashay, aapke sandesh ke liye main aa gaya hoon — main manta hoon ki ati bhor mein hi aa gaya hoon! Kya priya Jagajjanani ne mere vishay mein kuchh kaha?”

“Natkhat chhote Mahashay!”

Iske atirikt unhone kuchh bhi nahi kaha. Spasht tha ki meri gambheerata ka natak prabhavi nahi tha.

“Itni goodhta, itna chhal kyon? Kya sant kabhi seedhi baat nahi karte?” Main shayad thoda chidh gaya tha.

“Kya meri pariksha lena anivarya hai?” Unki shant aankhen samajhdari aur vivek se bharpoor thin. “Kal raat ko 10 baje swayam divyaroopa Jagannmata ne tumhen jo aashwasan diya, uske baad bhi ab mere liye kahne ko kuchh bacha hai?”

Meri aatma ki khidkiyon ko kholne ki kunji Master Mahashay ke paas thi; maine punah unke charanon mein sashtang pranipat kiya. Parantu is baar meri aankhon se jo ashru beh rahe the ve ateev harsh ke the, dukh ke nahi.

“Kya tum sochte ho ki tumhari bhakti ne Mata ki anant karuna ko nahi chhua hai? Ishwar ka matribhav, jise tumne manviya aur daivi roopon mein pooja hai, tumhari aart pukar ka uttar diye bina kadapi nahi rah sakta.”

Ye seedhe-saade sant kaun the, jinka paramsatta se kiya gaya chhote se chhota anurodh bhi madhur sweekriti pa jata tha? Is sansar ke jeevan mein unki bhoomika atyant sadharan thi, jo meri drishti mein vinamrata ke sarvashreshth vyakti ke anuroop thi. Amherst Street ke is ghar mein Master Mahashay* ladkon ke liye ek chhota sa high school chalate the. Unke munh se kabhi daant-fatkar ka koi shabd nahi nikalta tha. Unka anushasan kisi niyam ya chhadi ki wajah se nahi tha. In saadgi-yukt kakshaon mein sachcha uchchatar ganit sikhaya jata tha, aur sikhaya jata tha prem ka rasayan shastra jiska pathyapustakon mein kabhi koi ullekh bhi nahi mil sakta.

Agamya prateet hone wale neeras upadeshon ki apeksha adhyatmik sansarg ke dwara hi ve apne gyan ka prasar karte the. Jagajjanani ke vishuddh prem mein ve itne choor rahte the ki maan-apmaan ki bahya aupacharikt aon ki ore unka koi dhyan hi nahi rahta tha.

“Main tumhara guru nahi hoon; tumhare guru thode samay baad aayenge,” unhone mujhse kaha. “Unke margdarshan mein prem aur bhakti ke roop mein tumhen mili Ishwar ki anubhootiyan unke agadh gyan ki anubhootiyon mein roopantarit ho jayengi.”

Pratidin dopahar dhalte-dhalte main Amherst Street mein unke ghar pahunch jata. Mujhe Master Mahashay ke us divya chashak ki chah rahti thi jo itna labalab bhara hua tha ki uski boonden pratidin mere upar chhalakti thin. Pehle kabhi bhi itne bhaktibhav se main natamastak nahi hua tha; ab to Master Mahashay ke charansparsh se puneet hui bhoomi par keval chalane ka avsar milne ki bhi main apna saubhagya manne laga.

Ek din sandhya samay Master Mahashay aur main ek doosre ka haath thaame unke school ke paas wale raste par chal rahe the. Mera anand pheeka ho gaya jab ek parichit ghamandi vyakti wahan aa pahuncha. Usne apne lambe pravachan se hamen tang kar diya.

Ek anya din main Howrah railway station ke paas akela hi tahal raha tha. Ek pal ke liye main ek chhote-se mandir ke paas khada ho gaya aur wahan dholak, kartal ke shor mein zor-zor se keertan karte logon ko man hi man kosne laga.

“To yeh hai woh bioscope jo Master Mahashay mujhe dikhana chahte the!” Main adheer ho utha tha, parantu chehre par uktahat ka koi bhav laakar main Master Mahashay ko dukhi nahi karna chahta tha. Itne mein ve chupchap meri ore jhuke.

“Chhote Mahashay, us bioscope se tum nirash ho gaye the parantu main samajhta hoon ki tumhen ek doosra bioscope avashya pasand aayega.” Master Mahashay aur main Vishwavidyalaya bhavan ke saamne ek footpath par khade the. Unhone hriday ke sthan par meri chhati par dheere se thapki di.

Usi ke saath mujh par ek adbhut nihshtabdhata chha gayi. Jaise aadhunik bolpat (talkies), yadi dhvaniyantr mein kuchh kharabi aa jaye to mook chalchitra ban jate hain, usi prakar, Vidhata ke haath ne kisi agamya chamtkar ke dwara jagat ke saare kolahal ka gala ghont diya. Padyatri, tram-gadiyan, motor karen, bail-gadiyan, lohe ke chakkon wali ghoda-gadiyan, sab bina koi awaaz kiye idhar se udhar aa-ja rahe the. Main apne peeche, dayein, bayein ke sabhi drishya waise hi dekh raha tha jaise apne saamne ke drishya; manon meri drishti sarvavyapi ho gayi ho. Kolkata ke us chhote-se hisse ki samast gatividhiyon ka paridrishya mere samaksh bina koi awaaz kiye chal raha tha. Rakh ki patli parat ke neeche nazar aane wali agni ki deepti ke saman maddhim prabha saare paridrishya mein vyapt thi.

“Chhote Mahashay, main dekh raha hoon ki yeh doosra bioscope* tumhen achchha laga.” Ve muskur a rahe the. Main kritagyata-vash unke saamne bhoomi par matha tekne ke liye jhukne laga. “Ab tum mere saath yeh nahi kar sakte,” unhone kaha. “Tum jaan gaye ho ki Bhagwan tumhare deh-mandir mein bhi sthit hai! Main Jagannmata ko tumhare haathon ke madhyam se apne charanon ko chhoone nahi doonga!”

Yadi kisi ne seedhe-saade, vinamra Master Mahashay ko aur mujhe us samay us bheedbhare footpath se door jate dekha hoga to use avashya hi sandeh hua hoga ki hum dono nashe mein dhut hain. Mujhe lag raha tha ki sandhya ke prakash ki rang badalti chhatayen bhi hamari hi tarah Ishwar ke nashe mein doobi ja rahi thin.

Tuccha shabdon mein unki mahatkripa ka varnan karne ka prayas karte hue yeh vichar mere man mein aaye bina nahi rahta ki kya Master Mahashay aur anya santjanon ko, jinse main mila tha, us samay yeh gyaat hoga ki anek varshon-parant main ek pashchatya desh mein baithkar unke Bhagavad-bhakti-ras se ot-proot jeevan ki gaathaen likhoonga? Unhen iska poorvagyan ho to mujhe koi aashcharya nahi hoga, na hi, main sochta hoon mere pathakon ko hoga jo yahan tak mere saath rahe hain.

Sabhi dharmon ke santon ne Ishwar ko divya priyatam mankar us saral aadhar par Ishwar-sakshatkar prapt kiya hai. Kyunki Parabrahm nirgun aur achintya hai, isliye manviya vichar aur akanksha ne sada hi use Jagannmata ka roop diya hai. Sakar, sagun Ishwar aur nirakar, nirgun Brahm ke maton ka sanyog Hindu vichardhara ki prachin upalabdhi hai, jiska pratipadan Vedon aur Bhagavad Gita mein kiya gaya hai. “Paraspar virodhi vicharon ka yeh milap” hriday aur buddhi dono ko hi santusht karta hai. Bhakti aur gyan moolatah ek hi hain. Prapatti (Ishwar mein ashray lena) aur sharanagati (Ishwariya anukampa ke prati sampoorn samarpan bhav) vastutah sarvochch gyan ke path hain.

Master Mahashay evam anya sabhi santon ki vinamrata is bodh se upajti hai ki ve poornatah us Ishwar par nirbhar hain jo ekmatra jeevitaadhar aur ekmatra Vidhata hai. Kyunki Ishwar ka swaroop hi anand hai, atah Ishwar ke saath tadatmy honewala ya us mein magn honewala manushya sahaj hi aseem anand ko anubhav karta hai. “Anand un sab cheezon mein sarvapratham aur sarvopari hai jinake liye aatma aur ichchhashakti tadapti hai.”*

Sabhi yugon ke santon ne shishu-sulabh bhav se Jagannmata ko prapt kiya aur un sabhi ne kaha ki unhone sada hi Jagannmata ko unke saath khelte paya. Master Mahashay ke jeevan mein mahattvapurn aur mahattvaheen avsaron par bhi is divya khel ki abhivyakt iyan spasht huin. Ishwar ki drishti mein kuchh bhi chhota ya bada nahi hota. Yadi chhote-se paramanu ko banane mein Ishwar ne apni atishay sookshm-darshita ke auchitya ko na lagaya hota to kya aakash Abhijit aur Swati nakshatron jaisi gauravshali rachnaon ko dharan kar pata? “Mahattvapurn” aur “mahattvaheen” ka bhed Prabhu ke liye nishchay hi agyat hai, ki kahin ek sui ke abhav mein poora Brahmand hi dhah jaye!

* Saint John of the Cross. Is priya Isai sant ki mrityu 1591 mein hui thi. 1859 mein unke parthiv shareer ko jab kabr se bahar nikala gaya to usmein kisi prakar ka koi vikar nahi hua tha.

Sir Francis Younghusband (Atlantic Monthly, December 1936) ne parmanand ki apni vaiyaktik anubhooti ke vishay mein kaha hai: “Ullas ya harsh se bhi kahin adhik teevra bhavna mere man mein uthi; main anand mein poornatah vibhor ho gaya, aur is avarnaniya evam asahyapray anand ke saath hi sansar ki sarabhoot mahanta ka bodh mere antahkaran mein jaga. Mujhe sanshayateet vishwas ho gaya ki log man se achchhe hote hain, ki unki buraiyan keval bahya hoti hain.”
