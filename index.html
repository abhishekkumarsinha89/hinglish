“Ishwar mein shraddha koi bhi chamatkar kar sakti hai, keval ek ko chhodkar—adhyayan ke bina pariksha mein utteern hona.” Jhunjhlaakar maine woh “preranaprad” pustak band kar di jise maine khali samay mein ek din utha liya tha.

“Lekhak ka yeh apvad kathan uski Ishwar mein shraddha ka poorn abhav darshata hai,” maine socha. “Bechara! Raat-raat bhar padhai karne mein use atyadhik vishwas hai!”

Maine pitaji ko vachan de rakha tha ki main apni high school ki padhai poorn karunga. Main parishrami vidyarthi hone ka dava nahi kar sakta. Mahine par mahine beette gaye the par main class room mein kam aur Kolkata ke snan-ghaton ke aas-paas sunsaan jagahon par adhik hota tha. Un ghaton ke paas sthit shamshan, jo raat mein aur bhi adhik bhayavah ban jate hain, yogi ko atyant aakarshit karte hain. Jise amar tattva ki khoj karni ho, use katipay analankrit narakpalon ko dekhkar vichalit nahi hona chahiye. Vibhinn prakar ki asthiyon se vyapt us vishadayalay mein manviya apoornata ujagar hoti hai. Is prakar mera ratri-jagaran vidyarthiyon ke ratri-jagaran se bhinn prakar ka tha.

Hindu High School ki varshik pariksha ka saptah tezi se nikat aa raha tha. Pariksha ka yeh samay bhi bhoot-preton se yukt un shamshanon ki tarah hi ek suparichit dahshat man mein utpann karta hai. Phir bhi mera man shant tha. Bhoot-pishachon ke kshetra mein ja-jakar main ek aise gyan ko khod kar nikal raha tha jo schooli kakshaon mein kabhi nahi mil sakta. Parantu mere paas Swami Pranavanandaji ka kaushal nahi tha jo ek hi samay mein do sthan on par aasani se upasthit ho sakte the. Mera tark (yadyapi anek logon ko, afsos! yeh kutark lagta hai) yeh tha ki Prabhu meri duvidha ko samajhkar mujhe usse ubaar lenge. Vipattiyon se tatskshan ubaarne ke Ishwar ke hazaron spashtikaranateet karnaamon se bhakt ke man mein aisi tarkshoonyata aa jati hai.

“Are, Mukund! Aajkal to tumhare darshan hi nahi hote!” Ek din aparahn Garpada Road par meri hi kaksha ke ek sahpathi se achanak bhet hui to usne mujh se kaha.

“Oh, Nantu! Lagta hai school mein meri anupasthiti ne mujhe nishchit taur par kathin paristhiti mein daal diya hai.” Maine uski snehapurn drishti ke aage apne hriday ka bhaar halka kiya.

Nantu, jo ek teekshn buddhi chhatra tha, dil kholkar hansne laga; aakhir meri paristhiti bhi hasyajanak hi thi.

“Varshik pariksha ke liye to tum bilkul bhi taiyar nahi ho!” usne kaha. “Lagta hai ab mujhe hi tumhari sahayata karni hogi!”

Nantu ke yeh sahaj-saral shabd daivi aashwasan bankar mere kanon mein utre. Tatparta ke saath main uske ghar gaya. Pariksha mein jin prashnon ke poochhe jane ki sambhavna use prateet ho rahi thi unke uttar usne mujhe samjha diye.

“Ye prashn aise dane hain jo anek bhole-bhale vidyarthiyon ko pariksha ke jaal mein phansa lenge. Mere uttaron ko theek se yaad karoge to tum us jaal se sahi salamat nikal jaoge.”

Jab main uske ghar se nikla tab kafi raat beet gayi thi. Udhar ki vidutta se labalab bhara hua main poore bhaktibhav ke saath prarthana kar raha tha ki agle kuchh sankatpurn dinon mein woh panditya mujh mein bana rahe. Mujhe apne vibhinn vishayon mein Nantu ne pariksha ke liye taiyar kar diya tha, parantu samayabhav ke karan Sanskrit ko bhool gaya tha. Maine utkatata-purvak Bhagwan ko is bhool ki yaad dila di.

Doosre din pratahkal main chalte kadamon ki lay par apna naya gyan aatmasat karta hua sair kar raha tha. Raste ke chhor par pahunchkar kone par sthit khali bhu-khand ki ghas-paat mein se main chal pada ki achanak meri drishti kuchh chhape hue bikhre pade kagazon par padi. Maine jhatpatkar kagaz utha liye. Mera jhatpatna sarthak bhi hua. Mere haath mein Sanskrit shlok the! Unka arth lagane ke apne ugmagate prayason mein sahayata ke liye maine ek pandit ko pakda. Unki madhur vani ne vatavaran ko us prachin bhasha* ke ninadi, madhur saundarya se bhar diya.

“In asamanya shlokon ko seekhkar Sanskrit ki tumhari pariksha mein koi sahayata nahi ho sakti.” Pandit ne un shlokon ko nishchay-purvak mere liye bekar thahraya.

Parantu un shlokon ka arth janane ke karan hi doosre din main Sanskrit ki pariksha mein pass ho saka. Nantu ne apni door-drishti se jo sahayata mujhe di thi, uske karan mujhe apne anya sabhi vishayon mein bhi utteernank mil gaye.

Pitaji khush hue ki maine high school ki padhai poori karne ka apna vachan nibhaya tha. Meri kritagyata Ishwar ke charanon mein samarpit hui. Main janta tha ki keval unki prerana ke karan hi main Nantu ke ghar pahuncha tha aur koodhe se bhare bhu-khand ke aprachalit marg se bhi unhi ki prerana se gaya tha. Unhone apni leela karte hue mujhe ubaarne ki apni yathasamay yojana ki duhri abhivyakti pradarshit ki thi.

Nirarthak mankar rakh di hui us pustak par meri drishti padi jiske lekhak ne pariksha bhavan mein Ishwar ki mahatta ko aparyapt mana tha. Mere man mein uthe is vichar par main apni hansi ko rok nahi paya:

* Sanskrit — “parikrit, poorn.” Sanskrit sabhi Indo-European bhashaon ki agraja hai. Uski lipi ko Devanagari kaha jata hai jiska shabdashah arth hai “devon ke nagar ki”. Prachin Bharat ke mahan vyakaranakarta Panini ne Sanskrit ki ganitshastriya aur manas-shastriya drishti se poornata ka gaurav karte hue kaha tha, “Jo mere vyakaran ko samajh lega woh Bhagwan ko samajh jayega.” Jo bhasha ke mool tak pahunch jayega woh sachmuch sarvagy ban jayega.

“Yadi main is lekhak ko bata doon ki mutdehon ke avsheshon ke beech baithkar Ishwar ka dhyan karna high school pariksha pass karne ka sahaj upay hai to uski uljhanein aur adhik badh jayengi!”

Nayi pratishtha se gauravanvit hokar ab main khule roop se ghar chhodne ki yojana banane laga. Apne ek samvayask mitra Jitendra Majumdar* ke saath Varanasi ke ek ashram, Shri Bharat Dharma Mahamandal mein jakar rahne ka aur wahan adhyatmik shiksha grahan karne ka maine nishchay kiya.

Apne parivar se viyog ki kalpana ek din gahra vishad ban kar mujh par chha gayi. Maa ke swargavas ke baad mere do chhote bhaiyon Sanand aur Vishnu tatha sabse chhoti bahan Thamu ke liye vishesh roop se mera prem teevra ho gaya tha. Main sheeghratapoorvak apne ekant sthan, us chhoti-si attari mein ja pahuncha jo meri aakul sadhana ke anekanek prasangon ki sakshi thi. Do ghanton ke ashrupaat ke baad maine apne mein ek apoorv parivartan anubhav kiya, jaise kisi chamatkari parishkarak tattva se mera antar dhulkar ekdam saaf ho gaya ho. Sari asakti† hawa ho gayi. Mitron ke mitra Ishwar ki khoj karne ka mera nishchay aur bhi dridh ho gaya.

“Main tumse aakhiri baar anurodh karta hoon.” Main pitaji ke samaksh unka aashirvad lene ke liye khada tha, tab unhone marmahat hokar kaha. “Mera aur apne shokakul bhai-bahnon ka tyag mat karo.”

“Poojya pitaji, main aapke prati apne prem ko kin shabdon mein vyakt kar sakta hoon? Parantu us Parampita ke liye mera prem usse bhi badhkar hai, jisne mujhe is lok mein aap jaisa aadarsh pita pradan kiya. Mujhe jane dijiye taaki main kisi din adhik divya gyan ke saath aapke paas laut sakoon.”

* Yeh Jitendra woh Jatinda (Jatin Ghosh) nahi the jo baghon se apni yathasamay vimukhta ke liye pathakon ko yaad honge.

† Hindu shastron mein kaha gaya hai ki parivarik preeti yadi samast vardaon ke data — jiske vardaon mein sage-sambandhiyon se prem karna bhi shamil hai, swayam jeevan ke vardan ke baare mein to kahna hi kya — ko pane mein badha banti hai to woh preeti bhi mayavi hai. Isa Masih ne bhi isi prakar kaha tha: “Jo mujhse adhik apne mata ya pita se prem karta hai woh mere yogy nahi.” — Matti 10:37 (Bible)

Pitaji ki anichchapurn sweekriti ke saath main Varanasi ke ashram mein pehle hi pahunch chuke Jitendra ke saath hone ke liye nikal pada. Wahan pahunchne par ashram ke yuva adhipati Swami Dayanandaji ne hriday-purvak mera swagat kiya. Lambe, chharhare badan ke, chintansheel mukhakriti wale Swamiji ke prati mere man mein anukool dharna utpann hui. Unki gauravarn mukhakriti par Buddhasaman bhav tha.

Mujhe yeh dekhkar khushi hui ki mere is naye ghar mein bhi ek attari thi. Bhor aur pratahkal ka samay main wahan vyateet karne laga. Ashramvasiyon ko dhyanabhyas ka atyalp gyan tha, atah unka vichar tha ki mujhe apna sara samay ashram ke prabandhatmak karyon mein lagana chahiye. Aparahn unke karyalay mein main jo kaam karta tha uske liye ve meri sarahana karte the.

“Ishwar ko itni jaldi pakadne ka prayas mat karo!” Ek din main bhor mein attari ki ore ja raha tha tab ek ashramvasi ne mera upahas kiya. Main Dayanandaji ke paas gaya jo Ganga ka drishya prastut karne wale apne chhote-se kaksh mein vyast the.

“Swamiji, meri samajh mein nahi aa raha hai ki yahan mujhse kya apeksha ki jati hai. Mujhe Ishwar ki pratyaksh anubhooti ki jigyasa hai. Ishwar ke atirikt main kisi aur cheez se santusht nahi ho sakta — na achchhe karyon ke saath judne se, na unke siddhant se, na unhen karne se.”

Gerua vastradhari Swamiji ne snehapurvak mera kandha thapthapaya. Nikat hi khade kuchh shishyon ko nakli fatkar ka dhong rachate hue unhone danta: “Mukund ko pareshan mat karo. Hamare taur-tareeke woh seekh lega.”

Maine shishtatapoorvak apna sandeh bheetar hi daba liya. Shishyagan kaksh se bahar chale gaye; daant ka unpar koi prabhav drishtigochar nahi ho raha tha. Dayanandaji ko ab mujhse kuchh kahna tha.

“Mukund, main dekh raha hoon ki tumhare pitaji tumhen niyamit roop se paisa bhejte hain. Woh paisa unhen lauta do; yahan tumhen kisi paise ki avashyakta nahi. Yahan tumhare niyam-palan mein doosri baat bhojan se sambandhit hai. Tum kitne hi bhookhe kyon na ho, uske vishay mein kabhi kisi se mat kaho.”

Meri aankhon mein kshudharta prakat ho rahi thi ya nahi, main nahi janta. Lekin itna avashya janta tha ki mujhe bhookh lagi hui thi. Ashram mein din ke pratham bhojan ka niyat samay 12 baje ka tha. Apne ghar mein pratah 9 baje hi bharpet nashta karne ka main aadi tha.

Teen ghanton ka yeh antar mujhe din par din adhikadhik lamba prateet hone laga. Kolkata ke ve din ab chale gaye the jab das minute ki deri ke liye bhi main rasoiye par baras padta tha. Ab main apni bhookh ko niyantrit karne ki cheshta karne laga; maine choubis ghante ka upvas poora kiya. Dugune chav aur utkantha ke saath main doosre din ke madhyahn ki pratiksha karne laga.

“Dayanandaji ki train vilamb se chal rahi hai; unke aane tak bhojan nahi hoga.” Jitendra ne aakar yeh darun varta mujhe sunayi. Do saptahon tak bahar rahe Swamiji ke swagat-samman mein anek swadisht vyanjan banakar taiyar rakhe hue the. Unki bhookh badhane wali sugandh se vatavaran bhar gaya tha. Nigalne ke liye aur kuchh bhi na mil pane par ab main beete hue kal ke upvas ke dambh ke atirikt aur nigal hi kya sakta tha?

“He Prabho! Kuchh aisa karo ki train jaldi aa jaye!” maine socha, kisi ke paas bhookh ka zikr na karne ki jo nishedhagna Dayanandaji ne mujhe de rakhi thi usmein avashya hi woh Paramdata to shamil nahi hoga! Parantu us Paramdata ka dhyan bhi us samay kahin aur tha; ghadi manthar gati se ghanton par ghante darshati gayi. Jab hamare pramukh Maharaj ne mukhya dwar se pravesh kiya tab andhera chha raha tha. Maine anandatirek ke saath unka abhivadan kiya.

“Dayanandaji ab snan karenge, tatpashchat dhyan karenge aur tab jakar bhojan parosa jayega.” Jitendra kisi apshakun soochak pakshi ki tarah phir mere paas aa gaya tha.

Main lagbhag girne jaisa ho gaya. Nirahar rahna mere yuva udar ke liye naya anubhav tha; pet mein daudne wale choohe ab use kutarne lag gaye the aur pet poori shakti ke saath vidroh kar raha tha. Durbhiksh-peediton ke jo chitra maine dekhe the ve pretatmayon ki tarah mere saamne se guzarne lage.

“Durbhiksh se Varanasi mein agli mrityu ab kisi bhi kshan isi ashram mein hone wali hai,” main soch raha tha. Sambhavit mrityu nau baje tal gayi. Khane ka bulava jaise sakshat swargiya bhoj ka nimantran ban kar aaya! Us raat ka bhojan meri smriti mein jeevan ke sabse sarthak avsaron mein se ek bankar spasht roop se baith gaya hai.

Bhojan mein pragadh talleenta bhi mujhe yeh dekhne se nahi rok payi ki Dayanandaji ka man khane mein nahi tha. Ve spashtataya meri sthool sukhanubhootiyon se oopar the.

“Swamiji, kya aapko bhookh nahi lagi thi?” Pet phatne tak khakar tripti ka sukh anubhav karta hua main unke kaam karne ke kamre mein unke saath akela tha.

“Haan, bhookh to avashya lagi thi!” unhone kaha. “Pichhle char dinon se maine kuchh bhi khaya-piya nahi tha. Main train mein kabhi kuchh nahi khata kyunki wahan ka vatavaran sansari logon ke vividh prakar ke spandon se bhara rahta hai. Mere sampraday ke sanyasiyon ke liye nirdharit saare shastriya* niyamon ka main kadai se palan karta hoon.

* Shastravihit. Shastra ka shabdashah arth hai “pavitra granth,” jiske char prakar hain: Shruti, Smriti, Puran, Tantra. In vistrit granthon mein dharmik aur samajik jeevan se sambandhit pratyek pehlu ka tatha vidhi, chikitsa, sthapatya kala, kala vigyan aadi kshetron ka aadhar hai. Shruti ve hain jo seedhe sune gaye — Ved. Smriti janashruti mein chali aa rahi kahaniyon ka sankalan hai jo prachin kaal mein kabhi antatah likh li gayin. In mein sansar ke sabse lambe mahakavya Ramayan aur Mahabharat hain. Puran ka shabdashah arth hai prachin roopak. Ye atharah hain. Tantra ka shabdashah arth hai dharm-karm ya anushthan paddhati ya karm-kaand. In granthon mein gahan satyon ko vistrit pratikatmakta ke parde mein dhakkar prastut kiya gaya hai.

“Ashram ki kuchh samasyayen mere man par chhayi hui thin. Isiliye aaj raat bhojan mein mera man nahi tha. Jaldi bhi kya hai? Kal main theek se bhojan karne ka dhyan rakhunga.” Ve hans pade.

Lajja ke mare mera dam ghutan e laga. Parantu kal ki yantrana ko aasani se bhula bhi to nahi diya ja sakta tha! Maine aur ek baat kahne ka sahas kiya.

“Swamiji, aapke aadesh se main uljhan mein pad gaya hoon. Kalpana keejiye ki main kabhi khana na maangoon aur koi apne aap mujhe khana na de. Tab to main bhookh se mar hi jaunga.”

“Tab maro!” Is bhayankar upadesh ne jaise vatavaran mein visphot kar diya. “Yadi marna hi pada to mar jao, Mukund! Kabhi bhi yeh mat mano ki tum Bhagwan ki shakti se nahi; ann ki shakti se jeevit rahte ho! Jisne bharan-poshan ke sab prakaaron ka srijan kiya hai, jisne bhookh di hai, woh Bhagwan apne bhakton ka bharan-poshan bhi avashya karega. Kabhi yeh kalpana bhi mat karna ki tum chawal se jeevit ho ya rupaya-paisa ya log tumhara palan-poshan karte hain. Yadi Prabhu tumhari pranshakti ko wapas le len to kya inmein se koi tumhari sahayata kar sakega? Ye sab to us Bhagwan ke hi sadhan matra hain. Kya is mein tumhara koi apna kartritva hai ki ann ka tumhare pet mein pachan hota hai? Vivek ki talwar ka upyog karo, Mukund! Madhyam ki zanjeeron ko kaat do aur us sab ke peeche vidyaman ‘Param Karan’ ko pehchano!”

Unke vedhak shabd mujhe apni kisi gahri majja mein utarte prateet hue. Tahas-nahas ho gayi prachin kaal se chali aa rahi woh bhranti jiske karan shareer ke aadesh aatma ko jhuka dete the. Wahin, usi kshan maine Paramatma ki sarvasamarthata ka rasaswadan kiya. Aage ke mere aviram bhramansheel jeevan mein kitne hi aparichit shaharon mein Varanasi ke us ashram mein prapt upadesh ki upyogita ko siddh karne ke kitne hi avsar aaye.

Kolkata se apne saath layi hui meri ekmatra daulat thi sadhu ka woh chandi ka taweez jo maa ne mere liye rakh chhoda tha. Varshon tak sambhalkar rakhte hue ab maine use ashram mein apne kamre mein savdhanipurvak chhupa kar rakha tha. Taweez roopi praman ko dekhkar mujhe hone wale anand ko phir se taza karne ke liye maine ek din pratah us band dibbiya ko khola. Sealband lifafa to jaisa ka waisa tha, parantu aashcharya! Taweez gayab tha. Shokakul hokar maine har sandeh ko mitane ke liye lifafa phadkar dekha. Sadhu ki bhavishyavani ke anusar, jis shoonya se sadhu ne use aamantrit kiya tha usi shoonya mein woh wapas chala gaya tha.

Dayanandaji ke shishyon ke saath mere sambandh kramashah adhikadhik bigadte chale gaye. Meri dridh udaseenata se chidhkar saare ashramvasi mujhse door hote gaye. Jis ‘aadarsh’ ke liye maine apne ghar ko aur apni sari laukik aasha-akankshaon ko chhod diya tha, us aadarsh ka dhyan karne ki meri dridh niyamnishtha par charon ore se chhichhli tanakashi hone lagi.

Darun atmik dukh se vyathit hokar ek din bhor mein hi maine yeh nishchay karke attari mein pravesh kiya ki jab tak uttar nahi milega tab tak main prarthana karta hi jaunga.

“He Karunamayi Jagannmate! Ya to tum swayam hi divya darshanon ke madhyam se mujhe sikhao, ya phir jis ke madhyam se sikhaogi us guru ko bhej do!”

Kai ghante beet gaye par subak-subak kar ki ja rahi meri prarthanaon ka koi uttar nahi aaya. Achanak mujhe aisa laga mano main sashareer oopar uthata hua aseem mahashoonya mein pahunch gaya hoon.

“Tumhare guru aaj aayenge.” Mahashoonya mein mano sab taraf se, par na jane kahan se ek divya nari swar goonja.

Itne mein aseem jagat ke us divya anubhav ko ek nishchit sthan se aayi cheekh ne chhinn-bhinn kar diya. Neeche rasoighar se Habbu naam ka ek yuva pujari mujhe pukar raha tha.

“Mukund, bahut ho gaya dhyan! Yahan ek kaam par tumhen jana hai.”

Koi doosra din hota to maine palatkar jawab de diya hota; parantu ab maine apna ashrusikt, ro-rokar sooja hua chehra ponchha aur chupchap uske paas chal diya. Habbu aur main Varanasi mein hamare ashram se door sthit Bangali Tole ke bazar mein jane ke liye nikle. Hum bazar mein saaman kharid rahe the; soorya tap to raha tha, par abhi madhyahn nahi hua tha, isliye usne apna ugra roop abhi dharan nahi kiya tha. Hum dono grihaniyon, guideon, pande-purohiton, sade vastr dharan kar rakhi vidhvaon, sammaniya Brahmanon aur Varanasi mein sarvatra vicharansheel saandon ki rang-birangi bheed mein se rasta nikalte ja rahe the. Hum aage-aage badhte hi ja rahe the ki maine apni gardan ghumakar ek aasani se dhyan mein bhi na aane wali sankari gali ki ore dekha.

Gali ke chhor par swamion ka gerua paridhan dharan kiye ek mahapurush nishchal khade the. Un par drishti padte hi mujhe aisa laga mano yug-yugantar se main unhen janta tha. Ek kshan ke liye meri pyasi aankhon ne unka lolupta se paan kiya. Parantu phir man mein sanshay jaag utha.

Mera man kahne laga, “Is parivrajak sanyasi ka chehra tumhare kisi parichit se shayad milta-julta hai. Swapndarshi, chalte chalo.”

Das minute pashchat mere paon sunn ho gaye. Aisa laga jaise dono paon patthar ban gaye hon aur ab mera bhaar aage dhone mein asamarth ho gaye hon. Bade parishram se main peeche ki ore muda, turant dono paon swabhavik avastha mein aa gaye. Phir peeche mudne par punah wahi vichitr bhaaripan laut aaya.

“Woh mahapurush mujhe chumbakiya dhang se apni ore kheench rahe hain!” Is vichar ke man mein aate hi maine apne thaile Habbu ke haath mein thama diye. Woh aashcharya se mere paonon ka naach dekh raha tha. Ab woh khilkhilaakar hans pada.

“Tumhen kya takleef hai? Pagal to nahi ho gaye ho?”

Mere man mein tumul macha rahi bhavna ke karan maine koi uttar nahi diya; chupchap tezi se chal diya.

Main aise wapas chala jaise mujhe pankh lag gaye hon aur sheeghra hi us gali mein ja pahuncha. Us ore drishti uthate hi maine dekha ki woh shant moorti sthir drishti se meri hi disha mein dekh rahi thi. Kuchh hi utkanthapurn kadam maine uthaye to seedhe unke charanon mein pahunch gaya.

“Gurudev!” Yeh divya chehra wahi tha jise maine hazaar baar divya darshanon mein dekha tha. Nukili daadhi aur lahrate keshon se sajjit singh saman mastak mein sthit un shant, tejasvi netron ne prayah mere ratrikalin vishrinkhal dhyan ke dhundhalepan se aise jhaankkar dekha tha jaise unmein koi aashwasan jhalak raha ho, jise main poori tarah samajh nahi pata tha.

“O mere priya, tum mere paas aa gaye!” Anandkampit swar mein mere guru Bangali bhasha mein baar-baar yeh kah rahe the. “Kitne varshon se main tumhari pratiksha kar raha tha!”

Nishabdata ki ekatta mein hum dono ek ho gaye; shabdon ka prayojan nikrishtatam prateet hone laga. Kayal karnewala sanvad guru ke hriday se shabdarahit santvana ban kar shishya ke hriday mein samata chala gaya. Apne antarman mein main nirvivad roop se jaan gaya ki mere guru Ishwar ko jante hain aur mujhe Ishwar tak pahuncha sakte hain. Is jeevan ka andhkar poorv jeevan ki smritiyon ke madhur arunoday mein adrishya ho gaya. Romanchak samay! Bhoot, vartaman aur bhavishya kalchakra par chakrakar ghoomte drishya hain. Soorya in pavitra charanon mein mujhe pehli baar nahi dekh raha tha!

Mera haath pakadkar mere guru mujhe Kashi ke Ranamahal kshetra mein sthit apne dere par le gaye. Unka balwan shareer dridh kadamon se aage badhta tha. Is samay unki aayu lagbhag pachpan varsh ki thi parantu unki lambi aur seedhi deh mein yuvakon ki-si chapalta aur karyakshamata thi. Unki kaali, vishal, sundar aankhon mein athah gyan ka tej tha. Halke-se ghunghrale kes unke raubeile mukh ko saumyata pradan kar rahe the. Unmein shakti aur saumyata ka sookshm sangam tha.

Jab Ganga kinare sthit ek makaan ki patthar se bani balcony, jahan se Ganga saaf dikhayi deti thi, ki ore hum ja rahe the, tab unhone pyar se kaha:

“Main apne ashram aur jo kuchh bhi mera hai, woh sab tumhen de doonga.”

“Gurudev, main keval gyan aur Ishwarprapti ke liye aapke paas aaya hoon. Mujhe aapka keval wahi guptdhan chahiye!”

Mere guru ne jab punah bolne ke liye munh khola tab tak sandhya alok ki dhoomilta aadhi utar aayi thi. Unki aankhon mein athah sneh jhalak raha tha.

“Main tumhen apna nishwarth prem pradan karta hoon.”

Amoolya shabd! Mere kanon mein dobara unke prem ka yeh ras padne tak ek chauthaai shatabdi beet gayi. Unke hoth bhavotkatata prakat karne mein anabhigy the; unke sagar saman vishal hriday ko maun priya tha.

“Kya tum bhi mujhe waisa hi nishwarth prem doge?” Ve shishusulabh aasha ke saath meri ore dekh rahe the.

“Main aapse sada-sarvada ke liye prem karunga, Gurudev!”

“Sadharan prem swarthi hota hai, uska mool kamnaon aur triptiyon ki daldal mein sthit hota hai. Divya prem mein koi shart nahi hoti, koi seema nahi hoti, koi parivartan nahi hota. Shuddh prem ke stambhankari sparsh se manviya hriday mein nitya hone wale parivartan sada ke liye ruk jate hain.” Vinamratapoorvak unhone aage kaha, “Yadi kabhi bhi tum mujhe Ishwarprapti ki avastha se girta dekho, to mujhe vachan do ki tum mera sir apni god mein lekar mujhe us priyatam Prabhu ke paas lauta lane mein sahayata karoge, jise hum dono poojte hain.”

Failte hue andhakar mein ve uthkar khade hue aur mujhe andar ek kamre mein le gaye. Hum aam aur badam ki kuchh mithaiyan khane lage. Saath-saath vaartalaap chal raha tha. Apne vaartalaap mein unhone bina kisi aalochnaatmak rookh ke, sahajbhav se mere swabhav ka gahra gyan vyakt kiya. Unki antarnjat vinamrata aur agadh gyan ke pratap ko dekhkar main vismay-vibhor ho gaya.

“Apne taweez ke liye dukh mat karo. Uska uddeshya poora ho chuka hai.” Kisi daivi darpan ki bhaanti mere guru ne spashtataya mere sampoorn jeevan ke pratibimb ko dekh liya tha.

“Gurudev, aapki upasthiti ki jeevant sachchai ka anand kisi bhi prateek se kahin badhkar hai.”

“Jahan tak ashram mein tumhari dukhad paristhiti ka sambandh hai, to usmein parivartan ka samay aa gaya hai.”

Maine apne jeevan ka koi bhi ullekh nahi kiya tha; uska koi bhi ullekh ab nirarthak prateet ho raha tha! Unke sahaj-sadharan dhang ko dekhte hue yeh baat meri samajh mein aa gayi thi ki unki divya drishti par kisi prakar ka vismay prakat karna unhen achchha nahi lagega.

“Tumhen Kolkata laut jana chahiye. Manavjati ke prati apne prem se apne ristedaron ko hi kyon vanchit karo?”

Unke is sujhav se main nirash ho gaya. Mere parivar ke ghar laut aane ka anurodh karne wale anek patron ki main upeksha karta raha tha, tab bhi parijan mere lautne ki bhavishyavani kar hi rahe the. Anant ne to kaha tha, “Is pakshi shavak ko adhyatmik aakash mein ud lene do. Wahan ke bhari vatavaran mein iske pankh thak jayenge. Tab hum ise ghar ki ore neeche jhapatta marte aur apne pankh sametkar chupchap apne parivarik ghonsole mein aaram karte dekhenge.” Utsah bhang karne wali yeh tulna mere man mein abhi tazi thi aur main Kolkata ki disha mein koi “jhapatta na marne” ke liye kritsankalp tha.

“Gurudev, main lautkar ghar nahi jaunga. Parantu main aapke saath kahin bhi aane ke liye taiyar hoon. Kripa karke mujhe apna naam aur pata bata dijiye.”

“Swami Shri Yukteshwar Giri. Mera mukhya ashram Shrirampur mein Rayghat Lane mein hai. Yahan main keval thode dinon ke liye apni maa se milne aaya hoon.”

Bhagwan ki apne bhakton ke saath goodh leela dekhkar main hairan tha. Shrirampur Kolkata se keval barah meel door hai, phir bhi us ilake mein kabhi mujhe apne guru ki jhalak nahi mili. Ek doosre se milne ke liye hamen yatra karke Lahiri Mahashay ki smritiyon se puneet prachin nagari Kashi aana pada. Is nagari ki dharti ko Buddha, Shankaracharya* aur anekanek yogiyon, avataron ki charanraj ne bhi pavitra kiya hai.

* Bharat ke sarvashreshth darshanik Shrimad Shankaracharya Govind Yati ke shishya the. Govind Yati Gaudapad ke shishya the. Shankaracharya ne Gaudapadkrit Mandukya Karika par apna suvikhyat bhashya likha. Akhandaniya tark aur atyant sundar shaili mein Shankaracharya ne Vedant darshan ko advaitvadi bhav mein vyakhya ki. Us mahan advaitvadi ne bhakti-prem-moolak kavyon ki bhi rachna ki hai. Unke ‘Devyaparadh Kshamapan’ stotra ka dhruvpad hai, ‘Kuputro jayet kvachidapi kumata na bhavati’, arthaat kuputra to kabhi ho bhi sakta hai, parantu kumata kabhi nahi ho sakti.

Shankaracharya ke ek shishya Sanandan ne ‘Brahmasutra’ par ek bhashya likha. Is bhashya ki pandulipi aag mein jal gayi parantu Shankaracharya ne (unhone ek baar us par nazar ghumayi thi) apne shishya ko uska ek-ek shabd bata diya. ‘Panchapadika’ namak ukt bhashya ka aaj bhi vidwan log adhyayan karte hain.

Ek alaukik ghatna ke pashchat shishya Sanandan ko naya naam mila. Ek din nadi tat par ve baithe the tabhi unhen nadipar se Shankaracharya dwara bulaye jane ki awaaz sunayi di. Sanandan ne turant nadi mein pravesh kiya. Unki shraddha aur unke paon, dono ko hi tab mazboot aadhar mila jab Shankaracharya ne prachand veg se bahte jal mein unke pratyek padkshep ke neeche ek kamal utpann kar diya. Ab shishya ko Padmapad kaha jane laga, arthaat kamal charan.

Panchapadika mein Padmapad ne vividh prakar se apne guru ke prati bhakti aur prem vyakt kiya hai. Shankaracharya ne swayam ye sundar panktiyan likhi thin:

Drishtanto naiva drishtastribhuvanajathare sadguro’gnidatuh sparshakshettatra kalpyah sa nayati yadaho swargatamashmasaram. Na sparshatvam tatha’pi shritacharanayuge sadguruh sweeyashishye sweeyam samyam bidhatte bhavati nirupamastena va’laukiko’pi॥

(Shat Shlokon — Shlok 1)

Arthaat, sachche guru ke samatulya tribhuvan mein kuchh bhi nahi hai. Parasmani ke astitva ki kalpana ko bhi yadi satya man liya jaye to woh bhi lohe ko keval sona bana sakti hai, doosri parasmani nahi bana sakti. Kintu puny sadguru ke charanon mein jo shishya aashray lete hain unhen sadguru apne saman hi bana dete hain. Isliye guru anupam hai, balki alaukik hai.

Bhagwan Shankaracharya mein santatva, panditya aur karmathata ka durlabh milap hua tha. Keval battees varsh hi ve is jagat mein rahe, parantu unmein se bhi anek varsh apne advait mat ka Bharat ke kone-kone mein prasar karte hue unhone sampoorn desh ki yatraen karne mein bitaye. Ve jahan bhi jate, unke adhar se nihsrit hone wale gyanamrit ka paan karne ke liye vishal janasamuday ekatrit hote.

Shankaracharya ne desh ki unnati ke liye jo anekanek sudhar kiye unmein prachin swami parampara ka punargathan bhi sammilit hai. Unhone desh ke char konon mein char mathon ki bhi sthapana ki — dakshin mein Shrungi mein, poorv mein Puri mein, pashchim mein Dwarka mein tatha uttar mein Badrinath mein.

Rajaon aur janasamany ka aashray evam samarthan prapt ye math Sanskrit vyakaran, tarkashastra tatha Vedant darshan mein vidyarthiyon ko nishulk shiksha pradan karte hain. Bharat ke char konon mein apne math banane ke peeche Shankaracharya ka mukhya hetu yeh tha ki is vishal desh mein dharmik aur rashtriya ekatta badhe. Abhi bhi Bharat mein teerthyatriyon ko vividh dharmaday sansthaon ya dharmik pravritti ke vyaktiyon dwara sanchalit dharmashalaon mein nishulk nivas ki vyavastha prapt hoti hai.

“Tum char saptahon mein mere paas aa jaoge.” Shri Yukteshwar ke swar mein pehli baar kathorta aa gayi thi. “Ab jab ki maine tumhen apne chirantan prem ke baare mein bata diya hai aur tumhen pane par apna harsh prakat kar diya hai, to tum mere anurodh ki avahelna karne par tule hue ho. Agli baar jab hum milenge, tab tumhen apne mein meri ruchi ko punah jagrit karna padega. Main aasani se tumhen shishya roop mein sweekar nahi karunga: meri kathor shiksha ke agyapalan dwara sampoorn samarpan tumhen karna hoga.”

Main duragraha-purvak chup raha. Mere guru ne sheeghra hi meri samasya ko pehchan liya.

“Tum samajhte ho ki tumhare ristedar tum par hansenge?”

“Main lautkar nahi jaunga.”

“Tum tees din mein laut jaoge.”

“Kadapi nahi.”

Is vaadvivad se utpann tanav mein koi kami nahi aayi. Maine unke charanon mein aadar-purvak pranam kiya aur wahan se chal diya. Arddharatri ke andhakar mein ashram ki ore chalta hua main sochta ja raha tha ki hamari is adbhut bhet ka ant itna besura kyon hua? Maya ka taraju pratyek anand ke saath samatulya dukh bhi taul deta hai! Mera kishor hriday abhi mere guru ki roopantarikari ungliyon ke liye paryapt mulayam nahi bana tha.

Doosre din subah maine dekha ki ashramvasiyon ka mere prati dveshbhav aur bhi adhik badh gaya hai. Ve nitya ashishtataon se mujhe din bhar satane lage. Teen saptah is prakar beet gaye; phir Dayanandaji ek sammelan mein bhag lene ke liye Mumbai chale gaye. Mujh abhage ke sir par jaise pahad toot pada.

“Mukund parajeevi hai. Ashram ki suvidhaon ka to labh utha raha hai par badle mein ashram ke liye kuchh nahi karta.” Ek din mujh par chal rahi yeh teeka-tippani mere kanon mein padi to pehli baar mujhe khed hua ki maine sara paisa pitaji ko wapas bhej dene ke aadesh ko maan liya tha. Bhari hriday se main apne ekmatra mitra Jitendra ke paas ja pahuncha.

“Main ashram chhodkar ja raha hoon. Jab Dayanandaji laut aayen to unke charanon mein mera pranam kahkar meri ore se kshama maang lena.”

“Main bhi yeh ashram chhodkar aa raha hoon. Yahan mere dhyan karne ke prayason par pratikriya ka haal bhi tumhare jaisa hi hai.” Jitendra nishchay-purvak bol raha tha.

“Main ek Ishwarprapt sant se mila hoon. Chalo hum unke paas Shrirampur chalte hain.”

Aur is prakar “pakshi” Kolkata ke sankatjanak roop se nikat “neeche jhapatne” ki taiyari kar raha tha.

/* ======================= Reader engine (no need to edit) ======================= */
const $=s=>document.querySelector(s), G=24;
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let prefs=Object.assign({fs:19,ff:"serif",lh:1.7,m:1,t:"",b:1,n:0},store.get("rd:prefs",{}));
let book=null,ci=0,pi=0,pages=1,W=0,H=0,lens=[],total=0,pos={};

function applyPrefs(){
  document.documentElement.style.setProperty("--fs",prefs.fs+"px");
  document.documentElement.style.setProperty("--lh",prefs.lh);
  document.body.dataset.t=prefs.t;
  if(prefs.n)document.body.dataset.night="1";else delete document.body.dataset.night;
  $("#dim").style.opacity=(1-prefs.b).toFixed(2);
  $("#bri").value=Math.round(prefs.b*100);
  document.querySelectorAll("#set [data-n]").forEach(b=>b.classList.toggle("on",+b.dataset.n===prefs.n));
  $("#tx").classList.toggle("sans",prefs.ff==="sans");
  document.querySelectorAll("#set [data-f]").forEach(b=>b.classList.toggle("on",b.dataset.f===prefs.ff));
  document.querySelectorAll("#set [data-l]").forEach(b=>b.classList.toggle("on",+b.dataset.l===prefs.lh));
  document.querySelectorAll("#set [data-m]").forEach(b=>b.classList.toggle("on",+b.dataset.m===prefs.m));
  document.querySelectorAll("#set .sw").forEach(b=>b.classList.toggle("on",b.dataset.t===prefs.t));
  store.set("rd:prefs",prefs);
}

/* Library */
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
function bookPct(b){const p=pos[b.id];if(!p)return 0;const L=b.chapters.map(c=>c.text.length),T=L.reduce((a,x)=>a+x,0)||1;return Math.min(100,Math.round((L.slice(0,p.c).reduce((a,x)=>a+x,0)+L[p.c]*p.f)/T*100))}
function renderLib(){
  pos=store.get("rd:pos",{});
  $("#libTitle").textContent=LIBRARY.title;$("#libSub").textContent=LIBRARY.subtitle;document.title=LIBRARY.title;
  $("#grid").innerHTML=BOOKS.map((b,i)=>{
    const h=hue(b.title),pct=bookPct(b);
    const cv=b.cover?`<div class="cover"><img src="${b.cover}" alt="Cover of ${esc(b.title)}" loading="lazy"></div>`
      :`<div class="cover gen" style="background:linear-gradient(160deg,hsl(${h} 38% 34%),hsl(${(h+40)%360} 45% 20%))"><b>${esc(b.title)}</b><i>${esc(b.author||"")}</i></div>`;
    return `<button class="book" data-i="${i}">${cv}<div class="bt">${esc(b.title)}</div><div class="ba sans">${esc(b.author||"")}</div>${pct?`<div class="bp"><span style="width:${pct}%"></span></div><div class="bs sans">${pct}% read</div>`:`<div class="bs sans">${b.chapters.length} chapter${b.chapters.length>1?"s":""}</div>`}</button>`}).join("");
}
$("#grid").onclick=e=>{const b=e.target.closest(".book");if(b)openBook(+b.dataset.i)};

/* Open / close */
function openBook(i){
  book=BOOKS[i];lens=book.chapters.map(c=>c.text.length);total=lens.reduce((a,x)=>a+x,0)||1;
  const p=pos[book.id]||{c:0,f:0};
  $("#lib").classList.add("hidden");$("#rd").classList.remove("hidden");
  $("#bookT").textContent=book.title;document.title=book.title;
  $("#toc").innerHTML=`<h4>${esc(book.title)}</h4>`+book.chapters.map((c,k)=>`<button data-c="${k}">${esc(c.title)}</button>`).join("");
  hideChrome();applyPrefs();loadChapter(Math.min(p.c,book.chapters.length-1),p.f);
}
function closeBook(){save();$("#rd").classList.add("hidden");$("#lib").classList.remove("hidden");book=null;renderLib()}

/* Chapter rendering + pagination (CSS columns) */
function chapterHTML(c,n){
  const parts=c.text.trim().split(/\n\s*\n/).map(s=>s.trim().replace(/\s*\n\s*/g," ")).filter(Boolean);
  return `<div class="k">Chapter ${n}</div><h2>${esc(c.title)}</h2>`+parts.map(p=>p.startsWith("## ")?`<h3>${esc(p.slice(3))}</h3>`:`<p>${esc(p)}</p>`).join("")+`<p class="end">&#9702; &#9702; &#9702;</p>`;
}
function layout(frac){
  const vp=$("#vp"),pad=[14,28,56][prefs.m]*(vp.clientWidth<700?.6:1)+ (vp.clientWidth<700?4:10)*(prefs.m+1);
  W=Math.floor(Math.min(vp.clientWidth-pad*2,[760,680,560][prefs.m]));
  H=Math.floor(vp.clientHeight-(vp.clientWidth<700?28:56));
  const pg=$("#pg"),tx=$("#tx");
  pg.style.width=W+"px";pg.style.height=H+"px";
  tx.style.width=W+"px";tx.style.columnWidth=W+"px";tx.style.columnGap=G+"px";
  pages=Math.max(1,Math.round((tx.scrollWidth+G)/(W+G)));
  pi=Math.min(pages-1,Math.round(frac*pages));
  show(false);
}
function loadChapter(c,frac){
  ci=c;$("#tx").innerHTML=chapterHTML(book.chapters[c],c+1);
  document.querySelectorAll("#toc button").forEach(b=>b.classList.toggle("on",+b.dataset.c===c));
  layout(frac||0);
}
function show(flash=true){
  const tx=$("#tx");
  const go=()=>{tx.style.transform=`translateX(${-pi*(W+G)}px)`;tx.classList.remove("fade");progress();save()};
  if(flash){tx.classList.add("fade");setTimeout(go,90)}else go();
}
function progress(){
  const f=pi/pages,done=lens.slice(0,ci).reduce((a,x)=>a+x,0)+lens[ci]*(pages>1?pi/(pages-1):1);
  const pct=Math.min(100,Math.round(done/total*100));
  $("#barF").style.width=pct+"%";
  $("#fl").textContent=book.chapters[ci].title;
  $("#fr").textContent=`Page ${pi+1} of ${pages} \u2022 ${pct}%`;
}
function save(){if(!book)return;pos[book.id]={c:ci,f:pi/pages};store.set("rd:pos",pos)}
function next(){if(pi<pages-1){pi++;show()}else if(ci<book.chapters.length-1){loadChapter(ci+1,0)}}
function prev(){if(pi>0){pi--;show()}else if(ci>0){loadChapter(ci-1,.999)}}

/* UI */
function hideChrome(){$("#top").classList.add("off");closePanels()}
function closePanels(){["#toc","#set","#shade"].forEach(s=>$(s).classList.add("hidden"))}
function panel(id){const o=!$(id).classList.contains("hidden");closePanels();if(!o){$(id).classList.remove("hidden");$("#shade").classList.remove("hidden")}}
$("#vp").onclick=e=>{
  if(swiped){swiped=false;return}
  const x=e.clientX/innerWidth;
  if(x<.3)prev();else if(x>.7)next();else $("#top").classList.toggle("off");
  closePanels();
};
$("#shade").onclick=closePanels;
$("#back").onclick=closeBook;
$("#tocBtn").onclick=()=>panel("#toc");
$("#setBtn").onclick=()=>panel("#set");
$("#toc").onclick=e=>{const b=e.target.closest("button");if(b){hideChrome();loadChapter(+b.dataset.c,0)}};
$("#set").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.a)prefs.fs=Math.max(14,Math.min(30,prefs.fs+(d.a==="fs+"?1:-1)));
  if(d.f)prefs.ff=d.f; if(d.l)prefs.lh=+d.l; if(d.m)prefs.m=+d.m; if(d.n)prefs.n=+d.n; else if(d.n==="0")prefs.n=0; if("t" in d)prefs.t=d.t;
  applyPrefs();layout(pi/pages);
};
$("#bri").oninput=e=>{prefs.b=e.target.value/100;applyPrefs()};
$("#nightBtn").onclick=()=>{prefs.n=prefs.n?0:1;applyPrefs()};
let sx=0,sy=0,swiped=false;
$("#vp").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$("#vp").addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){swiped=true;dx<0?next():prev();setTimeout(()=>swiped=false,350)}
},{passive:true});
addEventListener("keydown",e=>{
  if(!book)return;
  if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();next()}
  else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();prev()}
  else if(e.key==="Escape"){closePanels()}
});
let rz;addEventListener("resize",()=>{if(!book)return;clearTimeout(rz);rz=setTimeout(()=>layout(pi/pages),150)});

applyPrefs();renderLib();
</script>
</body>
</html>
