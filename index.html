<script>
const LIBRARY = { title: "My Library", subtitle: "Choose a book to start reading." };

const BOOKS = [
  {
    id: "book-1",                      // unique, no spaces
    title: "Autobioraphy of a Yogi",
    author: "Paramhansa Yogananda",
    cover: "AOAY-cover.jpeg",                         // image URL / data URI, or "" for generated cover
    chapters: [
      { title: "Mere Mata-Pita Evam Mera Bachpan", text: `

Param satya ki khoj aur uske saath juda guru-shishya sambandh prachin kaal se hi Bhartiya sanskriti ki visheshata rahi hai.

Is khoj ke mere apne marg ne mujhe ek Bhagavatsvaroop siddh purush ke paas pahuncha diya jinka sughad jeevan yug-yugantar ka aadarsh banne ke liye hi tarasha hua tha. Ve un mahan vibhutiyon mein se ek the jo Bharat ka sachcha vaibhav rahe hain. Aise siddhjanon ne hi har peedhi mein avatarit ho kar apne desh ko prachin Mishra (Egypt) evam Babylon ke samaan durgati ko prapt hone se bachaya hai.

Mujhe yaad aata hai, mere shaishav-kaal mein pichhle janm ki ghatnaon ki smritiyan mere smritipatal par ubhar rahi thin, tathapi ye smritiyan un ghatnaon ke ghatit hone ke kram ke anusar nahi thin. Bahut pehle ke ek janm ki spasht smritiyan mujh mein jagti thin jab main Himalaya mein rehnevala ek yogi tha. Ateet ki in jhankiyon ne kisi agyaat kadi se judkar mujhe bhavishya ki bhi jhalak dikhayi.

Shishu avastha ki asahay ke avamaananaon ki smriti mujhme abhi bhi bani hui hai. Chal-phir pane mein aur apni bhavnaon ko mukt roop se vyakt kar pane mein asamarth hone ke karan main vikshubdh rehta tha. Apne shareer ki akshamtayon ka bhaan hote hi prarthana ki lahren mere bheetar uthne lagti thin. Mere vyakul bhaav anek bhashaon ke shabdon mein mere man mein vyakt hote the. Vividh bhashaon ke aantarik sambhram ke beech main dheere-dheere apne logon ke Bangali shabd sunne ka abhyast hota gaya. Yeh thi shishu-mastishk ki man bahlane ki seema, jise bade log keval khilaunon aur angutha choosne tak hi seemit maante hain!

Is mansik vikshubdhata aur mera saath na denevale shareer ke karan kai baar main jhallaakar aakulta se ro padta tha. Meri aakulta par parivar mein sabko hone vala vismay mujhe yaad hai. Sukhad smritiyan bhi anek hain: meri maa ka dulaar aur tutlane tatha ladkhada ke chalane ke mere aarambhik prayas. In aarambhik safaltaon ko samanyatah jaldi hi bhula diya jata hai, parantu phir bhi ye aatmavishvas ki swabhavik aadhar-shilayein hoti hain.

Meri in sudurgami smritiyon ka hona koi apoorv baat nahi hai. Anek yogiyon ke vishay mein gyaat hai ki unhone janm-mrityu ke natakeey avastha parivartan mein bhi apne aatmabodh ko banaye rakha. Yadi manushya keval shareer hota to nihsanshay uski mrityu ke saath hi uska astitva samaapt ho jata. Kintu yadi yug-yugantar se siddh mahatmaon ne satya pratipadit kiya hai to manav moolatah ashariri, sarvavyapi aatma hai.

Shaishavavastha ki suspasht smritiyon ka hona vilakshan to hai kintu aisi ghatnaein ati durlabh bhi nahi. Anek deshon mein yatra karte hue maine anek satyanishth stri-purushon ke mukh se unki shaishavavastha ki smritiyan suni hain.

Mera janm poorvottar Bharat mein Himalaya parvat shreni ke nikat sthit Gorakhpur mein 5 January 1893 E. ko hua tha. Wahin mere jeevan ke pehle aath varsh vyateet hue the. Hum aath bachche the: chaar bhai aur chaar behnein. Main Mukundlal Ghosh,* bhaiyon mein doosra aur mata-pita ki chauthi santaan tha.

Mere mata-pita Bangali Kshatriya the. Dono hi sant-prakriti ke the. Unke shant evam shaaleen daampatya prem mein kabhi koi anarthak vyavhaar vyakt nahi hua. Mata-pita ke beech aapas mein saamanjasya chaaron or chalane vale aath nanhe jeevon ke kolahal ka shant kendra tha.

* 1915 mein jab main sannyas ki prachin Swami parampara mein shaamil ho gaya tab mera naam badalkar Yoganand ho gaya. 1935 mein mere guru ne mujhe Paramahansa ki uchchatar sannyas upaadhi pradaan ki (prakaran 24 aur 42 dekhein).

Mere pita Shri Bhagavati Charan Ghosh swabhav se dayalu, gambheer aur kabhi-kabhi kathor the. Unse atyant pyaar karte hue bhi hum bachche unse aadaryukt doori banaye rakhte the. Ve asaadharaan ganitagy aur tarkashastravetta the tatha mukhyatah apni buddhi se hi kaam lete the. Kintu maa to sneh ki devi thin aur hamein keval prem ke dwara hi sikhati thin. Maa ke dehant ke pashchaat pitaji apni aantarik komalta adhik spasht roop se vyakt karne lage. Tab maine dekha ki unki aankhon mein prayah meri maa ki aankhon ki jhalak dikhayi padti thi.

Maa ke sannidhya mein hum bachchon ka bachpan mein hi dharmgranthon ke saath katu-madhur parichay ho gaya. Anushasan ki aavashyakta padne par maa Ramayan aur Mahabharat se prasangochit kahaniyan hamein sunati thin. Aise avsaron par daant aur shiksha, dono hi saath-saath chalte the.

Pitaji ke prati aadar ke prateek swaroop karyalay se unke ghar aane par unka swagat karne ke liye shaam mein maa hum bachchon ko kapde aadi pehnakar dhyanpurvak taiyar karti. Pitaji Bharat ki tatkalin badi companies mein se ek, Bengal-Nagpur Railway (B. N. R.) mein upa-adhyaksh (Vice-President) ke samkaksh pad par karyarat the. Yatra unke karya ka ek hissa thi; hamara parivar mere balyakal mein anek shaharon mein raha.

Maa gareebon ki sahayata ke liye sada tatpar rahti thi. Pitaji bhi is mamle mein karunapoorna drishtikon rakhte the parantu apni aarthik seema ke andar hi vyay karna pasand karte the. Ek baar pandrah dinon mein maa ne gareebon ko khilane mein pitaji ki masik aay se adhik rakam kharch kar di.

Is par pitaji ne maa se kaha: “Main tum se keval itna hi kehna chahta hoon ki kripa karke apna daandharm tum uchit seema ke andar karo.” Maa ko apne pati ki yeh saumya ulahna bhi vyathajanak lagi. Bachchon ko kisi prakar ke matbhed ka koi aabhas diye bina maa ne ek ghodagadi mangwayi.

“Namaskar! Main apne mayke ja rahi hoon.” Prachin dhamki!

Hum log chakit hokar vilap karne lage. Usi samay sanyogavash hamare mama wahan aa gaye. Unhone pitaji ke kaan mein fusfusakar dheere se koi paramarsh diya, nihsanshay sadiyon se chala aa raha koi upay. Pitaji ke kuch sandhijanak spashtikaran ke baad maa ne khushi-khushi ghodagadi lautaa di. Apne mata-pita ke beech mere dwara dekhe gaye ekmatra vivad ka is prakar ant hua. Parantu ek vishesh samvad mujhe yaad aata hai.

“Kripa abhi-abhi ghar par aayi ek asahay mahila ko dene ke liye mujhe das rupaye deejiye.” Maa ki muskurahat mein manane ki apni ek shakti thi.

“Das kislie? Ek rupaya kaafi hai.” Pitaji ne iske saath ek auchitya-samarthan bhi jod diya: “Jab mere pitaji aur dada-dadi ki achanak mrityu ho gayi tab maine gareebi ko pehli baar anubhav kiya. Meelon chalkar school jaane se pehle mera nashta hota tha keval ek chhota kela. College pahunchne tak meri avastha itni buri ho gayi ki maine ek dhani nyayadheesh se masik ek rupaye ki sahayata ke liye prarthana ki. Usne yeh kehte hue mana kar diya ki ek rupaya bhi moolyavan hota hai.”

“Us ek rupaye ke mana kiye jaane ki aapko kitni kadvi yaad hai!” Maa ke hridaya se tatkal tark ubhra. “Kya aap chahte hain ki yeh mahila bhi aapke dwara in das rupayon ko mana kiye jaane ki vaisi hi dukhad smriti apne man mein rakhein jinki use teevr aavashyakta hai?”

“Tum jeeti!” Parabhut pati ki sanatan bhaav bhangima ke saath pitaji ne apna batua khola aur kaha: “Yeh lo das rupaye ka note. Us mahila ko yeh meri shubhkamnaon sahit de do.”

Kisi bhi naye prastav par pehle “nahin” keh dena pitaji ka swabhav tha. Itni sahajata se maa ki sahanubhuti jagane vali us aparichita ke prati pitaji ka raiya unki swabhavgat satarkata ka ek udaharan tha. Tatshan koi baat sweekar kar lene mein anichchha vastutah “soch-vichar ke baad nirnay” ke siddhant ka palan matra hai. Maine sada hi dekha ki pitaji uchit aur santulit nirnay lete the. Yadi main apne anekanek anurodhon ke paksh mein ek-do achchhe tark prastut kar deta, to ve sada hi meri ichchha poori kar dete — chahe vah ichchha chuttiyon mein bhraman-yatra ki ho ya nayi motorcycle ki.

Apne bachchon ke balyakal mein pitaji anushasan mein unke saath dridhta baratte the, parantu swayam kisi vairagi ki tarah saral, satvik jeevan vyateet karte the. Udaharanarth, ve kabhi theatre nahi gaye, balki vividh adhyatmik sadhanaon mein aur Bhagavad Gita padhne mein hi unhe anand aata tha. Unhone saare sukhopabhogon ka tyag kar diya tha, yahan tak ki ve jooton ki ek jodi ka bhi tab tak prayog karte the jab tak ki vah bilkul hi prayog na karne yogya na ho jay. Motorcars sadharan chalan mein aa jaane ke baad unke beton ne caren kharid liin, parantu pitaji pratidin apne office jaane ke liye tramgadi ki sawari mein hi santusht rahe.

Satta ya varchasv prapt karne ke liye dhan-sanchay karne mein pitaji ko koi ruchi nahi thi. Kolkata Urban Bank ka gathan karne ke baad swayam apne labh ke liye uske share rakhne se unhone inkaar kar diya. Unki ichchha to apne atirikt samay mein keval apne nagrik kartavya ka nirvah karne ki thi.

Pitaji ke pension lekar sevanivritt hone ke kai varshon baad Bengal-Nagpur Railway ke bahi-khaton ki jaanch karne ke liye England se ek accountant mahoday Bharat aaye. Vismit jaanch-adhikari ne dekha ki pitaji ne uchit samay par ada na kiye gaye kisi bonus ke liye kabhi koi aavedan nahi kiya tha.

Unhone company ko bataya: “Inhone akele teen aadmiyon ke barabar kaam kiya hai. Pichhli kshati-poorti swaroop inka 1 lakh 25 hazaar rupaya company se nikalta hai.” Company ke koshadhyaksh ne ukt rakam ka cheque pitaji ko bhej diya. Par mere pitaji ne is ghatna ko itna nagan ya mana ki ve parivar ko iski soochna dena bhi bhool gaye. Bahut baad mein mere sabse chhote bhai Vishnu ne bank dwara diye gaye vivaran mein itni badi dhanrashi jama dekhkar pitaji se iske bare mein poocha tha.

“Bhautik labh mein itna ullasit kyon hon?” Pitaji ne kaha. “Samabhav ko jisne apna lakshya bana liya ho vah na to kisi labh se ullasit hota hai na hi kisi haani se dukhi. Vah jaanta hai ki manushya is sansar mein khali haath aata hai aur khali haath hi jata hai.”

Apne vaivahik jeevan mein padarpan karne ke sheeghra baad hi mere mata-pita ek mahan guru, Banaras ke Lahiri Mahashay ke shishya ho gaye. Is sampark se pitaji ke pehle se hi virakt swabhav ko aur bal mila. Maa ne ek baar meri sabse badi behan Roma ko ek ullekhneey baat batayi: “Tumhare pitaji aur main santaan prapti ke liye varsh mein matra ek baar pati-patni ke roop mein saath sote hain.”

Pitaji Lahiri Mahashay se Avinash Babu ke madhyam se mile the. Avinash Babu Bengal-Nagpur Railway ke ek karmachari the. Gorakhpur mein mere bachpan mein Avinash Babu mujhe anek Bhartiya santon ki man ko talleen kar dene vali kahaniyan sunaya karte the. Ve sada apne guru ki shreshthatar mahima ke vishay mein shraddhapurvak kuch-na-kuch kahkar hi apni kahani samaapt karte the.

“Tumne kabhi suna hai, kin asaadharaan parishitiyon mein tumhare pitaji Lahiri Mahashay ke shishya bane the?” Garmiyon ke mausam mein ek alsaye din main aur Avinash Babu mere ghar ke ahate mein baithe the tab unhone meri utsukta jaganevala yeh prashn mujhse kiya. Maine aashabhari muskurahat ke saath na mein sir hilaya.

“Tumhare janm se kai varsh pehle maine apne varishth adhikari, arthat tumhare pitaji se apne guru ka darshan karne Banaras jaane ke liye ek saptah ki chutti dene ki yachna ki. Par tumhare pitaji ne meri ichchha ka upahas kiya.

“Unhone kaha: ‘Kya tum dharmik kattarvaadi banna chahte ho? Yadi jeevan mein aage badhna chahte ho to apne kaam par dhyan do.’

“Jhaadiyon mein se gujarti ek pagdandi se us din udaas man liye main ghar ja raha tha ki palki par sawar tumhare pitaji se meri mulakat ho gayi. Unhone palki aur naukarom ko vida kar diya aur mere saath chalane lage. Mujhe santvana dene ke liye ve sansarik safalta ke liye prayas karne ke labh mujhe samjhane lage. Par main unki baatein beman ho kar sun raha tha. Mera hridaya baar-baar yahi pukar raha tha: ‘Lahiri Mahashay! Main aapke darshan ke bina jee nahi sakta!’

“Hum log chalte-chalte ek sunsaan maidan ke kinare pahunch gaye, jahan sandhyakaleen soorya ki kirnein lahrati oonchi jangli ghaas par chamak rahi thin. Hum log us manohari drishya ko dekhne ke liye ruk gaye. Wahan us maidan mein, hum se kuch hi gaz ki doori par mere mahan guru akasmat prakat ho gaye.*

“Unka swar vaataavaran mein goonj utha: ‘Bhagavati! Tum apne karmachari ke prati atyant kathor ho.’ Iske saath hi ve jis rahasyamay dhang se prakat hue the, usi rahasyamay dhang se antardhan ho gaye. Main zameen par ghutne tekkar ‘Lahiri Mahashay! Lahiri Mahashay!’ pukar raha tha. Kuch kshanon ke liye tumhare pitaji stambhit ho gaye.

“‘Avinash! Main na keval tumhe chutti de raha hoon, balki Varanasi jaane ke liye main swayam bhi chutti le raha hoon. Tumhari sahayata karne ke liye jab chahe apni ichchha ke anusar prakat hone ki shakti rakhnevale in mahan Lahiri Mahashay ke darshan mujhe karne hi honge. Main apni patni ko bhi saath loonga aur in mahan guru se prarthana karunga ki ve hamein apne adhyatmik path mein deekshit karen. Kya tum hum dono ko unke paas le chaloge?’

* Siddh mahatmaon ki chamatkari shaktiyon ka spashtikaran 30 ven prakaran “Chamatkaron ka Niyam” mein diya gaya hai.

“‘Avashya!’ Apni prarthana ke is chamatkaarpoor n uttar ko paakar aur ghatnaon ke itne sheeghra anukool mod lene par mera man anand se gadgad ho utha tha.

“Agle din shaam ko tumhare mata-pita aur main railgadi se Varanasi ke liye chal pade. Agle din hum log wahan pahunche to kuch door tak ghoda-gadi se gaye, aur phir tang galiyon mein se chalte hue mere guru ke ghar pahunche. Unka ghar aasani se dikhayi nahi padta tha. Unki chhoti-si baithak mein pravesh karne par wahan hamesha ki tarah padmasan mein baithe hue Gurudev ko humne pranam kiya. Unhone apni hridaya-vedhi aankhein jhapkai aur unhe tumhare pitaji par sthir kar diya. ‘Bhagavati! Tum apne karmachari ke prati atyant kathor ho!’ Do din pehle ghaasbhare maidan mein kahe hue wahi shabd unhone phir se dohraye. Phir unhone aage kaha: ‘Mujhe khushi hai ki tumne Avinash ko aane ki anumati di aur saath mein tum bhi apni patni ko saath lekar yahan aa gaye.’

“Tumhare mata-pita ko atyant anand hua ki Gurudev ne unhe Kriya Yoga* ki deeksha di. Us pavitra darshan ke avismarniy din se hi tumhare pitaji aur main gurubhai ke rishte se ghanishth mitra rahe hain. Lahiri Mahashay ne tumhare janm mein vishesh ruchi dikhayi thi. Tumhara jeevan nishchay hi swayam unke jeevan ke saath juda rahega; Gurudev ka aashirvad kabhi nishphal nahi hota.”

Mere janm ke thode hi din baad Lahiri Mahashay ne is jagat se prasthan kar liya. Pitaji ka jahan-jahan bhi sthanantran hota tha, wahan-wahan Lahiri Mahashay ki ek sundar alankrit frame mein saji hui photo hamare pooja-ghar mein devataon ke chitron aur moortiyon ke saath virajman rahti thi. Lagbhag roz hi subah aur shaam ko maa aur main us pooja-vedi ke saamne dhyan lagakar baithte the aur chandan-sikt pushp arpan karte the. Dhoop aur guggul ke saath-saath apni sanyukt bhakti dwara hum us Ishwaratva ki pooja karte the, jo Lahiri Mahashay mein poornatah abhivyakt hua tha.

Unki us photo ka mere jeevan par zabardast prabhav pada. Jaise-jaise main bada hota gaya vaise-vaise mere man mein us mahan guru ka vichar adhik dridh hota gaya. Dhyan mein prayah main dekhta ki unki chhavi us chhote-se frame se bahar aa gayi hai aur jeevit roop dharan kar mere saamne baith gayi hai. Jab main unke jyotirmay shareer ke charanon ka sparsh karne ka prayas karta, tab ve badal kar punah chitra ban jate. Jab maine balyavastha se kishoravastha mein pravesh kiya to maine dekha ki frame mein jakdi Lahiri Mahashay ki chhoti-si chhavi mere man mein jeevit, gyan-pradayini upasthiti ban kar virajman ho chuki hai. Kisi uljhan ya pareeksha ki ghari mein main prayah unse prarthana karta aur apne antar mein unka santvanadayak margdarshan pata.

Pehle-pehle to mujhe dukh hota tha ki ve sharirik roop mein jeevit nahi the. Kintu jaise-jaise mujhe unki gupt sarvavyapakata ka pata chalta gaya, vaise-vaise mera dukh kam hota gaya. Apne un shishyon ko, jo unke darshan ke liye ati lalayit rahte the, ve prayah likha karte the: “Jab main sada tumhare kutastha (divya drishti) ki pahunch mein hoon to mere asthi-maans ko dekhne ke liye aane ki kya aavashyakta hai?”

Lagbhag 8 varsh ki aayu mein mujhe Lahiri Mahashay ki photo ke madhyam se chamatkari swasthyalaabh ka aashirvad prapt hua. Is anubhav ne mere prem ko aur bhi adhik utkat kar diya. Jab main Bengal ke Ichhapur mein apne parivarik ghar mein rah raha tha, tab mujhe haiza ho gaya. Mere bachne ki koi aasha nahi rahi. Doctor kuch bhi nahi kar pa rahe the. Mere bistar ke paas baithi maa ne bhaavvihvalata ke atirek ke saath mere sir ke upar tangi Lahiri Mahashay ki photo ki or dekhne ka mujhe ishara kiya.

“Unhe man hi man pranam karo!” Ve jaanti thin ki pranam karne ke liye haath uthane ki shakti mujh mein nahi bachi thi. “Yadi tum sachmuch apni bhakti prakat karoge aur apne antar mein unka charansparsh karoge, to tumhe jeevandaan mil jayega!”

Maine unki photo ki or dekha to wahan aankhein chaundhiyanewala prakhar prakash dikhayi pada jisne mere shareer aur poore kamre ko apne mein sama liya. Meri michlahat aur anya aniyantranneey lakshan samaapt ho gaye; main swasth ho gaya. Tatshan hi mujh mein itni shakti aa gayi ki apne guru mein apaar shraddha rakhnevali maa ka maine jhukkar charansparsh kiya. Maa baar-baar us chhoti-si photo par apna matha tek rahi thi.

“He sarvavyapi Gurudev! Main aapki kritagya hoon ki aapke alok ne mere putra ko achchha kar diya!”

Main samajh gaya ki unhone bhi us tejomay jyoti ka darshan kiya tha jiski mahima se main us sadharantaya pranghatak sabit honevali bimari se ekaak achchha ho gaya tha.

Mere paas jo kuch bhi anmol cheezein hain, unmein ek vah photo bhi hai. Swayam Lahiri Mahashay dwara pitaji ko di gayi yeh photo ek pavitra spandan se yukt hai. Is photo ke peeche bhi ek chamatkarik kahani hai. Maine yeh kahani pitaji ke gurubhai Kalikumar Ray se suni thi.

Aisa prateet hota hai ki Lahiri Mahashay ko apni photo khichvana achchha nahi lagta tha. Ek baar unke virodh ke bawajood unki aur unke kai shishyon ki, jinmein Kalikumar Ray bhi shaamil the, ek samuhik photo khinchi gayi. Par us samay photographer ke aashcharya ki seema na rahi jab usne dekha ki us photo mein sab shishyon ke chitra to ekdam spasht dikhayi de rahe the, parantu beech mein, jahan usne Lahiri Mahashay ka chitra hone ki sarthak aasha ki thi, koi aakriti nahi thi; vah sthan bilkul khali tha. Is vismaykari ghatna par khoob charcha hui.

Ek shishya Gangadhar Babu ne, jo ek kushal photographer the, deeng mari ki Lahiri Mahashay chahe jo kar lein, ve unki photo avashya khinch sakte hain. Agle din pratahkal jab Gurudev lakdi ki bench par padmasan mein baithe the aur unke peeche ek kapde ka parda bhi laga diya gaya tha, tab Gangadhar Babu apne saaj-saman ke saath wahan pahunch gaye. Safalta ke liye sari savdhaniyan baratte hue unhone utkanthapurvak barah photo khinchi. Kintu sheeghra hi unhe dikhayi pada ki har plate par lakdi ki bench aur parde ka chitra to spasht hai, par Gurudev ki aakriti ka punah kahin pata nahi.

Gangadhar Babu ka abhiman choor-choor ho gaya. Ashru bahate hue ve daude-daude Lahiri Mahashay ke paas pahunche. Kai ghanton ke baad Lahiri Mahashay ne is sargarbhit vakya ke saath apna maun toda: “Main Brahma hoon. Kya tumhara camera sarvavyapi agochaar ka chitra khinch sakta hai?”

Gangadhar Babu ne kaha: “Main dekh raha hoon ki nahi khinch sakta! Parantu he sarvagy Gurudev! Aapke dehamandir ki ek photo prapt karne ki bahut ichchha hai. Meri drishti sankuchit rahi hai. Aaj tak main yeh nahi samajh paya tha ki aapmein Brahma poorn roop se vaas karta hai.”

“Phir kal subah aao. Main tumhare camera ke saamne baithkar photo khinchwa loonga.”

Punah photographer ne apna camera focus kiya. Is baar agochaar rahasyamayata ke aavaran se rahit us pavitra mahapurush ki aakriti plate par spasht roop se ubhar aayi. Gurudev ne iske baad kabhi apni koi photo nahi khichwayi; kam se kam maine nahi dekhi.

Wahi photo is pustak mein chhapi hai.* Sanche mein dhali Lahiri Mahashay ki mukhakriti se kuch pata nahi chal pata ki ve kis kul-vansh ke the. Unki rahasyamay muskan mein Ishwar-sakshatkar ke anand ki kuch-kuch jhalak dikhayi deti hai. Bahya jagat mein naam-matra ki ruchi ka sanket deti unki adhonmeelit aankhein aantarik paramanand ka sanket karti hui aadhi band bhi hain. Is jagat ke kshudra pralobhanon se alipt ve adhyatmik sahayata ke liye apne paas aanevale jigyasuon ki adhyatmik samasyaon ke prati satat poorn jagrook rahte the.

* Photo vibhag mein prishth 9 dekhein. Photo vibhag mein hi Shri Shri Lahiri Mahashay ka haath se banaya gaya chitra prishth 10 par dekhein. 1935-36 mein jab Paramahansa Yogananda ji Bharat aaye the, tab unhone ek Bangali chitrakar se apne nirdeshanusar yeh chitra mool photo ke anusar banwaya aur baad mein ise Yogoda Satsanga Society of India / Self-Realization Fellowship ke prakashanon mein prayukt karne ke liye nirdharit kiya. Mount Washington mein vah chitra Paramahansa ji ke kamre mein deewar par tang kar rakha gaya hai. (Prakashak ki tippani)

Gurudev ke chitra ki mahima se swasthyalaabh karne ke thode din baad hi mujhe ek prabhavkari divya-darshan hua. Ek din pratah apne bichaune par baitha main ek gahan divaswapn mein doob gaya.

“Band aankhon ke andhkar ke peeche kya hai?” Yeh anusandhanatmak vichar bade veg se mere man mein ubhar aaya. Tatshan hi meri antardrishti ke saamne prakhar prakash kaundh gaya. Mere lalat mein visteern deeptiman pat par parvat-gufaon mein dhyanasth baithe santon ki aakritiyan chhote-chhote chalachitron ki bhaanti prakat hone lagi.

“Aap log kaun hain?” Maine uchch swar mein poocha.

“Hum Himalaya ke yogi hain.” Is divya uttar ka anand varnaneet tha; mera hridaya pulakit ho utha.

“Aah! Main bhi Himalaya mein aakar aapke jaisa banna chahta hoon!” Drishya antardhan ho gaya, parantu rajat kirnein mandalakar mein anant ki or vistarit hoti gayeen.

“Yeh adbhut alok kya hai?”

“Main Ishwar hoon. Main prakash hoon.” Yeh dhvani badalon ki saumya budbudahat jaisi thi.

“Main aapke saath ekaakar hona chahta hoon!”

Yadyapi vah Ishwariy anand kramashah ksheen hota gaya, par usse main Brahma ki sthai khoj ki virasat prapt karne mein safal hua. “Ishwar shashvat, nitya-naveen anand hai!” Yeh smriti mere hridaya-patal par is anubhav ke baad lambe samay tak bani rahi.

Bachpan ki ek anya smriti asaadharaan hai, aur ullekhneey bhi hai, kyunki uska chinh aaj bhi mere haath par hai. Ek din pratahsamay main aur meri badi behan Uma apne Gorakhpur ke ghar ke ahate mein neem ke ped ke neeche baithe the. Aas-paas ke toton ko neem ke pake phal khate main nihaar raha tha aur beech mein jo samay milta us mein Uma didi mujhe Bangali ki pehli pustak padhne mein madad kar rahi thin.

Uma didi ne apne pair par phoda hone ki baat batayi, aur vah us par lagane ke liye marham ki ek dibbiya le aayi. Maine us mein se thoda marham lekar apne haath par laga liya.

“Tum nirog haath par marham kyon laga rahe ho?”

“Baat aisi hai didi, mujhe lag raha hai ki kal mujhe yahan phoda hone vala hai.”

“Chal, jhootha kahan ka!”

“Didi, jab tak tum kal subah kya hota hai yeh dekh nahi leti, tab tak mujhe jhootha nahi keh sakti.” Mujhe krodh aa gaya.

Uma par uska koi asar nahi pada aur usne teen baar apne vyangya ko dohraya. Ek dridh nishchay meri awaaz mein dhvanit hone laga jab maine dheere-dheere kehna shuru kiya:

“Main apni ichchhashakti ke bal ke saath kehta hoon ki kal mere haath par isi jagah ek kaafi bada phoda nikal aayega; aur tumhara phoda sooj kar duguna ho jayega.”

Subah mere haath par ek bahut bada phoda nikal aaya aur Uma ka phoda aakar mein duguna ho gaya. Meri behan cheekhti hui maa ke paas bhagi. “Maa! Mukund jadu tona karna seekh gaya hai!” Maa ne gambheer hokar mujh se kaha ki haani karne ke liye main shabd-shakti ka prayog kabhi na karoon.

Maine maa ka vah upadesh sada hi yaad rakha hai aur uska palan kiya hai. Mere phode ka ilaj cheere se hua. Doctor ke cheere se bana chinh aaj bhi vartaman hai. Mere dahine haath par manushya ke shabd ki shakti ka nitya smaran dilata hua yeh chinh smarak ke roop mein vidyaman hai.

Gahri ekagrata ke saath Uma ko kahe gaye un sadharan evam prakatatah haanirahit prateet honevale shabdon mein bomb ke sadrish visfot kar nishchit parinaam utpann karne ki (yadyapi parinaam haanikar the) paryapt shakti nihit thi. Baad mein meri samajh mein aaya ki kisi ke jeevan ko sankat se bachane ke liye vani ki visfotak spandan-shakti ka sadupyog kiya ja sakta hai aur is prakar bina chinh ya kasht rahit shalya-chikitsa ki ja sakti hai.*

Hamara parivar Punjab ke Lahore† shahar mein sthanantran hua. Wahan maine Devi Kali ke roop mein Jagannata ka ek chitra prapt kiya.‡ Hamare ghar ki balcony mein is chitra ka anaupcharik mandir bana. Mere man mein anayas hi yeh nishchit vishvas paida ho gaya ki us pavitra sthan par ki gayi meri kisi bhi prarthana ko poorti ka taaj pehna diya jayega. Ek din wahan Uma ke saath khada hokar main do ladkon ko do gharon ki chhaton par patang udate dekh raha tha. In dono gharon aur hamare ghar ke beech ek bahut hi sankri gali thi.

“Tum aaj itne chup kyon ho?” Uma ne khel-khel mein mujhe dhakka dekar poocha.

“Main yeh soch raha hoon ki kitni adbhut baat hai ki main jo bhi mangta hoon, Jagannata mujhe de deti hain.”

“Main samajhti hoon vah tumhe ve dono patangen bhi de dengi!” Meri behan upahas ki hansi hanste hue boli.

“Kyon nahi?” Maine un patangon ko pane ke liye maun prarthana shuru kar di.

Bharat mein dhagon par manja (gond aur sheeshe ka choorn) lagakar patangon ka khel khela jata hai. Pratyek patang udanevala apne pratidwandwi ki patang kaatne ka prayas karta hai. Kati hui patang chhaton ke upar se jati hai, tab use pakadne mein bada maza aata hai. Uma aur main aisi balcony mein khade the jiske upar chhat thi aur dono or deewarein bhi thin, isliye kisi kati patang ka hamare haath aana asambhav prateet hota tha, kyunki swabhavik taur par uska dhaga chhat ke upar hi latakta hua aage nikal jata.

Gali ke us paar patang udanevalon ne apna khel shuru kiya. Ek dhaga kat gaya; tatshan hi patang meri disha mein lapki. Achanak hawa band ho jaane ke karan vah patang ek kshan ke liye sthir ho gayi aur isi beech uska dhaga saamne vale ghar ke upar uge nagphani ke ek ped mein ulajh gaya. Mere pakadne ke liye ek poora fanda ban gaya. Maine yeh puraskar Uma ko saump diya.

“Yeh to keval ek asaadharaan sanyog tha, na ki tumhari prarthana ka uttar. Yadi vah doosri patang bhi tumhare paas aa jaye, to main manungi.”

Didi ki kali aankhon se unke shabdon ki apeksha kahin adhik vismay prakat ho raha tha. Maine teevrta se apni prarthanaein jaari rakhin. Us doosre patang udanevale ke jor se jhatka marne ke karan uska dhaga bhi toot gaya. Hawa mein nachti hui patang meri or aane lagi. Mere sahayak nagphani ke ped ne phir se dhage ko ulajhakar aavashyak fanda bana diya taaki main use pakad sakoon. Maine apna yeh doosra puraskar bhi Uma ko bhent kar diya.

“Sachmuch Jagannata tumhari prarthana sunti hain! Yeh sab mere liye vilakshan hai.” Didi bhaybheet mrigashavak ki bhaanti bhag gayi.

Meri maa ki sabse badi ichchha mere bade bhai ke vivaah ki thi. “Aha! Jab main Anant ki patni ka mukh dekhungi tab mujhe is dharti par hi swarg mil jayega!” In shabdon mein maa ko apne vansh ko aage chalane ki prabal Bhartiya bhavna vyakt karte main prayah sunta tha.

Anant ki sagai ke samay main lagbhag gyarah varsh ka tha. Maa Kolkata mein atyant ullas se vivaah ki taiyariyon mein juti hui thin. Keval pitaji aur main hi uttari Bharat mein sthit Bareilly mein apne ghar mein rah gaye the, jahan Lahore mein do varsh rahne ke baad pitaji ka sthanantran ho gaya tha.

Iske poorv main apni do badi behnon Rama aur Uma ke vivaahon ka thathbaat dekh chuka tha, kintu ghar mein sabse bada putra hone ke naate Anant ke vivaah ki taiyariyan to aur bhi bade star par ho rahi thin. Maa pratidin door-door se Kolkata pahuchte sage-sambandhiyon ki aavbhagat karne mein vyast thin. Maa ne 50, Amherst Street mein liye gaye ek naye vishal ghar mein un sabke aaram-purvak theharne ki vyavastha ki thi. Saari taiyariyan poori ho chuki thin — vivaah-bhoj ke liye nana-vidh vyanjan, baarat ke saath Anant ko le jaane ke liye palki, rang-birangi battiyon ki kataarein, gale ke vishalkay haathi aur oont, Angrezi, Scottish aur Hindustani band-baje, peshewar gayak tatha nartak, vivaah-vidhi sampann karane ke liye pandit-purohit — sab kuch taiyar tha.

Mangalotsav ke utsah se bhare hue pitaji aur main samay par vivaah ke liye pahunchne ka vichar kar rahe the. Parantu us shubh din se thode hi pehle maine ek amangalsuchak drishya dhyan mein dekha.

Yeh Bareilly mein ardharatri ke samay tha. Main pitaji ke saath apne bangale ke baramde mein soya hua tha. Palang par lagi machchhardani ki vichitra phadphadahat-ki-si dhvani se meri neend khul gayi. Patli machchhardani ke parde khul gaye aur mujhe apni priya maa dikhayi padi.

“Apne pitaji ko jagao!” Maa ki awaaz keval ek fusfusahat ki tarah lagi. “Aaj hi bhor ko char baje yahan se chalnewali pehli gadi pakdo. Yadi mujhe dekhna chahte ho to jaldi karo!” Iske baad vah chhayamurti adrishya ho gayi.

“Pitaji, pitaji! Maa praan tyag rahi hain!” Mere aart swar mein vyapt bhayakulta ne unhe tatshan jaga diya. Subakte hue maine unhe saari ghatna suna di. Apne swabhav ke anusar is sthiti ko asweekar karte hue unhone mujhse kaha: “Chinta ki koi baat nahi. Yeh tumhare man ka bhram matra hai. Tumhari maa bilkul theek hai. Yadi koi dukhad samachar mil hi gaya to hum log kal chal padenge.”

“Yadi aap abhi turant nahi chale to apne aap ko aap kabhi kshama nahi kar payenge!”

Teevr vyatha ke karan mere munh se ye shabd bhi nikal pade: “Aur na hi main aapko kabhi kshama karunga!”

Vishadpoorn pratahkaal spasht sandesh lekar aaya: “Maa gambheer roop se aswasth; vivaah sthagit; turant aaiye.”

Pitaji aur main hatbuddhi hokar nikal pade. Raaste mein jahan gadi badalni padti thi, wahan mere ek chacha hum logon se mile. Aakar mein badi-badi hoti jati ek railgadi vajra-garjan ke saath hamari or aa rahi thi. Aantarik shuddhata ke karan apne aap ko gadi ke aage jhonk dene ka nishchay achanak mere man mein utha. Mujhe laga ki maa ki chhatrachhaya se vanchit ho jaane ke baad ab achanak poornatah ujad gaye is sansar ko sahne ki kshamata mujh mein nahi hai. Main maa se is sansar mein sabse priya mitra ke roop mein pyaar karta tha. Unke santvanadayak kaale nayan bachpan ki chhoti-chhoti vyatha-vednaon ke samay mera ekmatra aashray the.

“Kya maa abhi tak jeevit hain?” Chacha se ek antim prashn karne ke liye main ruk gaya.

Chacha ko mere chehre par chhayi adheerata ko bhaanp lene mein tanik bhi der nahi lagi. “Nihsanshay ve jeevit hain!” Par mujhe un par thoda bhi vishvas nahi hua.

Hum Kolkata mein ghar pahunche to hamein mrityu ke achetan karne vale rahasya ka samna karna pada. Main mritpraya-sa hokar gir pada. Kisi prakar ki santvana ko mere hridaya ka sparsh bhi kar pane ke liye kai varsh lag gaye. Meri aart pukaron ne sakshat swarg ke dwarom ko hila diya. Akhir Jagajjanani ko aana hi pada. Unke snehsnigdha shabdon ne mere riste ghawon ko bhar diya:

“Vah main hi thi jisne janm-janmantar mein anek mataon ki snehvatsalata ke madhyam se tumhari dekhbhaal ki. Khoye hue jin do sundar kaale nayanon ko tum dhoondh rahe ho, unhe meri aankhon mein dekho!”

Parampriya maa ke shraddh-karm ke baad sheeghra hi pitaji aur main Bareilly laut aaye. Ateet ki smriti mein pratidin bhor mein hi main apne bangale ke saamne sthit naram, harit-swarnim hariyali ko chhaya dete khade Parijat vriksh ki dukhart hokar teerthayatra karta. Kabhi-kabhi kavyamay kshanon mein main sochta tha ki Parijat ke shwet pushp apni antarjat bhakti se harit trin-vedi par apne aap ko bikher rahe hain. Oosbinduon ke saath apne ashrubinduon ko milate hue main prayah usha se lokottar, alaukik prakash nikalta dekha karta. Ishwar ko pane ki teevr kasak se main tadap uthta. Himalaya mein chale jaane ki prabal ichchha mujh mein jag uthi.

Mere ek chachere bhai Himalaya ki pavan parvat shreniyon ki yatra kar hamare yahan Bareilly aaye. Yogiyon aur swamion* ke us uchch parvat-nivas sthan ki kahaniyan maine unse utsukata-purvak suni.

* Swami shabd ke Sanskrit mool ka arth hai, “vah jo apne sw ke saath ya aatma ke saath ek ho gaya hai.” (Prakaran 24 dekhein)

“Chalo, Himalaya bhaag chalein.” Yeh prastav ek din maine Bareilly mein apne makaan-malik ke putra Dwarka Prasad ke samaksh rakha, parantu vah aise vicharon se sahmat nahi tha. Usne mere is vichar se mere bade bhai ko avgat kara diya jo usi samay pitaji se milne ke liye wahan aaye the. Ek chhote bachche ki is avyavaharik yojana ko hanskar taal dene ke badle Anant ne mera upahas karne ka nishchay kar liya.

“Tumhare gerue kapde kahan hain? Unke bina to tum swami nahi ban sakte!”

Parantu unke in shabdon se main abodhgamy roop se pulakit ho utha. Un shabdon ne ek spasht chitra meri drishti ke saamne khada kar diya, ki main sannyasi ban kar Bharat-bhraman kar raha hoon. Shayad un shabdon ne kisi poorvajanm ki smritiyon ko jaga diya tha. Chahe jo baat ho, par mujhe yeh to pata chal gaya ki prachin sannyas parampara ka gerua vastra main atyant swabhavik sahajata ke saath dharan kar sakunga.

Ek din Dwarka ke saath baatchit karte hue maine anubhav kiya ki himskhalan ke saman prachand veg se Ishwar-prem ki dhara mujh mein utar rahi hai. Iske phalaswaroop shabdon ka jo dhara-pravah mujh se bahne laga uski or Dwarka ka to vishesh dhyan nahi tha, par main poore man se apne aap ko sun raha tha.

Usi din dopahar ko main Himalaya ki talhati mein sthit pahadiyon mein base Nainital ki or bhaag gaya. Anant ne bhi dridh sankalp ke saath mera peecha kiya aur vibash hokar mujhe dukhi antahkaran ke saath Bareilly vapas aana pada. Mujhe keval ek hi teerthayatra karne ki anumati thi aur vah thi pratidin pratah ki Parijat vriksh ki teerthayatra. Mera hridaya apni khoyi hui dono mataon ke liye mook rudan karta raha — ek manavi mata, doosri Jagannata.

Maa ke swargvas se parivar mein jo riktata utpann ho gayi vah kabhi bhari nahi ja sakti thi. Apne jeevan ke lagbhag chalees shesh varshon mein pitaji ne doosra vivaah nahi kiya. Apne balvrind ke mata-pita ki kathin bhoomika unhone swayam hi sweekar kar li aur iske nirvah mein ve hamare saath adhik komal-hriday, adhik milansar ban gaye. Shanti aur soojh-boojh ke saath hi ve vividh parivarik samasyaon ko hal karte. Karyalay se aane ke pashchaat ve kisi virakt ki bhaanti apne kaksh mein chale jate aur anandpoorn prashanti mein Kriya Yoga ka abhyas karte. Maa ke swargvas ke bahut samay baad maine aisi chhoti-chhoti baaton ka dhyan rakhne ke liye ek Angrez paricharika ko rakhne ka prayas kiya taaki pitaji ko kuch aaram mil sake. Parantu pitaji ne sir hila-hila kar apni asahmati prakat ki.

“Tumhari maa ke saath hi meri seva ka ant ho gaya.” Aajeevan ekpatni-parayanata ke bhaav mein unki aankhein kho gayeen. “Main kisi bhi anya stri ki seva grahan nahi karunga.”

Maa ke guzar jaane ke 14 mahine baad mujhe gyaat hua ki vah mere liye ek mahatvapoor n sandesh chhod gayi hain. Unke antim samay Anant da unke paas upasthit the aur unhone unke shabdon ko likh liya tha. Yadyapi maa ne vah sandesh mujhe ek varsh mein diye jaane ka nirdesh diya tha tathapi mere bhai ne usmein vilamb kar diya tha. Unhe sheeghra hi maa dwara unke liye pasand ki hui kanya se vivaah karne ke liye Bareilly se Kolkata prasthan karna tha. Ek din sandhya ko unhone mujhe apne paas bulaya.

“Mukund! Tumhe yeh vilakshan samachar dene mein main anakani karta raha.” Unke swar mein vibashatapoor n samarpan tha.

“Mujhe bhay tha ki isse tumhari grihatyag ki ichchha aur bhadak uthegi. Parantu tum vaise bhi abhi prabal Ishwar-prem se ot-prot ho. Abhi haal hi mein jab main tumhe Himalaya jate hue raaste se pakad laya, tabhi maine ek nishchit sankalp kar liya. Mujhe kisi bhi parishiti mein ab apna pavitra vachan nibhane mein der nahi karni chahiye.” Mere bhai ne mujhe ek chhoti-si dibbiya di aur maa ka sandesh mujhe sunaya.

Maa ne kaha tha: “Mere priya putra Mukund! Mere ye shabd tumhare liye mera antim aashirvad hain. Ab vah samay aa gaya hai jab mujhe tumhare janm ke pashchaat ghatit alaukik ghatnaon se tumhe avgat kara dena chahiye. Jab tum meri god mein ek nanhe-se shishu matra the, tabhi mujhe tumhare nihit marg ka pata chal gaya tha. Main tab tumhe Varanasi mein apne guru ke ghar le gayi thi. Wahan shishyon ki bheed ki ot mein lagbhag chhipe hue, main dhyanasth Lahiri Mahashay ko kathinta se dekh pa rahi thi.

“Tumhe dhapkiyan dete-dete main man hi man prarthana karti ja rahi thi ki Gurudev ko wahan hamari upasthiti ka gyaan ho jay aur ve tumhe aashirvad dein. Jab meri mook bhaktipoor n prarthana teevr ho gayi tab unhone aankhein kholin aur mujhe paas aane ka ishara kiya. Sabhi logon ne mujhe raasta diya; maine jakar un param-pavitra charankamaloin mein apna sir rakha. Lahiri Mahashay ne tumhe apni god mein le liya aur adhyatmik deeksha ke roop mein tumhare lalat par apna haath rakha.

“‘Chhoti maa! Tumhara putra ek yogi hoga. Ek adhyatmik engine bankar vah anek aatmaon ko Ishwar ke samrajya mein le jayega.’

“Sarvagy Gurudev ne meri gupt prarthana sweekar kar li. Yeh dekhkar mera hridaya anand se naach utha. Tumhare janm ke kuch pehle unhone mujhe bataya tha ki tum unke hi marg par chaloge.

“Mere putra! Baad mein tumhe jab adbhut alok ke darshan ka pata bhi mujhe aur tumhari badi behan Rama ko chal gaya tha, kyunki hum dono us waqt saath ke kamre se tumhe apni shayya par nishchal baitha dekh rahi thin. Tumhare chhote-se mukhmandal par tej prakat hua tha; jab tum Bhagavan ko khojne ke liye Himalaya mein jaane ki baat kar rahe the tab tumhari awaaz mein atyant dridh nishchay dhvanit ho raha tha.

“In sab madhyamon se, mere putra! Main samajh gayi thi ki tumhara marg sansarik mahatvakankshaon se door hai. Mere jeevan ki ek adwitiya ghatna ne to is par nishchayata ki muhar laga di. Wahi ghatna aaj mujhe mrityushayya se yeh sandesh tumhe dene ke liye vibash kar rahi hai.

“Yeh ghatna hai Punjab mein ek sadhu ke darshan ki. Jab hamara parivar Lahore mein rahta tha, tab ek din pratahkaal naukar mere kamre mein aaya, ‘Malkin! Ek ajeeb sadhu dwar par aaya hai; kehta hai ki use “Mukund ki maa se hi milna hai.”’

“In seedhe-saral shabdon se mere bheetar koi taar jhankrit ho utha. Main turant sadhu se milne bahar gayi. Unke charanon mein pranam karte samay main samajh gayi ki mere saamne koi sachcha siddh-purush khada hai.

“Unhone kaha: ‘Mata! Mahan gurujan tumhe yeh bata dena chahte hain ki is prithvi par tumhara vaas ab adhik din nahi rahega. Tumhari agali bimari tumhare liye antim siddh hogi.’* Iske pashchaat thodi der ve maun rahe. Us maun ke dauran maine koi bhay ya sankat nahi, balki mahan shanti anubhav ki. Antatah vah phir kehne lage:

“‘Tumhe apne paas amanat ke roop mein rakhne ke liye chandi ka ek taaviz diya jayega. Vah aaj main tumhe nahi doonga. Mere kathan ko satya pramanit karne ke liye kal jab tum dhyan kar rahi hogi tab vah tumhare haathon mein moort roop dharan kar lega. Jab tumhari mrityu ki ghari nikat aayegi tab tumhe vah taaviz apne bade bete Anant ko dekar use batana hoga ki ek varsh tak vah us taaviz ko apne paas rakhe aur tatpashchaat use tumhare dwiteey putra ko de. Mahapurushon se prapt us taaviz ke marm ko Mukund samajh lega. Use vah taaviz tab milna chahiye jab vah saari sansarik aasha-akankshaon ka parityagkar pranpan se Ishwar ki khoj karne ke liye prastut ho raha ho. Jab vah taaviz kuch varshon tak uske paas rah chuka hoga aur jab uska uddeshya poora ho chuka hoga, tab vah apne aap adrishya ho jayega. Gupt se ati gupt sthan mein bhi vah rakha ho, tab bhi vah jahan se aaya tha wahin vapas chala jayega.’

* Jab is sandesh ke madhyam se mujhe pata chala ki maa apne alpayu hone ki baat ko jaanti thin, tab pehli baar meri samajh mein aaya ki kyon vah Anant ka vivaah sheeghratisheeghra karwana chahti thin. Yadyapi vivaah ke poorv hi uska dehavasan ho gaya, tathapi vivaahotsav dekhne ki unke man mein swabhavik matrisulabh aakanksha thi.

“Maine us sadhu ko bhiksha arpan kar param bhaktibhaav se naman kiya. Bhiksha grahan na kar, mujhe aashirvad dekar vah chale gaye. Agle din sandhya ko jab main haath jodkar dhyan mein baithi thi, tab chandi ka ek taaviz meri hatheliyon ke beech mein prakat ho gaya, jaisa sadhu ne kaha tha. Uske sheetal, chikne sparsh se mujhe uske prakat hone ka gyaan ho gaya. Maine do varshon se adhik samay tak ise savdhani-purvak sambhalkar rakha aur ab ise Anant ke paas chhode ja rahi hoon. Mere liye koi shok mat karna kyunki mujhe mere Gurudev Ishwar ki god mein pahuncha denge. Achchha, mere bachche! Ab main chalti hoon. Jagannata teri raksha karengi.”

Taaviz mere haath mein aate hi gyaan ka ujjwal prakash mujh par chha gaya; anek sushupta smritiyan jagrit ho utheen. Taaviz gol, deekhne mein kuch vichitra-sa aur prachin lagta tha. Us par Sanskrit ke akshar khude hue the. Main samajh gaya ki is janm ke jeevanpath par bhi adrishya roop se mera margdarshan karnevale mere poorvajanmon ke guruon ne ise bheja tha. Iska ek aur adhik gahan abhipray bhi tha; parantu taaviz ke bheetari rahasya ka bhed khol dena uchit nahi hoga.*

* Taaviz alaukik reeti se utpann hui ek vastu thi jiski rachna is prakar adrishya tattvon se hui ho us ka is jagat se kabhi-na-kabhi adrishya ho jana anivary hai. (Prakaran 43 dekhein)

Taaviz par ek mantra, arthat kai pavitra shabd khude hue the. Dhvani evam vaak arthat manav vani ki antarnihit shaktiyon par jitni gehraayi se Bharat mein anusandhan kiya gaya utna aur kahin bhi nahi kiya gaya. Saare brahmand mein jhankrit Om spandan (Bible ka “Shabd” athava “anek samudron ka garjan”) mein teen gun hain: srishti, sthiti, lay (Taittiriya Upanishad 1:8). Pratyek baar jab manav kisi bhi shabd ka uchcharan karta hai tab vah in teen mein se kisi ek gun ko karyanvit kar deta hai. Sabhi dharmashastron ke is aadesh ke peeche, ki manushya ko sada satyavachan hi kehne chahiye, yahi niyam-sangat karan hai.

Taaviz par khude mantra mein, yadi uska sahi uchcharan kiya jaye, to adhyatmik drishti se labhprad spandan-shakti thi. Aadarsh roop se gathit Sanskrit varnamala mein pachaas varn hain aur pratyek varn ka ek sunirdish t, aparivartaneey uchcharan hai. Sab dhvaniyon ka boj uthane ka asafal prayas karte chhabbees aksharon ki, Latin mool se bani English varnamala ki dhvani-prateek vishayak aparyapta par George Bernard Shaw ne ek suvicharit aur has-parihas se bharpoor nibandh likha tha. Apni chir-parichit nirmamata (“English bhasha ke liye ek English varnamala banane ki khatir yadi grahayuddh bhi ho jay ... to bhi mujhe usse dukh nahi hoga.”) ke saath Shaw bayalees varnon wali varnamala apnane ka aagrah karte hain (New York ki Philosophical Library ki or se prakashit Wilson ki ‘The Miraculous Birth of Language’ drishtavya). Is prakar ki varnamala swar-sampoor n Sanskrit varnamala ke nikat pahunch jayegi, jiske pachaas varnon mein galat uchcharan ki koi sambhavna nahi hai.

Sindhu Ghati mein prapt muharon ne anek vidwanon ko vartaman mein prachalit is dharana ka parityag karne ke liye vibash kiya hai ki Bharatvarsh ne apni Sanskrit varnamala Semitic srotom (dakshin-pashchim Asia ki prachin sanskritiyan) ke aadhar par banayi. Haal hi mein Mohenjo-daro aur Harappa mein kuch mahan Hindu shaharon ka utkhanan kiya gaya hai jinka “avashya hi Bharat-bhoomi par itna prachin itihas raha hoga ki vah hamein aise yug mein le ja sake jiski keval dhundhli-si kalpana hi ki ja sakti hai” (Sir John Marshall, Mohenjo-daro and the Indus Civilization, 1931).

Is prithvi par susanskrit 5 varn ka atiprachin astitva ka Hindu siddhant yadi satya hai to sansar ki sabse prachin bhasha Sanskrit sabse adhik paripoorn kyon hai yeh spasht karna bhi sambhav ho jata hai (Prakaran 10 drishtavya). Asiatic Society ke sansthapak Sir William Jones kehte hain: “Sanskrit bhasha chahe jitni prachin ho, par uska gathan atyant adbhut hai. Vah Yunani bhasha ki apeksha adhik paripoorn, Latin bhasha ki apeksha adhik shabd-bahul, aur in dono bhashaon ki apeksha adhik parimarjit aur parishkrit hai.”

Encyclopaedia Americana mein likha hai: “Jab se prachin gyaan-sampada ke punarudhaar ka karya shuru hua hai, tab se lekar aaj tak sanskriti ke itihas mein 18veen shatabdi ke uttarardh mein ki gayi Sanskrit bhasha ki (pashchatya vidwanon dwara) khoj jitni mahatvapoor n anya koi ghatna nahi hui. Bhasha-vigyan, tulnatmak vyakaran, tulnatmak puran sahitya, dharmvigyan .... ya to Sanskrit ki khoj ke karan hi astitva mein aaye ya uske adhyayan se atyant prabhavit hain.”

Mere jeevan ki atyant dukhad ghatnaon ke beech vah taaviz antatah kis prakar adrishya ho gaya aur uska adrishya hona kis prakar mere liye gurulabh ka soochak siddh hua, is ka varnan is prakaran mein karne ki aavashyakta nahi.

Kintu Himalaya mein jaane ki apni cheshtaon mein baar-baar asafal kiya gaya yeh balak taaviz ke pankhon par sawar hokar pratidin door-door tak yatra kar leta tha.

“Pitaji! Yadi main bina kisi dabav ke ghar lautne ka vachan doon, to kya darshan yatra ke liye Banaras ja sakta hoon?”

Mere yatra-prem mein pitaji shayad hi kabhi badha bante the. Meri kishoravastha mein bhi anek shaharon aur teerthsthalon ki yatra karne ki anumati ve mujhe de dete the. Sadharantaya mere saath mere ek ya adhik mitra hote. Pitaji dwara pradat pratham shreni ke passen par hum log aaram-purvak yatra karte. Hamare parivar ke khanabadosh logon ke liye pitaji ka railway adhikari ka pad poornatah santoshprad tha.

Pitaji ne mere anurodh par yathochit vichar karne ka vachan diya. Doosre din mujhe apne paas bulakar unhone Bareilly se Banaras jaane-aane ka ek pass, ek rupaye ke kuch note aur do patra dete hue kaha:

“Mujhe Banaras ke apne mitra Kedarnath Babu ko ek karya ke vishay mein kuch prastav bhejna hai. Durbhagyavash unke pate ka kagaz maine kahin kho diya hai. Parantu mujhe vishvas hai ki hum dono ke mitra Swami Pranavananda ki sahayata se tum yeh patra un tak pahuncha sakoge. Swamiji mere gurubhai hain, unhone ati unnat adhyatmik avastha prapt kar li hai. Unke sang se tumhe bhi labh hoga. Yeh doosra patra unhe tumhara parichay dega.”

Saath mein yeh kehte hue pitaji ki aankhein chamak utheen: “Yaad rakho, ab phir kabhi ghar se nahi bhagna, samjhe!”

Apni barah varsh ki aayu ke utsah ke saath main nikal pada (yadyapi samay ne naveen drishyon aur aparichit vyaktiyon se mujhe milne vale anand mein abhi bhi koi kami nahi aane di hai). Banaras pahuchte hi main seedhe Swamiji ke nivas sthan ki or chal pada. Saamne ka dwar khula tha, main doosri manzil par sthit ek lambe hall-numa kamre mein ja pahuncha. Farsh se kuch oonchi uthi hui ek chowki par sthoolkay ek vyakti keval ek adhovastra dharan kiye hue padmasan mein baithe the. Unke hoton par shant, sundar muskan khel rahi thi. Mere avanchhit pravesh ke sankoch ko door karne ke liye kisi chir-parichit mitra ki bhaanti unhone mera swagat kiya.

“Baba Anand.” Balsulabh awaaz mein unhone in shabdon ke saath mera hardik swagat kiya. Maine ghutne tek kar unka charansparsh kiya.

“Kya aap hi Swami Pranavanandaji hain?”

Unhone sweekararth sir hilaya. “Tum Bhagavati ke bete ho?” Isse pehle ki mujhe apni jeb se pitaji ka patra nikalne ka avsar bhi mil pata, unke shabd nikal chuke the. Aashcharyachakit hokar maine pitaji ka unke liye diya hua apna parichay patra nikal kar unke haath mein diya, jo ab nirarthak jaan padta tha.

“Tumhare liye Kedarnath Babu ko main avashya dhoondh nikalunga.” Sant ne punah ek baar apni ateendriya drishti se mujhe vismit kar diya. Tatpashchaat unhone patra par ek drishti daali aur mere pitaji ke sambandh mein kuch sneh bhare udgar vyakt kiye.

“Dekho, mujhe do pensionen milti hain. Ek tumhare pitaji ki sifarish se, jinke adheen main railway karyalay mein kaam karta tha. Doosri mere Param-pita ke anugrah se jinke liye maine apne jeevan ke sansarik kartavyon ko antahprerna ke anusar apna sarvottam prayas karke poorn kar diya hai.”

Mujhe yeh kathan atyant goodh laga. “Param-pita se aapko kaisi pension milti hai, Swamiji? Ve kya dhan aapki god mein daal dete hain?”

Swamiji hans pade. “Pension se mera abhipray hai agadh shanti — anek varshon ke gahan dhyan ka puraskar. Mujhe ab dhan ki kabhi koi ichchha nahi hoti. Meri atyalp bhautik aavashyaktayon ki poorti ho jati hai. Is doosri pension ka tatparya tum baad mein samajh jaoge.”

Achanak vartaalap band kar Swamiji gambheer aur nishchal ho gaye. Kisi rahasyamay bhaav ne unhe aavrit kar liya. Prarambh mein to unki aankhein chamak utheen jaise kisi aakarshak vastu ko dekh rahi hon, baad mein nishprabh ho gayeen. Main unke is achanak maun se udvign ho gaya; unhone abhi tak mujhe yeh nahi bataya tha ki main apne pitaji ke mitra se kaise mil sakunga. Tanik bechain hokar maine us khali kamre mein drishti daudayi jismein hum dono ke atirikt aur kuch bhi nahi tha. Jis chowki par ve baithe the, us ke neeche rakhi unki kaath ki khadaun par meri drishti padi.

“Chhote Mahashay! Chinta mat karo. Jin se tum milna chahte ho ve aadhe ghante mein yahan pahunch jayenge.” Yogivar mere man ko padh rahe the — us samay yeh koi badi baat bhi nahi lag rahi thi!

Unhone punah gahan maun dharan kar liya. Jab meri ghadi se mujhe pata chala ki tees minat beet chuke hain tab Swamiji swayam hi uth gaye.

“Lagta hai Kedarnath Babu darwaze ke nikat pahunch gaye hain,” unhone kaha. Maine seedhiyon se kisi ke upar aane ki aahat suni. Vismit abodhyata mein main achanak doob gaya; asamanjas mein mere vichar daudne lage: “Bina kisi sandeshvahak ka upyog kiye pitaji ke mitra ko yahan bulana kaise sambhav ho sakta hai? Mere yahan aane ke baad Swamiji ne to mere atirikt kisi se bhi baat nahi ki hai!”

Main chupchap uthkar kamre se bahar aa gaya aur seedhiyan utarne laga. Aadhe raaste mein hi madhyam kad ke ek duble-patle, gauravarn vyakti se meri bhet hui. Ve kisi jaldi mein lag rahe the.

“Kya aap Kedarnath Babu hain?” Meri awaaz mein uttejana spasht thi.

“Haan. Aur tum Bhagavati ke bete ho na, jo mujhse milne ke liye yahan prateeksha kar rahe ho?” Ve mitrata-poorn dhang se muskaraye.

“Mahashay! Par aap yahan kaise aaye?” Unki abodhya upasthiti se mujhe vismaykari rosh ka anubhav hua.

“Aaj sab kuch rahasyamay lag raha hai! Ek ghante se bhi kam samay pehle maine Gangasnan samaapt kiya hi tha ki Swami Pranavanandaji mere paas pahunch gaye. Main soch bhi nahi sakta ki unhe kaise pata chala ki main us samay wahan tha.

“‘Bhagavati ka beta mere ghar mein tumhari prateeksha kar raha hai,’ unhone kaha. ‘Kya tum mere saath chaloge?’ Main khushi se taiyar hua. Hum log haath mein haath daalkar chalane lage, kintu khadaun pehne ke bawajood bhi Swamiji aashcharyajanak dhang se mujhe peeche chhodkar aage nikal gaye, halanki main ye majboot joote pehne hue tha.

“Phir Pranavanandaji ne akasmat rukkar mujh se poocha: ‘Mere ghar pahunchne mein tumhe kitna samay lagega?’

“‘Lagbhag aadha ghanta.’

“‘Mujhe abhi kuch aur kaam hai.’ Unhone ek rahasyamay drishti mujh par daali. ‘Ab mujhe tumhe peeche chhodkar jana hoga. Tum seedhe mere ghar pahunch jao jahan main aur Bhagavati ka beta tumhari prateeksha kar rahe honge.’

“Main unse kuch keh sakoon isse pehle hi ve tezi se mere paas se nikal gaye aur bheed mein adrishya ho gaye. Main jitna tez chal sakta tha utna tez chalkar yahan pahuncha hoon.”

Kedarnath Babu ke is kathan se main aur bhi hatbuddhi ho gaya. Maine unse poocha ki ve Swamiji ko kab se jaante the.

“Pichhle varsh to hamari kuch mulakaten hui thin, par haal mein kabhi bhet nahi hui. Aaj punah snan-ghat par unse milkar mujhe bahut khushi hui.”

“Mujhe apne kaanon par vishvas nahi ho raha hai. Mera dimaag to nahi phir raha hai? Kya aap unse manah-drishti mein mile the, ya vastav mein dekha tha, unke haath ka sparsh kiya tha aur unki padchap suni thi?”

“Tum kehna kya chahte ho?” Gusse se unka chehra tamtama gaya. “Main tum se jhooth nahi bol raha hoon. Kya tum yeh nahi samajh pa rahe ho ki keval Swamiji ke dwara hi to mujhe pata chal sakta tha ki tum yahan meri prateeksha kar rahe ho?”

“Par yeh dekhiye, main ek ghanta pehle yahan aaya aur tab se ab tak Swami Pranavanandaji ek kshan ke liye bhi meri drishti se ojhal nahi hue.” Maine saari kahani unhe suna di aur Swamiji aur mere beech ka vartaalap bhi unke saamne duhra diya.

Unki aankhein phail gayeen. “Hum log is bhautik yug mein jee rahe hain ya swapn dekh rahe hain? Maine apne jeevan mein kabhi bhi is prakar ka chamatkar dekh pane ki aasha nahi ki thi! Main to samajhta tha yeh Swamiji keval ek sadharan manushya hain, aur ab dekhta hoon ki ye ek aur shareer bhi dharan kar sakte hain, uske dwara kaam bhi kar sakte hain!” Hum dono ne saath-saath hi Swamiji ke kamre mein pravesh kiya. Kedarnath Babu ne chowki ke neeche padi khadaun ki or ishara kiya.

“Dekho! Ye wahi khadaun hain jo Swamiji ne ghat par pehni hui thin,” unhone fusfusakar kaha. “Unhone keval ek adhovastra pehan rakha tha jaisa unhone abhi pehan rakha hai.”

Kedarnath Babu ne jab Swamiji ke charanon mein pranam kiya to Swamiji meri or dekhte hue vinodpoorn dhang se muskaraye.

“Tum is sab se itne stambhit kyon ho? Drishya jagat ki sookshm ekat a sachche yogiyon se chhipi nahi rahti. Main sudoor Kolkata mein rahne vale apne shishyon ke saamne kshanbhar mein prakat hokar unse vartaalap kar sakta hoon. Ve bhi isi prakar sthool jagat ki pratyek badha ko apni ichchhanusar paar kar sakte hain.”

Shayad mere bal-hriday mein adhyatmik utsah jagane ke uddeshya se hi Swamiji apne door-shravan aur door-darshan* ke yogbal ke bare mein mujhe batane ke liye raazi hue. Parantu utsah ke badle mujhe vismayyukt bhay ka anubhav hua. Choonki meri Ishwar-khoj ek vishesh guru Sri Yukteswarji ke margdarshan mein hi honi tay thi, jinse main abhi mila bhi nahi tha, atah Pranavanandaji ko apna guru manne ki koi pravritti mere man mein nahi uthi. Maine yeh sochte hue unki or sashankit man se dekha ki mere saamne baithe hue ve swayam hi the, ya unka pratiroop tha?

* Yogiyon ne adhyatmik vigyan ke dwara jo niyam dhoondh nikale unhi niyamon ki vaidhata ki pushti aaj bhautik vigyan apne dhang se kar raha hai. Udaharanarth, 26 November 1934 ko Royal University of Rome mein manushya ki door-darshan shakti ka pradarshan kiya gaya tha. “Snayavik manovigyan (Neuro-Psychology) ke pradhyaapak Dr. Giuseppe Calligaris ne ek vyakti ke shareer ke katipay sthanon par dabav diya aur us vyakti ne deewar ki doosri or avasthit vyaktiyon aur vastuon ka sookshmatisookshm sara vivaran bata diya. Dr. Calligaris ne upasthit pradhyaapakon ko bataya ki yadi twacha ke katipay sthan-visheshon ko vikshobhit kiya jay to vyakti ki indriyatit anubhuti prapt ho jati hai, jisse vah un sab vastuo n ko dekh sakta hai jinhe vah anyatha nahi dekh sakta. Deewar ke us paar ki vastuo n ko dekhne mein saksham banane ke liye Dr. Calligaris ne nirdharit vyakti ke vakshsthal ke dahini or ek sthan vishesh par pandrah minat tak dabav diya. Dr. Calligaris ne kaha ki jab shareer ke katipay vishesh sthanon ko vikshobhit kiya jata hai, to sambandhit vyakti kitni bhi door sthit kisi bhi vastu ko dekh sakta hai, chahe usne us vastu ko pehle kabhi dekha ho ya na dekha ho.”

Swamiji ne meri or aatmagyanoday karane vali drishti se dekhte hue tatha apne guru Maharaj ke vishay mein kuch prernadayak baatein batate hue meri ashanti door karne ki cheshta ki. “Jitne yogiyon ko main jaanta hoon un sab mein Lahiri Mahashay sabse mahan yogi the. Ve nardeh mein sakshat Ishwar the.”

Maine man hi man socha ki jab shishya bhi ichchha-matra se ek aur rakt-maans ka shareer dharan kar sakta hai, tab uske guru ke liye kaun sa chamatkar karna asambhav hoga?

“Guru ki sahayata kitni amulya hoti hai, vah suno. Main Gurudev ke ek anya shishya ke saath nitya raat ko aath ghante dhyan kiya karta tha. Din mein hum dono railway karyalay mein kaam karte the. Clerk ke karya-nirvah mein kathinai hote dekh poora samay Ish-chintan mein lagane ki meri ichchha hui. Aath varsh tak aadhi raat main dhyan mein hi bitata tha. Is sadhana ke adbhut parinaam mujhe prapt hote the, gahri adhyatmik anubhutiyon se man mein gyaan ka prakash phailta tha. Parantu us anant paramtattva aur mere beech sadaiv ek jheena parda bana rahta tha. Atimanavi ekagrata aur nishtha ke saath prayas karte rahne par bhi maine paya ki param nirvign ekatmata se main vanchit hoon. Ek din sayankal main Lahiri Mahashay ki seva mein upasthit hua aur madhyasthata ke liye maine unse prarthana ki. Hath-purvak saari raat main unse aagrah karta raha.

“‘Karunasagar Gurudev! Meri aatma itni tadap rahi hai ki main us pranpriya param-premi ke pratyaksh darshan bina ab aur jeevit nahi rah sakta.’

“‘To main kya kar sakta hoon? Tumhe adhik gehrai se dhyan karna padega.’

“‘Main aap se prarthana karta hoon, he Prabhu, mere Swami! Main aapko apne samaksh is bhautik shareer mein prakat dekh raha hoon; mujhe aashirvad deejiye ki aapke anant swaroop mein main aapke darshan kar sakoon!’

“Lahiri Mahashay ne aashirvad-mudra mein haath uthate hue kaha: ‘Tum ab jakar dhyan karo. Maine tumhare liye Brahma* se prarthana kar di hai.’

“Aparimit anand se ullasit hokar main ghar lauta. Us raat dhyan mein mujhe apne jeevan ke jwalant charam lakshya ki prapti ho gayi. Ab mujhe nirantar vah adhyatmik pension mil rahi hai. Us din se phir kabhi vah anand poorn srishta Maya ke kisi parde ke peeche chhipkar meri drishti se ojhal nahi hua.”

Pranavanandaji ka mukhmandal divya tej se damak raha tha. Ek alaukik shanti mere hridaya mein pravisht hui; sara bhay nasht ho gaya. Phir Swamiji ne aur ek gupt baat mujhe batayi.

“Kuch mahinon baad main phir Lahiri Mahashay ke charanon mein upasthit hua aur unke aseem vardan ke liye kritagyata prakat karne ka maine prayas kiya. Phir maine doosri ek baat chhedi.

* Srishta roop mein Ishwar; Sanskrit ‘brih’ se vyutpann jiska arth hai vistarit hona.

“‘Dayanidhan Gurudev! Main ab office mein kaam nahi kar sakta. Kripa karke mujhe mukt kar deejiye. Brahma mujhe nirantar madmast banaye rakhta hai.’

“‘Apni company se pension ke liye arji karo.’

“‘Itne alpakal ki naukri ke baad main pension ke liye kya karan bata sakunga?’

“‘Jo man mein aaye wahi bata do.’

“Agle din maine pension ke liye aavedan de diya. Doctor ne samay-poorv pension ke liye karan poocha.

“‘Kaam karte samay meri reedh mein mujh par kabu karnevali koi atyadhik teevr sanvedna uth ti hai. Vah poore shareer mein phail jati hai aur phir main apne kartavyon ka nirvah karne mein asamarth ho jata hoon.’*

“Aur koi prashn kiye bina doctor ne pension ke liye mere paksh mein bahut achchhi sifarish likh di aur mujhe sheeghra hi pension mil gayi. Main jaanta hoon ki doctor aur tumhare pita sahit sab sambandhit railway adhikariyon ke madhyam se Lahiri Mahashay ki daivi ichchha hi karya kar rahi thi. Un logon ne Lahiri Mahashay ke daivi nirdesh ka apne aap hi palan kiya aur mujhe akhand Ish-chintan ke liye mukt kar diya.”

* Gahan dhyan mein paramtattva ki pehli anubhuti medull a mein hoti hai aur tatpashchaat mastishk mein hoti hai. Prachand dhara ke saman chetna mein utarta paramanand sadhak ko poornatah vibhor kar deta hai, parantu bahya star par uski abhivyaktiyon ko niyantrit karna yogi seekh leta hai.

Hamari is bhet ke samay Pranavanandaji poorn siddh mahatma the. Parantu unke vyavasayik jeevan ke antim dinon ki baat kai varshon pehle ki hai; us samay ve nirvikalp samadhi ko aparivartaneey avastha mein adhishthit nahi hue the. Chetna ki us paripoorn evam sthitpragya avastha mein yogi ko is jagat mein apne kisi bhi kartavya ko karne mein koi kathinai nahi hoti.

Avakash grahan karne ke uparant Swami Pranavanandaji ne Pranava Gita naam se Srimad Bhagavad Gita ki ek atyant gahan gyaan-yukt teeka likhi, jo Bangali evam Hindi mein uplabdh hai.

Ek se adhik shareeron mein ek saath prakat hone ki shakti ek siddhi hai jiska ullekh Patanjali ke Yoga Sutra mein hai (is pustak ka prakaran 24 drishtavya). Ek saath vividh sthanon par prakat hone ki ghatnaein yug-yugantar se anek santon ke jeevan mein pradarshit hui hain.

Is asaadharaan rahasyodghatan ke uparant Swami Pranavanandaji deerghkaal tak maun rahe. Jab main bhaktibhaav se unka charansparsh kar unse jaane ke liye anumati mang raha tha, tab unhone aashirvad diya:

“Tumhara jeevan sannyas aur yogmarg ke liye hai. Tumhare pitaji aur tumhare saath meri phir ek baar bhet hogi.” Anek varshon ke uparant ye dono hi bhavishyavaniyan satya siddh hui.*

Chhate ja rahe andhkar mein Kedarnath Babu mere saath-saath chal rahe the. Maine unhe pitaji ka patra diya jo unhone sadak par lagi roshni ke prakash mein padha.

“Tumhare pitaji ne is mein apni railway company ke Kolkata karyalay mein mujhe ek pad grahan karne ka prastav diya hai. Swami Pranavanandaji ko milnewali pensionon mein se kam se kam ek pension ka adhikari ho pana kitna sukhad hota! Parantu yeh asambhav hai; main Banaras chhod kar nahi ja sakta. Khed hai ki ek saath do shareer dharan karne ka mera samay abhi nahi aaya hai.”
